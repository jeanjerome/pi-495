      - "Set `TLA2TOOLS_JAR` to the approved jar and run the conductor again: the journal shows `preparation-retenue` with the same fingerprint, then the same block, and no exploration control."
    root_cause: >
      The reuse test is `precedente?.empreinte === empreinte` alone; neither the outcome of the recorded explorations
      nor the tool that ran them enters the fingerprint.
    evidence: >
      Introduced by the branch e38s05, which adds the preparation. Read in `preparer` and `composantesDe`; the
      acceptance run of e38s05 shows the reuse on a relaunch (`preparation-retenue`, then the same block, no
      exploration). The defect stops a story rather than letting one through: the only way out is a change to the
      companion or the model.
    risk_level: low
    follow_ups: >
      Reuse a blocked preparation only when every failed exploration ended on a counterexample, and examine again one
      that ended `error` or `inconclusive`, with its own test.
    status: open
