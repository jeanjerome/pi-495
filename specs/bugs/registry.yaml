      resolution moved behind the install capability of a technology; no test of either form writes under an
      excluded directory.
    evidence: >
      Mutation applied on 2026-10-07 against the branch that moves the install of npm and Maven into their
      technologies: the whole suite stays green. The line itself is unchanged from the resolution it replaced.
    risk_level: low
    follow_ups: >
