bugs:
  - bug_id: BUG-2026-09-27T170100
    date: "2026-09-27"
    title: "G1 accepts a mandatory requirement's satisfied_by_reference claim without evidence, before G2/G5 are known to catch a false one"
    severity: medium
    priority: p2
    scope: domain
    what_happened: >
      A material answer bound to a mandatory requirement passes G1 (`gateG1`, `src/domain/change/decide.ts`)
      as soon as the requirement is named, is mandatory, and the binding is observable — G1 never reads
      `satisfied_by_reference`. A specification report can mark a brand-new, never-implemented
      requirement `satisfied_by_reference: true` (a claim reserved for behaviour the project already
      honours, per the `specify` role's own instructions) and still clear G1 unchallenged.
    what_expected: >
      A material answer resolved only by a false `satisfied_by_reference` claim should not clear a gate
      on the model's word alone — some control downstream must be known to catch it, or G1 itself must
      refuse it.
    steps_to_reproduce:
      - "Write a specification report whose mandatory requirement is marked `satisfied_by_reference: true` for behaviour the reference tree does not have, with a material answer bound to it."
      - "Advance the change through G1: `gateG1` names no reason and passes."
      - "Whether `preparation.ts`'s discrimination against the reference (feeding G2) or G5's evidence review would still catch the false claim before integration was not traced in this pass."
    root_cause: >
      `satisfied_by_reference` is read by `preparation.ts` (`~line 116`) to flag a requirement as
      `undiscriminated` when the reference tree fails to exercise it, feeding a later gate's evidence —
      but `gateG1` (`~decide.ts:505-515`) never consults it before passing the requirements document, so
      a false claim is not refused at the gate meant to bind an answer to a real obligation; whether it
      is refused later depends on control paths this pass did not trace to a verdict.
    evidence: >
      Read during the round-1 review of e01s03 (`specs/verifications/e01s03-relecture.md`, P2):
      `gateG1`'s mandatory-answer loop names no check on `satisfied_by_reference`; `preparation.ts:116-126`
      is the only reader found, and it is proved only by the tests that already pass, not by a new
      failing one exercising a false claim. G2 and G5's own handling of the case was not traced.
    reproduced: >
      Reproduced on 2026-10-01 with a scripted agent on the reference npm target (`npm run campagne -- npm`).
      A specification report whose only mandatory requirement asks for a function the tree does not have,
      marked `satisfied_by_reference: true`, and an implementation that only appends a comment, pass G0 to G5
      (unit, coverage and mutation PASS, `lastFit` absent from the candidate): `diagnoseControlCapability`
      reports no undiscriminated requirement while the reference suite executes a test, so no failing test is
      prepared, no arbitration is asked, and every control stays green on the reference and on the candidate.
      The same report with `satisfied_by_reference: false` stops at "no test can judge R1" and waits for the
      owner. G5 asks for a human acceptance only under `policy.g5_human_acceptance`, which is off by default.
    risk_level: medium
    follow_ups: >
      Owner decision of 2026-10-01: no human confirmation, which would stop the automatic process, and no
      mechanism now. The defect is carried by epic `e13`: a mandatory requirement the specification says the
      reference already satisfies is proved by a characterization test that must pass on the reference, and a
      claim that test refutes follows the path of a requirement asking for something new. Until then the gap
      stays open and reproduced. The mixed case, where a prepared failing test for one requirement lifts the
      check on every other, is read in the code and not reproduced.
    status: open
  - bug_id: BUG-2026-09-28T103000
    date: "2026-09-28"
    title: "environment.change and evidence.invalidate accept a closed change, and invalidating G5 there says a closed accepted change pending"
    severity: low
    priority: p3
    scope: domain
    what_happened: >
      The kernel accepts `environment.change` and `evidence.invalidate` without requiring an active
      change (`src/domain/change/decide.ts`), and both invalidate G5. Since invalidating G5 sets an
      accepted outcome back to pending, a change closed `completed` and accepted comes out `pending`,
      where main kept `accepted`. No code of the extension emits either command. The reset of the
      outcome is introduced by the branch that reruns a verification cut short; the missing check of an
      active change predates it.
    what_expected: >
      A closed change keeps its outcome: a command that invalidates a gate is refused once the change is
      closed.
    steps_to_reproduce:
      - "At the kernel, take a change to `closed completed` with outcome `accepted`."
      - "Run `environment.change`, or `evidence.invalidate` on one of its evidence: the outcome is `pending`."
    root_cause: >
      `environmentChange` and `evidenceInvalidate` do not require an active change, unlike every other
      command that changes a gate.
    evidence: >
      Review record `specs/verifications/reprise-de-verification-et-revocation-relecture.md`, round 1,
      R1-6 and P4: kernel probes K5 (reviewer A) and K3 (reviewer B), `closed/completed` with outcome
      `pending`.
    risk_level: low
    follow_ups: >
      Require an active change for both commands, with a red kernel test on a closed accepted change.
      The fix adds a refusal, so it follows the review gate.
    status: open
  - bug_id: BUG-2026-09-28T103100
    date: "2026-09-28"
    title: "The engineering report lists as valid the candidate observations of a verification pass the kernel never recorded"
    severity: low
    priority: p3
    scope: application
    what_happened: >
      `engineeringReport` (`src/application/report.ts`) takes a stored observation as valid unless the
      kernel recorded it invalid (`?? true`). A pass the pause suspended, or one a technical rerun set
      aside, stores its observations without the kernel recording them. The report of a change accepted
      on the pass run again lists them beside the recorded ones, all valid:
      `unit INDETERMINATE valid true evd_0035` beside `unit PASS evd_0040`, where only `evd_0040` and
      `evd_0041` are recorded. Made reachable once more by the branch that reruns a verification cut
      short; a technical rerun gives the same shape on main.
    what_expected: >
      The report tells an observation on the candidate the kernel recorded from one it never recorded.
    steps_to_reproduce:
      - "Pause a change while its first control runs on the candidate, resume it, and conduct it to its acceptance."
      - "Run `/495 report`: the observations of the suspended pass are listed as valid."
    root_cause: >
      The default covers the qualification observations on the reference, which the kernel does not
      record either, and takes in the candidate observations of a pass cut short with them.
    evidence: >
      Review record `specs/verifications/reprise-de-verification-et-revocation-relecture.md`, round 1,
      R1-7: probe P5 of reviewers A and B.
    risk_level: low
    follow_ups: >
      Mark an observation on the candidate that the kernel never recorded as not recorded, with a red
      test on the paused path. The fix adds a behavior, so it follows the review gate.
    status: open
  - bug_id: BUG-2026-09-28T103400
    date: "2026-09-28"
    title: "An integration run again after the owner confirmed its Git effect not applied is refused for good by its reused key"
    severity: low
    priority: p3
    scope: adapters
    what_happened: >
      After an IH-12 reconciliation `confirm_not_applied`, the kernel accepts a new preparation of the
      integration, but the ledger refuses its key `integrate:<digest>:<before>`
      (`src/adapters/git/integrator.ts`), already held: the destination head has not moved, since the
      effect was not applied, so the key is the same. Every later attempt is refused the same way.
    what_expected: >
      An integration the owner confirmed not applied can be run again.
    steps_to_reproduce:
      - "Take an integration to an uncertain effect, and answer IH-12 `confirm_not_applied`."
      - "Prepare the integration again: the ledger refuses the reused key."
    root_cause: >
      The key names the candidate and the destination head, which a reconciliation that found nothing
      applied leaves unchanged.
    evidence: >
      Review record `specs/verifications/reprise-de-verification-et-revocation-relecture.md`, round 1,
      P2: kernel and ledger probe K6 (reviewer A).
    risk_level: low
    follow_ups: >
      Decide what tells the new attempt apart in the key, then a red test from a `confirm_not_applied`.
    status: open
  - bug_id: BUG-2026-09-28T113000
    date: "2026-09-28"
    title: "A verification an earlier build left open on a stopped change makes its resume lift any stop, or refuse itself on a paused change"
    severity: low
    priority: p3
    scope: application
    what_happened: >
      `harness.resume` (`src/application/harness.ts`) runs an open verification again before it looks at
      the change's stop: it commits `verification.rerun`, which hands a blocked change back `ready`
      whatever its stop (`src/domain/change/decide.ts`), a missing capability, an invalid configuration
      or a policy refusal included, and which the kernel refuses on a paused change, naming the resume.
      In this build the block and the pause close the verification they stop, so only a journal an
      earlier build wrote holds that state: a change it blocked, or paused, while its controls ran.
    what_expected: >
      A resume lifts only an execution error or a stop the kernel declared retryable, as
      BUG-2026-09-26T145000 settled, and ends a pause, whatever a build before this one left open.
    steps_to_reproduce:
      - "Read back a journal an earlier build wrote: a change blocked `configuration_error` while its verification is open."
      - "Run `/495 resume`: the change is `ready` and verifies again."
      - "Read back a journal an earlier build wrote: a change paused while its verification is open. Run `/495 resume`: refused, `change is paused`, naming the resume."
    root_cause: >
      The resume's branch for an interrupted verification comes before its branches for a pause and a
      stop, and `verificationRerun` lifts any block. The code is on main and in 0.2.1. The branch that
      reruns a verification cut short closes the verification at the block and at the pause, which
      keeps the state out of this build's journals: red at d62fc53, green at 897ff02, for a step that
      fails while the controls run.
    evidence: >
      Review record `specs/verifications/reprise-de-verification-et-revocation-relecture.md`, round 2,
      P-A1 (probe A2-P1 of reviewer A, with `CONFIGURATION_ERROR`) and P-A2 (probe A2-P2 of reviewer
      A). The paused case is declared in BUG-2026-09-28T081300, "Not covered", with its way out: a
      second pause closes the verification, after which the resume verifies again.
    risk_level: low
    follow_ups: >
      Let the resume close a verification left open on a stopped change before it judges the stop,
      with a red test on each journal of an earlier build. The fix adds a behavior, so it follows the
      review gate.
    status: open
  - bug_id: BUG-2026-09-29T101451
    date: "2026-09-29"
    title: "The owner who accepts a candidate is not told that its preparation rewrote an existing test"
    severity: low
    priority: p3
    scope: presentation
    what_happened: >
      A preparation that rewrites a test which existed on the reference is adopted, and its record
      names the file in `modified_existing`. That field is written to the object store and read by
      nothing else: the IH-10 dialog asks "Accepter ce candidat ?" with the gate reasons as its only
      facts, and `/495 status` does not list it. The owner who decides from Pi does not learn that
      what the target guaranteed until now was rewritten; only a reading of the object store shows it.
    what_expected: >
      The owner sees, before accepting the candidate, which existing tests the preparation modified.
    steps_to_reproduce:
      - "On a target whose `test/greet.test.js` asserts `Hello, x`, request `greet must end with an exclamation mark`."
      - "Let the preparation rewrite `test/greet.test.js`, and reach the IH-10 dialog."
      - "The dialog and `/495 status` do not name `test/greet.test.js`; the preparation record of the object store does."
    root_cause: >
      `PreparationRecord.modified_existing` (`src/application/preparation.ts`) was added to the record
      only. The IH-10 facts come from `g5.reasons` (`src/application/phases/decide.ts`), and no
      presentation reads the preparation record.
    evidence: >
      A campaign on a real Pi in RPC mode with a local model: the preparation record holds
      `modified_existing: [test/greet.test.js]` and G5 passes. The reading of `decisions.ts` and
      `decide.ts` shows that the IH-10 question carries no mention of the rewritten test.
    risk_level: low
    follow_ups: >
      Name the modified existing tests in the IH-10 facts, or in `/495 status`, or both; the
      candidate is still a proposal that only the kernel adopts, so this changes what the owner sees,
      not what the kernel decides.
    status: open
  - bug_id: BUG-2026-09-29T190000
    date: "2026-09-29"
    title: "An IH-04 question left pending when the requirements are revised stays answerable, and a prepare answered to it grants a preparation on the new requirements"
    severity: low
    priority: p3
    scope: application
    what_happened: >
      A change with an IH-04 decision pending had its requirements revised. The revision revoked the
      IH-04 answers already recorded, but not the question still waiting for one, so the verification
      design asked IH-04 a second time and two IH-04 decisions were pending, the old and the new. An answer
      "prepare" given to the old question was recorded valid, and `preparationsGranted` counted it: one
      more preparation was granted on requirements that question never named.
    what_expected: >
      An answer to a question asked on requirements that were revised since grants nothing on the
      requirements as they stand.
    steps_to_reproduce:
      - "Take a change to a pending IH-04 (two preparations retained no test able to judge R1)."
      - "Revise the requirements (`artifact.revise` on the requirements artifact) and advance: a second IH-04 is asked."
      - "Answer the first IH-04 `prepare`, then advance: a third preparation opens."
    root_cause: >
      `invalidationFor` (`src/domain/invalidation.ts`) revokes the valid IH-04 decisions of the change, and
      nothing withdraws the IH-04 decisions still pending. `preparationsGranted`
      (`src/application/phases/verification-design.ts`) counts every valid `prepare` answer without
      comparing its subject with the requirements it is counted for. Introduced by the branch, which
      makes IH-04 exist and lets a revision reach it while it is pending. Only an owner who answers
      both questions reaches it.
    evidence: >
      Reviewer probe: two IH-04 decisions pending after the revision, the old one and the new one; the
      mutation that keeps `verifiabilityDecisions` out of the invalidation fails the assign_review
      scenario, while no test pins the stale pending question.
    risk_level: low
    follow_ups: >
      Withdraw the IH-04 decisions pending when the requirements are revised, as the revocation of a
      resolution already withdraws the pending decisions, or count only the `prepare` answers whose
      subject digest equals the one asked for the requirements as they stand. Either adds a state
      transition or a refusal, so it needs its own test.
    status: open
  - bug_id: BUG-2026-09-29T210000
    date: "2026-09-29"
    title: "The facts of a human decision are written in English under a question and options in the language of the change"
    severity: low
    priority: p3
    scope: application
    what_happened: >
      A decision request puts a French question and French options to the owner, followed by facts in
      English. The IH-04 question reads "Aucun test ne peut juger <requirement id>. Que décider ?"; its
      facts are the notes of the capability diagnosis ("<id> asks for behaviour the reference does not
      have: no control that passes on the reference can detect its absence") and a `risk: without a
      control able to judge …` line. The IH-10 fact is "policy requires human acceptance (IH-10)". The
      requirement is named by its identifier, which the owner did not write.
    what_expected: >
      The whole decision request reads in the language of the change, and names a requirement by what it
      asks rather than by an identifier.
    steps_to_reproduce:
      - "Take a change in French to an IH-04 or an IH-10 decision and read the request Pi shows."
      - "The question and the options are French; the lines under `facts` are English."
    root_cause: >
      `buildDecisionRequest` (`src/application/decisions.ts`) translates the question and the options,
      and takes `facts` as finished strings. The producers write them once, in English, where the
      condition is known: the gates (`src/domain/gates/g5.ts`), the capability diagnosis
      (`src/application/preparation.ts`) and `requestVerifiabilityArbitration`
      (`src/application/phases/verification-design.ts`). The mixing was already on main for the
      decisions whose facts a gate composes, IH-10 among them; the IH-04 request adds one more English
      line to it.
    evidence: >
      Reading of `decisions.ts`, `verification-design.ts` and `g5.ts`. The acceptance run of the change
      that made IH-04 exist reported the request of an IH-04 decision on a real Pi in RPC mode, under a
      scripted agent, with a French question and English facts; that dossier was not read again here.
    risk_level: low
    follow_ups: >
      Give the facts a form the request renders per language (a code and its arguments) instead of a
      sentence, or write them in the language of the change where they are composed; and show the
      statement of a requirement instead of its identifier. Either changes what every decision shows,
      so it needs its own story.
    status: open
  - bug_id: BUG-2026-09-30T193000
    date: "2026-09-30"
    title: "A path with a control character that a change does not touch makes its coverage control indeterminate"
    severity: low
    priority: p3
    scope: application
    what_happened: >
      `introducedLinesOf` (`src/application/coverage.ts`) keeps every non-deleted path of the tree that carries a
      control character, with no line, including one whose state is `unchanged`. `parseLcov` refuses an introduced
      set holding such a path, so a change that writes no line in a repository that already holds a file named with
      a tab or a line break ends with the coverage control `INDETERMINATE` where it would have passed without
      reading a report. The JaCoCo and PIT readers receive the same zero-line entry, which no scenario of the
      story asks for.
    what_expected: >
      A path the change does not touch and no report of the changed lines can name is not held against the change;
      only a path a runner may write into the report the change is measured on makes that report unreadable.
    steps_to_reproduce:
      - "In a Node target that asks for coverage, track a file whose name holds a tab."
      - "Accept a candidate that only deletes lines from another file, so that it introduces none."
      - "The coverage control ends `INDETERMINATE` naming the tracked file."
    root_cause: >
      Not a mistake of the guard: a file already in the tree, loaded by the test run, can forge a record as well as
      an added one, so the guard keeps it on purpose (test "keeps a path that carries a control character even when
      the change introduces no line in it", case `same/`). The cost is the refusal for a change that would have
      needed no report. Introduced by the branch e12s04.
    evidence: >
      Read on 2026-09-30 in `src/application/coverage.ts` and `src/adapters/execution/lcov.ts`; covered by the test
      above, which asserts the `unchanged` path is kept. The end-to-end run on a target holding such a file was
      not made.
    risk_level: low
    follow_ups: >
      Decide whether an `unchanged` path is kept only when the change introduces at least one line (a report is read),
      and keep it out of the entries handed to the JaCoCo and PIT readers; a test on a change with no introduced
      line in a tree holding an `unchanged` path with a control character.
    status: open
  - bug_id: BUG-2026-09-30T200000
    date: "2026-09-30"
    title: "No test holds the wiring that hands the adopted complement to the qualification of a sensor"
    severity: low
    priority: p3
    scope: application
    what_happened: >
      `designVerification` (`src/application/phases/verification-design.ts`) passes `complements` to
      `ctx.verification.qualify`, so that the witness copies where the kernel qualifies a sensor carry the
      adopted complement. Every qualification test calls the coordinator with `complements` by hand, and the
      only test that runs the whole preparation on a campaign does not look at the qualification copies.
      Replacing `complements,` with `complements: [],` in that call leaves the whole suite as green as before
      (only the two Seatbelt failures of this environment, which fail without the change too).
    what_expected: >
      A test fails when the kernel qualifies a sensor on copies that lack the package.json the adopted
      complement wrote.
    steps_to_reproduce:
      - "In `designVerification`, replace `complements,` with `complements: [],` in the call to `qualify`."
      - "Run `npm test`: no test fails on that mutation."
    root_cause: >
      The wiring is one property of one call and the tests of the complement start one layer below it. Introduced
      by the branch e12s07, which added the property.
    evidence: >
      Mutation run by the reviewer on 2026-09-30, and the code read on the same date in
      `src/application/phases/verification-design.ts`; the test names of `test/v2-kernel/verification.test.ts` and
      `test/v2-kernel/preparation.test.ts` call `qualify` or `prepare` with `complements` given directly.
    risk_level: low
    follow_ups: >
      A test on `designVerification` with an adopted complement that reads the files of the qualification copy
      the fake coordinator receives (or its `complements` argument); red on the mutation above.
    status: open
  - bug_id: BUG-2026-09-30T201000
    date: "2026-09-30"
    title: "No integration test exercises a node_modules/ path at the project root, the one an adopted complement writes"
    severity: low
    priority: p3
    scope: adapters
    what_happened: >
      The integration stage never indexes a path of `node_modules/` (`inInstalledDependencies` in
      `indexablePaths`, `src/adapters/git/integrator.ts`), whether or not the project ignores it. The test of
      that promise in `test/v2-kernel/export-integration.test.ts` adds `packages/app/node_modules/x/index.js`, a nested
      path, because G4 now refuses a root `node_modules/` no complement wrote. The root path the story names, and
      the one an adopted complement really writes, is not exercised by any integration test. The predicate is the
      same for both paths, so the code keeps the promise; only the test is narrower than the promise.
    what_expected: >
      A test in which a root `node_modules/x/index.js` written by an adopted complement stays out of the
      integration commit and out of the index, and is listed in the receipt.
    steps_to_reproduce:
      - "In `indexablePaths`, replace the filter by `const own = [...paths]`: the nested-path test fails."
      - "No test adds a root `node_modules/` path to the project, so nothing pins the path the story names."
    root_cause: >
      The test moved to a nested path to stay reachable under G4 and kept that path. Introduced by the branch
      e12s07.
    evidence: >
      Read on 2026-09-30 in `src/adapters/git/integrator.ts` and `test/v2-kernel/export-integration.test.ts`; the
      reviewer's mutation fails the nested test only. A root-path variant was not run.
    risk_level: low
    follow_ups: >
      Add the root-path case, its files written into the project by the fake complement of the integration
      fixture, and assert the index and the receipt.
    status: open
  - bug_id: BUG-2026-09-30T202000
    date: "2026-09-30"
    title: "A complement file the reference does not hold, deleted by the producer, is invisible to G4"
    severity: low
    priority: p3
    scope: domain
    what_happened: >
      `protectedPathsChanged` (`src/domain/gates/g4.ts`) refuses a complement file that the reference holds and
      the candidate returns unchanged (`restored`). A complement file absent from the reference, under
      `node_modules/` for instance, that the producer deletes has no entry in the manifest, so G4 judges nothing
      about it. The test "a manifest without the complement file judges nothing about it"
      (`test/v1-adapters/node-stack.test.ts`) asserts that silence.
    what_expected: >
      A producer can neither undo nor extend the complement: deleting one of its files is refused as a
      modification, whatever path it sits on.
    steps_to_reproduce:
      - "Adopt a complement that writes a file under `node_modules/`, absent from the reference snapshot."
      - "Have the candidate delete that file: the manifest holds no entry for it and `altered` stays empty."
    root_cause: >
      The check reads the manifest, which only lists paths present in the reference or in the candidate; a path
      in neither has no entry. The code on this point did not change with the branch e12s07 and a deletion
      removes a dependency without adding one, so the branch neither introduces nor makes it reachable.
    evidence: >
      Read on 2026-09-30 in `src/domain/gates/g4.ts` and asserted by the test named above; the end-to-end
      deletion was not run.
    risk_level: low
    follow_ups: >
      Decide whether G4 receives the complement paths as a required set and refuses one missing from the
      candidate; a test on a candidate that deletes an adopted complement file the reference does not hold.
    status: open
  - bug_id: BUG-2026-09-30T203000
    date: "2026-09-30"
    title: "The install of an adopted complement runs again, network open, each time the verification design resumes"
    severity: low
    priority: p3
    scope: application
    what_happened: >
      `designVerification` (`src/application/phases/verification-design.ts`) calls `adoptInstalls` on every
      resumption of the design for as long as the owner's answer to adopt the complement holds, and each call
      runs `npm install` in a fresh copy with the network open. After the adoption and an `assign_review`, a
      probe counted two `npm install` runs for one answer; the test counts the installs only before
      `assign_review`. The answer is valid throughout, so the promise that the step runs only on the owner's
      valid answer holds; the owner is not told that the network opens again.
    what_expected: >
      The network opens once per answer: a resumption of the design with the answer still valid reuses what the
      first install was accepted with, or says that it installs again.
    steps_to_reproduce:
      - "Adopt the complement on a vitest target with package-lock.json, then answer assign_review."
      - "Count the `npm install` commands the sandbox received: two, where the owner answered once."
    root_cause: >
      The result of an accepted install is not kept between resumptions: only the files it added and the packages
      it listed reach the protocol, and only at the freeze, so a resumption before it recomputes them. Introduced
      by the branch e12s08.
    evidence: >
      Probe of the reviewer on 2026-09-30 (`FakeNpmSandbox.installs()` equals 2 at the end of the run); not
      re-run here.
    risk_level: low
    follow_ups: >
      Decide between keeping the accepted result in the dossier for these requirements, as the failure record
      already is, and announcing the new install to the owner; a test counting the installs to the freeze.
    status: open
  - bug_id: BUG-2026-09-30T204000
    date: "2026-09-30"
    title: "An install that fails no longer keeps the edit of another recommendation from being applied"
    severity: low
    priority: p3
    scope: application
    what_happened: >
      `designVerification` (`src/application/phases/verification-design.ts`) applies the edits of the
      recommendations in the copy whenever the owner adopted the complement, whether or not an install of
