  - bug_id: BUG-2026-10-12T181801
    date: "2026-10-12"
    title: "The protected-path match folds ẞ (U+1E9E) to ß, where an APFS volume opens it as ss"
    severity: low
    priority: p3
    scope: domain
    what_happened: >
      `foldName` in `src/domain/gates/g4.ts` folds a path by NFKD, then upper case, then lower case. `ẞ`, the capital
      sharp s, stays `ẞ` in upper case and comes out as `ß`, while `ß` and `ss` both come out as `ss`. An APFS volume
      opens a name written with `ẞ` as the same file as one written with `ss`, so a candidate that wrote such a name in
      place of a protected path containing `ss` would not be refused as altering it. No protected path whose presence
      a tool probes today (the Stryker, vitest, vite, mocha and jest configurations, `test/`, `package.json`) contains
      `ss`, so the gap opens no bypass yet.
    what_expected: >
      The fold equates every name the volume opens as the same file, `ẞ` and `ss` included, for any protected path a
      target's technology declares.
    steps_to_reproduce:
      - "Evaluate `s.normalize('NFKD').toUpperCase().toLowerCase()` on '\\u1E9E', '\\u00DF' and 'ss': it gives 'ß', 'ss', 'ss'."
      - "On an APFS volume, create a file named 'ss' and test `existsSync('\\u1E9E')`: true."
    root_cause: >
      Lower-casing after upper-casing maps `ẞ` to `ß` and stops there; `ß` reaches `ss` only through upper case, a
      step the fold has already taken.
    evidence: >
      Found in the review of e40s05, introduced by that branch: a probe of `existsSync` on the volume over every BMP
      character and planes 1 and 1E9xx, against each ASCII letter, digit, `-`, `_` and `.` and the ligature pairs,
      found this one equivalence `foldName` misses.
    risk_level: low
    follow_ups: >
      Fold once more to upper then lower case, or fold `ẞ` explicitly, with a test on a protected path containing `ss`.
    status: open
  - bug_id: BUG-2026-10-12T222000
    date: "2026-10-12"
    title: "A declared control that fails on the reference passes G5 on the candidate as a tolerated preexisting finding"
    severity: medium
    priority: p2
    scope: application
    what_happened: >
      A control the owner declares in `policy.project_controls` is judged on the candidate against its run on the
      reference (VER-08, `no_aggravation`). When its command fails on both for the same reason, the candidate's evidence
      is PASS with the note "this control fails on nothing the reference does not already carry: 1 preexisting
      finding(s) tolerated, none aggravated", and G5 accepts. A declared control that tests starting a sandbox of their
      own fail confined, because Seatbelt refuses a second profile, therefore passes G5 without having judged anything;
      the confinement failure is hidden as a preexisting finding.
    what_expected: >
      A declared control is required to pass on the candidate (README, `policy.project_controls`): a failure its
      command shares with the reference does not stand for a pass, or at least the verdict says that the control never
      passed on either side.
    steps_to_reproduce:
      - "Declare in config.json a control whose command writes outside the copy (~/x/marques.log) under Seatbelt, without `unconfined`."
      - "Drive a change to G5 with the scripted agent (bench ~/.495-campagnes/scripts/e40s06-run.sh confine1 … confine)."
      - "Read the record: sandbox-tests FAIL exit_code=1 on the reference, PASS exit_code=1 on the candidate with the tolerance note; G5 PASS."
    root_cause: >
      Declared controls are read through their exit code and go through the same differential reading as the detected
      ones, where a failure shared with the reference is a preexisting finding.
    evidence: >
      Campaign e40s06-confine1 on 2026-10-12 (build at 024054d5); the behaviour predates e40s06, which neither changes
      nor reaches it.
    risk_level: medium
    follow_ups: >
      Decide with the owner whether a declared control is exempt from the tolerance of preexisting findings.
    status: open
