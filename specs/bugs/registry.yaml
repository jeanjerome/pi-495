      - "`/495 advance` blocks on BUDGET_EXHAUSTED; `/495 resume` returns ready; the next advance blocks again."
    root_cause: >
      The loop predates the branch that reruns a verification cut short; that branch removed the
      only indication the stop carried, `request_decision:IH-07`, which was wrong.
    evidence: >
      Review record of the branch, round 6, R6-3, probe of reviewer B with `increment_ms: 0` at 37626c6.
    risk_level: low
    follow_ups: "none"
    status: open
  - bug_id: BUG-2026-09-28T163500
    date: "2026-09-28"
    title: "A phase refusal names `expected_phase:<phase>` in its structured details, which no /495 subcommand offers"
    severity: low
    priority: p3
    scope: domain
    what_happened: >
      `requirePhase` in `src/domain/change/decide.ts` refuses with `next_actions:
      ['expected_phase:clarifying']`, which `/495 close` and `/495 revoke` carry in the structured
