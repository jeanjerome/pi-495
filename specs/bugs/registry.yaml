      "protocol not frozen". The stable controller of pi-495 (`specs/experiments/e38/dogfood/config.json`) names
      `test/*.test.js`, `test/*.test.ts`, `test/v0-pure/**/*.test.ts` and `test/cycle/**/*.test.ts`, none of which
      matches a `.mjs` witness, so a dogfooding change whose owner adopts the coverage complement would block there.
