      `text.split("\n").length - (text.endsWith("\n") ? 1 : 0)`. For an empty file, `"".split("\n")` has one
      element and the text does not end with a newline, so the file counts one line, and `checkArchitectureMap`
      accepts a hint at line 1 of a file that has none.
