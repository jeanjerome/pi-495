      finds, without a `stat` size check; the bound sits in `parseReport` (`src/adapters/execution/parsers.ts`),
      after the read. The same read is used by the JaCoCo and PIT controls.
    evidence: >
      Read on 2026-09-30; not run. The JUnit reader is bounded by test/v1-adapters/junit-reader.test.ts, which passes the
      oversized document as a string and so does not exercise the file read.
