    severity: medium
    priority: p2
    scope: application
    what_happened: >
      `withSuitePaths` (`src/application/project-controls.ts`) appends the profile's `suite_paths` to the suite the
      technology detects. The Node coverage control reads the LCOV report that suite writes, and qualifies on witness
      tests written as `test/495-covered-witness.test.mjs` and `test/495-uncovered-witness.test.mjs`
