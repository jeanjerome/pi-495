      `assign_review`. The answer is valid throughout, so the promise that the step runs only on the owner's
      valid answer holds; the owner is not told that the network opens again.
    what_expected: >
      The network opens once per answer: a resumption of the design with the answer still valid reuses what the
      first install was accepted with, or says that it installs again.
