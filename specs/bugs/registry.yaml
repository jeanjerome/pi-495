  - bug_id: BUG-2026-10-08T010000
    date: "2026-10-08"
    title: "An install the inspection refuses leaves what it wrote in the copy the positive witnesses then run in, so a control is qualified, or refused, against files the owner never adopted"
    severity: medium
    priority: p2
    scope: application
    what_happened: >
      The verification design (`src/application/phases/verification-design.ts`) creates one copy of the
      reference, brings the adopted quality referential and the adopted complements into it, then hands that same
      copy to the qualification as its positive copy. When the inspection refuses an install, `bringInstalls`
      (`src/application/installation.ts`) returns the refusal but leaves every file the manager wrote in that
      copy. On a fictitious project whose manager also rewrites `src/greeting.txt`, the referential is refused as
      it should be, yet the positive witness of the test control then reads the rewritten file and fails
      ("expected Hello, got Hello, rewritten"), so the frozen protocol names that control a blind spot although
      it is green on the reference. The same happens with npm on main, where the install also runs in that copy.
    what_expected: >
      A refused install changes nothing the rest of the phase reads: the copy is restored to the reference, or the
      install runs in a copy of its own whose accepted files alone are written into the copy the qualification
      uses.
    steps_to_reproduce:
      - "Give the fictitious technology a manager that writes its package under `fict_modules/` and also rewrites `src/greeting.txt`, and a project whose test case expects `src/greeting.txt=Hello`."
      - "Ask a survey with a quality requirement and adopt the proposed referential."
      - "Read the survey: the requirement is a blind spot naming `src/greeting.txt`, and the control `fict-tests` is a blind spot because its positive witness read `Hello, rewritten`."
    root_cause: >
      An install in the copy has no undo: the copy that `settleQualityReferential` and `adoptInstalls` change is
      the `positive` handle of `ctx.verification.qualify`, and a failed result does not restore it.
    evidence: >
      Acceptance run of 2026-10-07 at f158d24d, dossier `~/.495-campagnes/e37s04-c2-reecrit-tete`: the frozen
      protocol carries no referential and only `fict-tests`, which the survey names "not qualified: positive
      witness gave FAIL: src/greeting.txt: expected Hello, got Hello, rewritten", while its evidence on the
      reference is PASS; the project digest is unchanged.
    risk_level: medium
    follow_ups: >
      Restore the copy after a refused install, or install in a copy of its own and write only the accepted files
      into the qualification copy; add a test where a refused install rewrites a file a control reads and see that
      control qualified.
    status: open
  - bug_id: BUG-2026-10-08T010100
