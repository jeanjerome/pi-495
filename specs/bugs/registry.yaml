bugs:
  - bug_id: BUG-2026-09-27T170100
    date: "2026-09-27"
    title: "G1 accepts a mandatory requirement's satisfied_by_reference claim without evidence, before G2/G5 are known to catch a false one"
    severity: medium
    priority: p2
    scope: domain
    what_happened: >
      A material answer bound to a mandatory requirement passes G1 (`gateG1`, `src/domain/change/decide.ts`)
      as soon as the requirement is named, is mandatory, and the binding is observable — G1 never reads
      `satisfied_by_reference`. A specification report can mark a brand-new, never-implemented
      requirement `satisfied_by_reference: true` (a claim reserved for behaviour the project already
      honours, per the `specify` role's own instructions) and still clear G1 unchallenged.
    what_expected: >
      A material answer resolved only by a false `satisfied_by_reference` claim should not clear a gate
      on the model's word alone — some control downstream must be known to catch it, or G1 itself must
      refuse it.
    steps_to_reproduce:
      - "Write a specification report whose mandatory requirement is marked `satisfied_by_reference: true` for behaviour the reference tree does not have, with a material answer bound to it."
      - "Advance the change through G1: `gateG1` names no reason and passes."
      - "Whether `preparation.ts`'s discrimination against the reference (feeding G2) or G5's evidence review would still catch the false claim before integration was not traced in this pass."
    root_cause: >
      `satisfied_by_reference` is read by `preparation.ts` (`~line 116`) to flag a requirement as
      `undiscriminated` when the reference tree fails to exercise it, feeding a later gate's evidence —
      but `gateG1` (`~decide.ts:505-515`) never consults it before passing the requirements document, so
      a false claim is not refused at the gate meant to bind an answer to a real obligation; whether it
      is refused later depends on control paths this pass did not trace to a verdict.
    evidence: >
      Read during the round-1 review of e01s03 (`specs/verifications/e01s03-relecture.md`, P2):
      `gateG1`'s mandatory-answer loop names no check on `satisfied_by_reference`; `preparation.ts:116-126`
      is the only reader found, and it is proved only by the tests that already pass, not by a new
      failing one exercising a false claim. G2 and G5's own handling of the case was not traced.
    reproduced: >
      Reproduced on 2026-10-01 with a scripted agent on the reference npm target (`npm run campagne -- npm`).
      A specification report whose only mandatory requirement asks for a function the tree does not have,
      marked `satisfied_by_reference: true`, and an implementation that only appends a comment, pass G0 to G5
      (unit, coverage and mutation PASS, `lastFit` absent from the candidate): `diagnoseControlCapability`
      reports no undiscriminated requirement while the reference suite executes a test, so no failing test is
      prepared, no arbitration is asked, and every control stays green on the reference and on the candidate.
      The same report with `satisfied_by_reference: false` stops at "no test can judge R1" and waits for the
      owner. G5 asks for a human acceptance only under `policy.g5_human_acceptance`, which is off by default.
    risk_level: medium
    follow_ups: >
      Owner decision of 2026-10-01: no human confirmation, which would stop the automatic process, and no
      mechanism now. The defect is carried by epic `e13`: a mandatory requirement the specification says the
      reference already satisfies is proved by a characterization test that must pass on the reference, and a
      claim that test refutes follows the path of a requirement asking for something new. Until then the gap
      stays open and reproduced. The mixed case, where a prepared failing test for one requirement lifts the
      check on every other, is read in the code and not reproduced.
    status: open
  - bug_id: BUG-2026-09-28T013100
    date: "2026-09-28"
    title: "The engineering report lists requirements refused at G1 as the change's requirements"
    severity: low
    priority: p3
    scope: application
    what_happened: >
      `Harness.report` reads the requirements and the protocol through `ArtifactRepository.latest`,
      which falls back on the last proposal when nothing is adopted. After a refusal at G1 the report
      lists under Requirements a document G1 refused, although `RequirementLine`
      (`src/application/report.ts`) is defined as an adopted requirement. The part a revocation made
      reachable is fixed: nothing proposed before a revocation is served any more.
    what_expected: >
      The report lists the requirements adopted at G1, and none while none is adopted.
    steps_to_reproduce:
      - "Take a change whose requirements G1 refuses."
      - "Run `/495 report`: the refused requirements are listed as the change's."
    root_cause: >
      The report asks for the latest requirements rather than the adopted ones. Present on main before
      the revocation branch.
    evidence: >
      `src/application/harness.ts` `report` reads `latest(state, "requirements")`;
      `src/application/report.ts` documents `RequirementLine` as an adopted requirement. Review record
      `specs/verifications/e01s04-relecture.md`, round 1, P1.
    risk_level: low
    follow_ups: >
      Decide what the report shows before G1 adopts anything, then read the adoption alone, with a red
      test on a refusal at G1.
    status: open
  - bug_id: BUG-2026-09-28T103000
    date: "2026-09-28"
    title: "environment.change and evidence.invalidate accept a closed change, and invalidating G5 there says a closed accepted change pending"
    severity: low
    priority: p3
    scope: domain
    what_happened: >
      The kernel accepts `environment.change` and `evidence.invalidate` without requiring an active
      change (`src/domain/change/decide.ts`), and both invalidate G5. Since invalidating G5 sets an
      accepted outcome back to pending, a change closed `completed` and accepted comes out `pending`,
      where main kept `accepted`. No code of the extension emits either command. The reset of the
      outcome is introduced by the branch that reruns a verification cut short; the missing check of an
      active change predates it.
    what_expected: >
      A closed change keeps its outcome: a command that invalidates a gate is refused once the change is
      closed.
    steps_to_reproduce:
      - "At the kernel, take a change to `closed completed` with outcome `accepted`."
      - "Run `environment.change`, or `evidence.invalidate` on one of its evidence: the outcome is `pending`."
    root_cause: >
      `environmentChange` and `evidenceInvalidate` do not require an active change, unlike every other
      command that changes a gate.
    evidence: >
      Review record `specs/verifications/reprise-de-verification-et-revocation-relecture.md`, round 1,
      R1-6 and P4: kernel probes K5 (reviewer A) and K3 (reviewer B), `closed/completed` with outcome
      `pending`.
    risk_level: low
    follow_ups: >
      Require an active change for both commands, with a red kernel test on a closed accepted change.
      The fix adds a refusal, so it follows the review gate.
    status: open
  - bug_id: BUG-2026-09-28T103100
    date: "2026-09-28"
    title: "The engineering report lists as valid the candidate observations of a verification pass the kernel never recorded"
    severity: low
    priority: p3
    scope: application
    what_happened: >
      `engineeringReport` (`src/application/report.ts`) takes a stored observation as valid unless the
      kernel recorded it invalid (`?? true`). A pass the pause suspended, or one a technical rerun set
      aside, stores its observations without the kernel recording them. The report of a change accepted
      on the pass run again lists them beside the recorded ones, all valid:
      `unit INDETERMINATE valid true evd_0035` beside `unit PASS evd_0040`, where only `evd_0040` and
      `evd_0041` are recorded. Made reachable once more by the branch that reruns a verification cut
      short; a technical rerun gives the same shape on main.
    what_expected: >
      The report tells an observation on the candidate the kernel recorded from one it never recorded.
    steps_to_reproduce:
      - "Pause a change while its first control runs on the candidate, resume it, and conduct it to its acceptance."
      - "Run `/495 report`: the observations of the suspended pass are listed as valid."
    root_cause: >
      The default covers the qualification observations on the reference, which the kernel does not
      record either, and takes in the candidate observations of a pass cut short with them.
    evidence: >
      Review record `specs/verifications/reprise-de-verification-et-revocation-relecture.md`, round 1,
      R1-7: probe P5 of reviewers A and B.
    risk_level: low
    follow_ups: >
      Mark an observation on the candidate that the kernel never recorded as not recorded, with a red
      test on the paused path. The fix adds a behavior, so it follows the review gate.
    status: open
  - bug_id: BUG-2026-09-28T103200
    date: "2026-09-28"
    title: "The next action a kernel refusal names reaches only the structured channel, never the text a screen shows"
    severity: low
    priority: p3
    scope: extension
    what_happened: >
      `/495` shows a kernel refusal as `495 error: CODE: message` (`src/extension/command.ts`, the
      command's catch and `actOnQuestion`). The next actions travel only in the details, which an RPC or
      JSON host reads. On a screen, a revocation refused while a verification is open does not say that
      the pause is the way on. The display predates the branch that reruns a verification cut short,
      which gives the revocation's refusal its next actions.
    what_expected: >
      The text of a refusal names its next actions, as the detail of a block already does
      (`(next: …)`).
    steps_to_reproduce:
      - "In the TUI, take a change whose verification is open, and run `/495 revoke q1`."
      - "The screen shows `495 error: OPERATION_ACTIVE: …` and no next action."
    root_cause: >
      The text of the refusal is built from its code and message alone.
    evidence: >
      Review record `specs/verifications/reprise-de-verification-et-revocation-relecture.md`, round 1,
      R1-8, read in `command.ts` by the coordinator.
    risk_level: low
    follow_ups: >
      Append `(next: …)` to the refusal text when it carries next actions, with a red test on a
      `/495 revoke` refused. The fix adds a behavior, so it follows the review gate.
    status: open
  - bug_id: BUG-2026-09-28T103300
    date: "2026-09-28"
    title: "Two changes on the same candidate content collide on the verification key when they start their verification at the same revision"
    severity: low
    priority: p3
    scope: application
    what_happened: >
      The verification key is `verify:<candidate digest>:<revision>`
      (`src/application/phases/verify.ts`). The ledger is shared by every change of the machine
      (`~/.495/state.sqlite`) and the manifest digest follows from the content, so two changes on the
      same content that start their verification at the same revision derive the same key: the second
      is refused `OPERATION_ACTIVE` by the ledger and blocked. On main the collision, at `:0`, blocked
      for good; the branch that reruns a verification cut short narrows it to equal revisions, and a
      resume lifts it.
    what_expected: >
      One change's verification never refuses another's.
    steps_to_reproduce:
      - "Take two changes on the same project content to their verification at the same revision."
      - "The second verification is refused by the key the first one holds."
    root_cause: >
      The key names the work but not the change it belongs to.
    evidence: >
      Review record `specs/verifications/reprise-de-verification-et-revocation-relecture.md`, round 1,
      P1: probes P4 (reviewer A) and P3 (reviewer B).
    risk_level: low
    follow_ups: >
      Name the change in the key, with a red test of two changes on the same content.
    status: open
  - bug_id: BUG-2026-09-28T103400
    date: "2026-09-28"
    title: "An integration run again after the owner confirmed its Git effect not applied is refused for good by its reused key"
    severity: low
    priority: p3
    scope: adapters
    what_happened: >
      After an IH-12 reconciliation `confirm_not_applied`, the kernel accepts a new preparation of the
      integration, but the ledger refuses its key `integrate:<digest>:<before>`
      (`src/adapters/git/integrator.ts`), already held: the destination head has not moved, since the
      effect was not applied, so the key is the same. Every later attempt is refused the same way.
    what_expected: >
      An integration the owner confirmed not applied can be run again.
    steps_to_reproduce:
      - "Take an integration to an uncertain effect, and answer IH-12 `confirm_not_applied`."
      - "Prepare the integration again: the ledger refuses the reused key."
    root_cause: >
      The key names the candidate and the destination head, which a reconciliation that found nothing
      applied leaves unchanged.
    evidence: >
      Review record `specs/verifications/reprise-de-verification-et-revocation-relecture.md`, round 1,
      P2: kernel and ledger probe K6 (reviewer A).
    risk_level: low
    follow_ups: >
      Decide what tells the new attempt apart in the key, then a red test from a `confirm_not_applied`.
    status: open
  - bug_id: BUG-2026-09-28T113000
    date: "2026-09-28"
    title: "A verification an earlier build left open on a stopped change makes its resume lift any stop, or refuse itself on a paused change"
    severity: low
    priority: p3
    scope: application
    what_happened: >
      `harness.resume` (`src/application/harness.ts`) runs an open verification again before it looks at
      the change's stop: it commits `verification.rerun`, which hands a blocked change back `ready`
      whatever its stop (`src/domain/change/decide.ts`), a missing capability, an invalid configuration
      or a policy refusal included, and which the kernel refuses on a paused change, naming the resume.
      In this build the block and the pause close the verification they stop, so only a journal an
      earlier build wrote holds that state: a change it blocked, or paused, while its controls ran.
    what_expected: >
      A resume lifts only an execution error or a stop the kernel declared retryable, as
      BUG-2026-09-26T145000 settled, and ends a pause, whatever a build before this one left open.
    steps_to_reproduce:
      - "Read back a journal an earlier build wrote: a change blocked `configuration_error` while its verification is open."
      - "Run `/495 resume`: the change is `ready` and verifies again."
      - "Read back a journal an earlier build wrote: a change paused while its verification is open. Run `/495 resume`: refused, `change is paused`, naming the resume."
    root_cause: >
      The resume's branch for an interrupted verification comes before its branches for a pause and a
      stop, and `verificationRerun` lifts any block. The code is on main and in 0.2.1. The branch that
      reruns a verification cut short closes the verification at the block and at the pause, which
      keeps the state out of this build's journals: red at d62fc53, green at 897ff02, for a step that
      fails while the controls run.
    evidence: >
      Review record `specs/verifications/reprise-de-verification-et-revocation-relecture.md`, round 2,
      P-A1 (probe A2-P1 of reviewer A, with `CONFIGURATION_ERROR`) and P-A2 (probe A2-P2 of reviewer
      A). The paused case is declared in BUG-2026-09-28T081300, "Not covered", with its way out: a
      second pause closes the verification, after which the resume verifies again.
    risk_level: low
    follow_ups: >
      Let the resume close a verification left open on a stopped change before it judges the stop,
      with a red test on each journal of an earlier build. The fix adds a behavior, so it follows the
      review gate.
    status: open
  - bug_id: BUG-2026-09-28T163300
    date: "2026-09-28"
    title: "Four stops that name only the cancel, and the removal of IH-07 from the exhausted increment budget, have no test"
    severity: low
    priority: p3
    scope: application
    what_happened: >
      The stops raised at `src/application/phases/verification-design.ts` (no detectable control, a
      protocol that does not freeze, a preparation that cannot run) and `src/application/verification.ts`
      name `cancel` as the only way out, and the exhausted increment duration budget in
      `src/domain/change/decide.ts` no longer names `request_decision:IH-07`. Mutations that put the
      former names back, or name `resume, cancel`, survive the whole suite.
    what_expected: >
      A test holds each of these five lines: putting a former name back, or naming a resume no
      resume lifts, fails a test that reads the stop as `/495 status` shows it.
