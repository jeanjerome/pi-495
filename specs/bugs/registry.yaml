  - bug_id: BUG-2026-09-29T101451
    date: "2026-09-29"
    title: "The owner who accepts a candidate is not told that its preparation rewrote an existing test"
    severity: low
    priority: p3
    scope: presentation
    what_happened: >
      A preparation that rewrites a test which existed on the reference is adopted, and its record
      names the file in `modified_existing`. That field is written to the object store and read by
      nothing else: the IH-10 dialog asks "Accepter ce candidat ?" with the gate reasons as its only
      facts, and `/495 status` does not list it. The owner who decides from Pi does not learn that
      what the target guaranteed until now was rewritten; only a reading of the object store shows it.
    what_expected: >
      The owner sees, before accepting the candidate, which existing tests the preparation modified.
    steps_to_reproduce:
      - "On a target whose `test/greet.test.js` asserts `Hello, x`, request `greet must end with an exclamation mark`."
      - "Let the preparation rewrite `test/greet.test.js`, and reach the IH-10 dialog."
      - "The dialog and `/495 status` do not name `test/greet.test.js`; the preparation record of the object store does."
    root_cause: >
      `PreparationRecord.modified_existing` (`src/application/preparation.ts`) was added to the record
      only. The IH-10 facts come from `g5.reasons` (`src/application/phases/decide.ts`), and no
      presentation reads the preparation record.
    evidence: >
      A campaign on a real Pi in RPC mode with a local model: the preparation record holds
      `modified_existing: [test/greet.test.js]` and G5 passes. The reading of `decisions.ts` and
      `decide.ts` shows that the IH-10 question carries no mention of the rewritten test.
    risk_level: low
    follow_ups: >
      Name the modified existing tests in the IH-10 facts, or in `/495 status`, or both; the
      candidate is still a proposal that only the kernel adopts, so this changes what the owner sees,
      not what the kernel decides.
    status: open
  - bug_id: BUG-2026-09-29T160000
    date: "2026-09-29"
    title: "The Seatbelt test of the generic runner cannot fail when the repository lives under the temporary directory"
    severity: low
    priority: p3
    scope: adapters
    what_happened: >
      `runs the same control under seatbelt with the candidate read-only` expects the write to
      `src/greet.js` to be refused. `SeatbeltSandbox` grants the write to the temporary directory of the
      process and to `/private/tmp` by default, and the test builds its workspace under
      `test-output/`; in a repository hosted under `$TMPDIR` the write succeeds and the assertion of a
      FAIL verdict fails, so the test says nothing about the confinement there.
    what_expected: >
      The test holds wherever the repository lives, because it grants no temporary directory to the
      sandbox it builds.
    steps_to_reproduce:
      - "Clone the repository under `$TMPDIR` and run `node --test test/v1/control-runner.test.ts` on macOS."
      - "The candidate read-only test fails on the assertion that the write is refused."
    root_cause: >
      The test builds `new SeatbeltSandbox()` with its default `temp_paths` (`src/adapters/sandbox/backends.ts`),
      which include the temporary directory the workspace may sit in. The vitest tests of the same file
      pass `temp_paths: []` for this reason.
    evidence: >
      Read in `backends.ts` (`temp_paths` default, profile line that allows the write); the reviewers of
      the branch observed the failure in a tree under `$TMPDIR` and its pass in a copy under `$HOME`.
