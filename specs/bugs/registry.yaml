      or `/495 resume`. The status of a blocked change already gives `/495` commands on that line.
    what_expected: >
      The Next line of every state gives the `/495` subcommands that move the change on.
    steps_to_reproduce:
      - "Carry a change to a pending IH-04 decision, or extend its attempt budget through IH-07, then run `/495 status`."
      - "The Next line reads `decide: IH-04` or `G5: evaluate acceptance`."
    root_cause: >
      `formatStatus` (`src/presentation/structured/text.ts`) rewrites the next action of a blocked change only and
      copies the one `nextActionOf` (`src/application/views.ts`) composes for every other state.
    evidence: >
      Seen in the acceptance run of the plain-language status, at branch e07s01 (79276fa), in a real Pi 1.0.2 with a
      scripted agent; `main` prints the same next action after `Next action:`, so it predates the branch.
    risk_level: low
    follow_ups: >
      Map each state's next action to the `/495` subcommands that act on it, as the blocked state already does.
    status: open
