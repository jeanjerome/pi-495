  - bug_id: BUG-2026-10-10T160000
    date: "2026-10-10"
    title: "G3 passes a task whose path holds a protected path, so the incompatibility is found by G4 after the production"
    severity: low
    priority: p3
    scope: domain
    what_happened: >
      `pathFindings` (`src/domain/gates/g3.ts`) names a task only when one of its paths lies under a protected path
      (`matchesScope(p, pp)`): the task path is matched against the protected pattern, never the reverse. A task that
      writes `test/` while only `test/greet.test.js` is protected, or writes `**` under a mandate that allows every
      path, is adopted, the producer starts, and only G4 refuses the candidate that actually rewrites the protected
      test. Introduced by the branch of the story e38s08; the choice is deliberate and commented, so that a task
      working in `src/` around Maven's `src/test/` is not refused for the place it works in.
    what_expected: >
      A plan whose task paths can only be honoured by rewriting a protected path is named before any production,
      without refusing a task path that merely contains a protected directory it does not have to touch.
    steps_to_reproduce:
      - "Freeze a protocol protecting `test/greet.test.js` and propose a plan whose task writes `test/`: G3 passes."
      - "Let the producer rewrite `test/greet.test.js`: G4 refuses the candidate, after the production."
    root_cause: >
      A task path is a scope, not a list of files: G3 cannot tell from `test/` alone whether the task will touch the
      protected file inside it, and refusing every containing scope would refuse `src/` in a Maven project.
    evidence: >
      Read at the round-1 review of e38s08: `matchesScope(p, pp)` in `pathFindings` compares the task path to the
      protected pattern only.
    risk_level: low
    follow_ups: >
      Decide what a containing task path is worth before production (a warning recorded at G3, or a refusal when the
      task path is exactly a protected directory or `**`), with a v0 test of each side of the line.
    status: open
