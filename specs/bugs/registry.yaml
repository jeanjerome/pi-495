    steps_to_reproduce:
      - "Replace `cancel` by `prepare_capabilities` at `verification-design.ts:79` and run `npm test`."
      - "The suite passes."
    root_cause: >
      The fix of BUG-2026-09-28T143500 changed seven stops and tested three; the four others and the
      removal at `decide.ts:984` were left to the reviewers' mutations. Left open by the sixth review
      round of the branch that reruns a verification cut short, past the cap, under the rule that what
      the last round leaves goes to the registry.
    evidence: >
      Review record of the branch, round 6, R6-1 and R6-2: mutations M9 to M12 and M14 of reviewer A,
      M11 to M14, M16, M21 and M22 of reviewer B survive at 37626c6. `test/v2/preparation.test.ts:168`
      already reaches the stop of a protocol that does not freeze and reads only its first word.
    risk_level: low
    follow_ups: "what the exhausted-budget test asserts depends on BUG-2026-09-28T163400"
    status: open
  - bug_id: BUG-2026-09-28T163400
    date: "2026-09-28"
    title: "The exhausted increment duration budget names no way out, and a resume in the same session loops on it"
    severity: low
    priority: p3
    scope: application
    what_happened: >
      `BUDGET_EXHAUSTED` on the increment duration becomes an `execution_error` stop
