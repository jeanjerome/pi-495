  - bug_id: BUG-2026-10-10T044125
    date: "2026-10-10"
    title: "An acceptance recipe whose network is opened while it declares no external data passes G2, and the external data it declares reach neither its evidence nor its reviewers"
    severity: low
    priority: p3
    scope: domain
    what_happened: >
      The acceptance recipe a profile declares carries `external_data`, the data it reads from outside the copy, and a
      `network` of its own (`denied` by default, `loopback` or `allowed`). Nothing reads `external_data`: the G2 check of
      the acceptance plan (`acceptancePlanFindings`, `src/domain/acceptance-plan.ts`) judges the observations, the
      negative control and the review missions, never the network against the declared data, so a recipe with
      `network: "allowed"` and `external_data: []` is frozen; the reader of the run (`ACCEPTANCE_RECIPE_READER`) copies
      the entry, the simulations and the observations into the evidence, not the external data; and `reviewObjective`
      hands a reviewer the observations, not the external data.
    what_expected: >
      The data an acceptance run reads from outside the copy are declared where they are judged: a recipe that opens the
      network without naming any external data is refused before the freeze, or at least the declared data appear in
      the evidence of the run, as its entry and simulations do.
    steps_to_reproduce:
      - "Declare in `policy.acceptance_recipe` a recipe with `network: \"allowed\"`, `external_data: []`, one observation and a negative control."
      - "Run a change to G2: the protocol is frozen with no finding about the network or the external data."
      - "Run it to G5: the evidence of `acceptance-recipe` lists `entry` and `simulations` and nothing about external data."
    root_cause: >
      `external_data` is a field of the contract `AcceptanceRecipe` (`src/contracts/v1/protocol.ts`) that no function of
      `src/` reads; its doc comment leaves the network to the control's own policy, and no rule ties the two.
    evidence: >
      Read at 228e1c04 (story e38s09): `grep -rn external_data src` finds only the contract and the doc comment of
      `AcceptanceRecipeDeclaration`; no test sets `external_data` to anything but `[]`. The acceptance run of the story
      kept the list empty and the network denied, so it did not exercise this. The network of the recipe is still set
      only by the owner's profile and frozen with the protocol; a producer cannot open it.
    risk_level: low
    follow_ups: >
      Decide whether G2 refuses a recipe whose network is not `denied` and whose `external_data` is empty, and carry the
      declared external data into the facts of the run, with a v0 test of the refusal and a v1 test of the facts.
    status: open
