  - bug_id: BUG-2026-09-29T101451
    date: "2026-09-29"
    title: "The owner who accepts a candidate is not told that its preparation rewrote an existing test"
    severity: low
    priority: p3
    scope: presentation
    what_happened: >
      A preparation that rewrites a test which existed on the reference is adopted, and its record
      names the file in `modified_existing`. That field is written to the object store and read by
      nothing else: the IH-10 dialog asks "Accepter ce candidat ?" with the gate reasons as its only
      facts, and `/495 status` does not list it. The owner who decides from Pi does not learn that
      what the target guaranteed until now was rewritten; only a reading of the object store shows it.
    what_expected: >
      The owner sees, before accepting the candidate, which existing tests the preparation modified.
    steps_to_reproduce:
      - "On a target whose `test/greet.test.js` asserts `Hello, x`, request `greet must end with an exclamation mark`."
      - "Let the preparation rewrite `test/greet.test.js`, and reach the IH-10 dialog."
      - "The dialog and `/495 status` do not name `test/greet.test.js`; the preparation record of the object store does."
    root_cause: >
      `PreparationRecord.modified_existing` (`src/application/preparation.ts`) was added to the record
      only. The IH-10 facts come from `g5.reasons` (`src/application/phases/decide.ts`), and no
      presentation reads the preparation record.
    evidence: >
      A campaign on a real Pi in RPC mode with a local model: the preparation record holds
      `modified_existing: [test/greet.test.js]` and G5 passes. The reading of `decisions.ts` and
      `decide.ts` shows that the IH-10 question carries no mention of the rewritten test.
    risk_level: low
    follow_ups: >
      Name the modified existing tests in the IH-10 facts, or in `/495 status`, or both; the
      candidate is still a proposal that only the kernel adopts, so this changes what the owner sees,
      not what the kernel decides.
    status: open
  - bug_id: BUG-2026-09-29T160000
    date: "2026-09-29"
    title: "The Seatbelt tests of the generic runner and of the sandbox backends cannot fail when the repository lives under the temporary directory"
    severity: low
    priority: p3
    scope: adapters
    what_happened: >
      `runs the same control under seatbelt with the candidate read-only` expects the write to
      `src/greet.js` to be refused. `SeatbeltSandbox` grants the write to the temporary directory of the
      process and to `/private/tmp` by default, and the test builds its workspace under
      `test-output/`; in a repository hosted under `$TMPDIR` the write succeeds and the assertion of a
      FAIL verdict fails, so the test says nothing about the confinement there. `seatbelt qualifies on
      macOS and confines writes, sensitive reads, symlink escapes and network` in
      `test/v1-adapters/sandbox.test.ts` builds the same sandbox and fails the same way on its `outside:EPERM`
      assertion.
    what_expected: >
      The tests hold wherever the repository lives, because they grant no temporary directory to the
      sandbox they build.
    steps_to_reproduce:
      - "Clone the repository under `$TMPDIR` and run `node --test test/v1-adapters/control-runner.test.ts` on macOS."
      - "The candidate read-only test fails on the assertion that the write is refused."
      - "Run `node --test test/v1-adapters/sandbox.test.ts` from the same clone: the confinement test fails on the write outside the workspace."
    root_cause: >
      The test builds `new SeatbeltSandbox()` with its default `temp_paths` (`src/adapters/sandbox/backends.ts`),
      which include the temporary directory the workspace may sit in. The vitest tests of the same file
      pass `temp_paths: []` for this reason.
    evidence: >
      Read in `backends.ts` (`temp_paths` default, profile line that allows the write); the reviewers of
      the branch observed the failure in a tree under `$TMPDIR` and its pass in a copy under `$HOME`.
      Existed before the branch, which does not touch this test.
    risk_level: low
    follow_ups: "Build the sandbox of those tests with `{ temp_paths: [] }`."
    status: open
  - bug_id: BUG-2026-09-29T190000
    date: "2026-09-29"
    title: "An IH-04 question left pending when the requirements are revised stays answerable, and a prepare answered to it grants a preparation on the new requirements"
    severity: low
    priority: p3
    scope: application
    what_happened: >
      A change with an IH-04 decision pending had its requirements revised. The revision revoked the
      IH-04 answers already recorded, but not the question still waiting for one, so the verification
      design asked IH-04 a second time and two IH-04 decisions were pending, the old and the new. An answer
      "prepare" given to the old question was recorded valid, and `preparationsGranted` counted it: one
      more preparation was granted on requirements that question never named.
    what_expected: >
      An answer to a question asked on requirements that were revised since grants nothing on the
      requirements as they stand.
    steps_to_reproduce:
      - "Take a change to a pending IH-04 (two preparations retained no test able to judge R1)."
      - "Revise the requirements (`artifact.revise` on the requirements artifact) and advance: a second IH-04 is asked."
      - "Answer the first IH-04 `prepare`, then advance: a third preparation opens."
    root_cause: >
      `invalidationFor` (`src/domain/invalidation.ts`) revokes the valid IH-04 decisions of the change, and
      nothing withdraws the IH-04 decisions still pending. `preparationsGranted`
      (`src/application/phases/verification-design.ts`) counts every valid `prepare` answer without
      comparing its subject with the requirements it is counted for. Introduced by the branch, which
      makes IH-04 exist and lets a revision reach it while it is pending. Only an owner who answers
      both questions reaches it.
    evidence: >
      Reviewer probe: two IH-04 decisions pending after the revision, the old one and the new one; the
      mutation that keeps `verifiabilityDecisions` out of the invalidation fails the assign_review
      scenario, while no test pins the stale pending question.
    risk_level: low
    follow_ups: >
      Withdraw the IH-04 decisions pending when the requirements are revised, as the revocation of a
      resolution already withdraws the pending decisions, or count only the `prepare` answers whose
      subject digest equals the one asked for the requirements as they stand. Either adds a state
      transition or a refusal, so it needs its own test.
    status: open
  - bug_id: BUG-2026-09-29T210000
    date: "2026-09-29"
    title: "The facts of a human decision are written in English under a question and options in the language of the change"
