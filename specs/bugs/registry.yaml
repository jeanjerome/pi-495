      them: qualification runs the frozen command, scope included, on a tree whose witnesses lie outside it.
    evidence: >
      Introduced by the branch e38s13, which adds `suite_paths`. Observed while writing the test of the second
      detection during the round-1 review: with `test/*.test.js` alone the protocol is not frozen, with
      `test/*.test.mjs` added it is. The dogfooding campaign's answerer does not adopt a complement, so the real
      campaign does not reach this path.
