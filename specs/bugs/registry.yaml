  - bug_id: BUG-2026-10-02T140000
    date: "2026-10-02"
    title: "Two Pi sessions opening the same data directory at once often fail to create the 495 runtime"
    severity: low
    priority: p3
    scope: adapters
    what_happened: >
      Two processes that open `SqliteLedger` on the same `state.sqlite` at the same instant fail with
      `ERR_SQLITE_ERROR`: most often `database is locked`, sometimes `UNIQUE constraint failed:
      schema_migrations.version`. In Pi this surfaces as "the 495 runtime cannot be created", on a new data
      directory and on an existing one alike.
    what_expected: >
      Both sessions open the ledger, one waiting for the other, and the schema is migrated once.
    steps_to_reproduce:
      - "Start two Node processes that each run `new SqliteLedger(<same path>).close()` at the same time, fifteen times on fresh directories."
      - "18 of the 30 opens failed with `database is locked`, and one with the UNIQUE constraint on `schema_migrations.version`."
    root_cause: >
      In the `SqliteLedger` constructor (`src/adapters/storage-sqlite/ledger.ts`), `PRAGMA journal_mode = WAL` and
      `PRAGMA synchronous = FULL` run before `PRAGMA busy_timeout = 5000`, so the connection gives up at once on a
      lock the other one holds; and `migrate()` checks and applies a version outside a single write transaction,
      so both processes can apply the same version.
    evidence: >
      Seen during the acceptance runs of the lease work, on main 3f8f635 and on the branch alike, and reproduced on
      main 51080e6 with the two-process script above.
    risk_level: low
    follow_ups: >
      Set `busy_timeout` before any other pragma and run the migration check and apply in one `BEGIN IMMEDIATE`
      transaction, with a test that opens the ledger from two processes at once.
    status: open
