    date: "2026-10-06"
    title: "The title of a request longer than 80 characters is cut in the middle of a word, with no mark that it was cut"
    severity: low
    priority: p3
    scope: application
    what_happened: >
      The request `add freeMinutes(busy) beside freeSlots: it returns how many minutes of the day no busy slot covers`
      reads in the status and in the report as `add freeMinutes(busy) beside freeSlots: it returns how many minutes of
