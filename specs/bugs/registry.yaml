      empty file. A report path can name a directory (the jscpd output `target/495-jscpd` of the Node technology
      does), and an option can name an output directory (`--outputDir=reports`): a technology that declares that
      same directory writable finds an empty file there under Linux, and its tool fails with `ENOTDIR` or
      `EEXIST`, where before the branch the directory was made and the control ran. No control of Node or Maven
      declares such a path today.
    what_expected: >
      A writable path a control declares is granted as what the control writes there, a directory staying a
      directory, whatever its report path or its command look like.
    steps_to_reproduce:
