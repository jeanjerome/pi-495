      The result of an accepted install is not kept between resumptions: only the files it added and the packages
      it listed reach the protocol, and only at the freeze, so a resumption before it recomputes them. Introduced
      by the branch e12s08.
    evidence: >
      Probe of the reviewer on 2026-09-30 (`FakeNpmSandbox.installs()` equals 2 at the end of the run); not
      re-run here.
    risk_level: low
