    evidence: >
      Rendered reachable by the branch e38s13, which adds the campaign. Read in npm's source (pacote `lib/git.js`
      lines 160-198, `lib/fetcher.js` 99-121, `@npmcli/config` `lib/set-envs.js`) during the round-1 review; no
