    title: "A provider that refuses the capability probe with an error, an expired OAuth token included, is reported as an endpoint that answered without calling the tool"
    severity: low
    priority: p3
    scope: adapters
    what_happened: >
      The tool-call probe of `PiModelDescription.toolCallFormat` (`src/adapters/pi-worker/capabilities.ts`) reads
      only whether the answer of `catalogue.complete` holds a `toolCall` block. Pi's `complete` returns a provider
      error as an assistant message with `stopReason: "error"` and an `errorMessage` rather than throwing, so a
      refused request — Pi's Anthropic subscription with an expired OAuth access token — is recorded as "the
      endpoint answered without calling the tool it was given", and the intervention refuses with
      `capability_missing` instead of naming the authentication error.
    what_expected: >
      An answer whose `stopReason` is `error` is reported as a tool-call format that could not be observed, naming
      the provider's `errorMessage`, as the probe already does when `complete` throws.
    steps_to_reproduce:
      - "Let the OAuth access token of Pi's Anthropic login expire, without logging in again."
      - "Run `npm run campagne -- npm` with that login: the run stops before any control on `capability_missing`, with the note \"the endpoint answered without calling the tool it was given\", while Pi reports \"OAuth access token has expired\"."
    root_cause: >
      `toolCallFormat` tells an answer with a tool call from one without, and treats only a thrown error as an
      unobserved format; the `stopReason` and `errorMessage` of the answer are not read.
    evidence: >
      Observed on 2026-10-04 during the acceptance run of the story e28s14, whose two reference campaigns stopped
      this way; the probe code is the same on main at b31d9b1, so the defect predates the branch.
    risk_level: low
    follow_ups: >
      Read `stopReason` in the probe and report an `error` answer with its `errorMessage` as an unobserved format;
      a test with a catalogue whose `complete` returns an error message.
    status: open
  - bug_id: BUG-2026-10-05T103037
    date: "2026-10-05"
    title: "A prepared test that no implementation can satisfy is frozen at G2, and every later attempt fails on it with no way to say the test is wrong"
    severity: medium
    priority: p2
    scope: application
    what_happened: >
      The prepare intervention wrote `tests/lastfit.test.ts` for the npm reference target with a case whose
      expected value is a busy range: for `busy = [slot(100, 200), slot(300, 1411)]` and 30 minutes it expects
      `slot(1381, 1411)`, where the latest free slot is `slot(270, 300)`. The preparation was qualified because
      the suite failed on the reference (`on_reference: FAIL`), which only shows that `lastFit` did not exist yet,
      and the protocol froze with it. The seven candidates that followed all failed `unit` on that one case alone
      (39 tests, 1 failure), `coverage` and `mutation` failing with it, and each IH-07 offered only to extend
      the attempt budget or to stop.
    what_expected: >
      A frozen test that contradicts the adopted requirements does not hold the change in a loop of attempts that
      cannot pass: the case is put before a decision that can send the preparation back, or the qualification
      refuses a prepared case that fails for another reason than the missing behaviour.
    steps_to_reproduce:
      - "Copy `cycle/campagnes/npm` to a fresh git repository of one commit and run `npm install` there."
      - "Start Pi with a data directory whose `config.json` holds `{\"policy\":{\"adoption\":{\"mandate\":\"human\"}}}` and `HARNESS495_HUMAN_ACCEPTANCE=1`."
      - "Run `/495 start add lastFit(busy, minutes) beside firstFit: …`, adopt the mandate, then `/495 resume`: whether the prepared suite holds a wrong case depends on the model, and when it does, every candidate fails `unit` on that case."
    root_cause: >
      The qualification of a preparation reads that the suite fails on the reference, not why each case fails;
      once the protocol is frozen, G5 judges every candidate against it, and the decision on an exhausted budget
      has no option that reopens the preparation. The prepare intervention could not run its own tests either:
      its `bash` tool killed every command given a timeout, a defect fixed separately.
    evidence: >
      Observed on 2026-10-05 in a Pi 1.0.2 terminal session at main 9f0f0e9, change chg_muuz37c98d577ab21d of a
      throwaway data directory; the unit evidence of candidates cand_158b8da1e318 to cand_07aefd6a8c9d names the
      same failed case. The same target passed G0-G5 twice the same morning with a prepared suite that was right.
      Seen again at main bfaa799, once the prepare intervention could run its tests: change chg_muv0e36w9742a71b3d
      froze `lastFit([slot(0, 540), slot(600, 1400)], 40)` expected as `slot(560, 600)`, where the final gap
      1400-1440 fits exactly; the suite failed on the reference only because `lastFit` was missing, which hid the
      wrong case. Each of the three implement interventions named that case in its notes as contradicting the
      mandate and asked for a human, and the IH-07 that followed showed none of those notes.
    risk_level: medium
    follow_ups: >
      Decide whether an exhausted budget whose failures all come from prepared cases offers to reopen the
      preparation, or whether qualification runs each prepared case against the reference and refuses one that
      fails on an assertion rather than on the missing export; either adds an option or a refusal. In both
      cases, the notes in which implement interventions contest a prepared case reach the decision.
    status: open
