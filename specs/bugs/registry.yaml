    scope: cycle
    what_happened: >
      `preparer` (`cycle/src/preparation.ts`) reuses the last `preparation` event whenever the fingerprint is the same,
      whatever its verdict, and the fingerprint covers only the companion, the promises, the security section and the
      model files. An exploration that ends `error` because `TLA2TOOLS_JAR` is unset (`scripts/check-formal.ts` answers
      `capability missing`), or `inconclusive` because the run was killed at its timeout, is recorded as a blocked
      preparation; a relaunch after the jar is set or the machine is freed writes `preparation-retenue` and blocks
      again on the old record, without exploring.
    what_expected: >
