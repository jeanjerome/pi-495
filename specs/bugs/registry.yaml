  - bug_id: BUG-2026-09-30T202000
    date: "2026-09-30"
    title: "A complement file the reference does not hold, deleted by the producer, is invisible to G4"
    severity: low
    priority: p3
    scope: domain
    what_happened: >
      `protectedPathsChanged` (`src/domain/gates/g4.ts`) refuses a complement file that the reference holds and
      the candidate returns unchanged (`restored`). A complement file absent from the reference, under
      `node_modules/` for instance, that the producer deletes has no entry in the manifest, so G4 judges nothing
      about it. The test "a manifest without the complement file judges nothing about it"
      (`test/v1/node-stack.test.ts`) asserts that silence.
    what_expected: >
      A producer can neither undo nor extend the complement: deleting one of its files is refused as a
      modification, whatever path it sits on.
    steps_to_reproduce:
      - "Adopt a complement that writes a file under `node_modules/`, absent from the reference snapshot."
      - "Have the candidate delete that file: the manifest holds no entry for it and `altered` stays empty."
    root_cause: >
      The check reads the manifest, which only lists paths present in the reference or in the candidate; a path
      in neither has no entry. The code on this point did not change with the branch e12s07 and a deletion
      removes a dependency without adding one, so the branch neither introduces nor makes it reachable.
    evidence: >
      Read on 2026-09-30 in `src/domain/gates/g4.ts` and asserted by the test named above; the end-to-end
      deletion was not run.
    risk_level: low
    follow_ups: >
      Decide whether G4 receives the complement paths as a required set and refuses one missing from the
      candidate; a test on a candidate that deletes an adopted complement file the reference does not hold.
    status: open
  - bug_id: BUG-2026-09-30T203000
    date: "2026-09-30"
    title: "The install of an adopted complement runs again, network open, each time the verification design resumes"
    severity: low
    priority: p3
    scope: application
    what_happened: >
      `designVerification` (`src/application/phases/verification-design.ts`) calls `adoptInstalls` on every
      resumption of the design for as long as the owner's answer to adopt the complement holds, and each call
