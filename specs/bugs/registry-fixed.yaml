    severity: low
    priority: p3
    scope: application
    what_happened: >
      Two live sessions conduct the same change. One of them closes the other's verification, is refused
      or loses, and blocks the change; the owner revokes the answer to Q1 there, which is accepted:
      `clarifying decision_required`, IH-01 pending. The other session's record then loses on the
      revision, and its block overwrites the decision: `clarifying blocked execution_error`, IH-01 still
      pending. A resume hands the change back `clarifying ready`, and each conduct reruns the
      specification until the step budget stops it (`max_steps`), IH-01 never presented.
    what_expected: >
      A block written by a session that lost to a later act does not overwrite that act, and a change
      with a pending decision comes back to that decision when its stop is lifted.
    steps_to_reproduce:
      - "Open two harnesses on the same ledger, and conduct one change to its verification in the first."
      - "In the second, resume the change (`harness.resume`, then `advance`) while the first one's controls run: the second is refused by the key the first holds and blocks the change."
      - "Revoke Q1 in the second: accepted, IH-01 pending. Let the first finish: its record loses, and its block leaves `clarifying blocked execution_error`."
      - "Resume, then `advance`: the specification reruns until `max_steps`, and IH-01 is never presented."
