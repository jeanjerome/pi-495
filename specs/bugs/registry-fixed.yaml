  - bug_id: BUG-2026-09-28T081300
    date: "2026-09-28"
    title: "A verification cut short by a pause or by the end of its session is never run again, so the change can only be cancelled"
    severity: medium
    priority: p2
    scope: application
    what_happened: >
      A session that ends while the frozen controls run leaves the change `verifying running` with its
      verification operation open. `/495 resume` closes it as interrupted, and the next verification is
      refused by the ledger, `OPERATION_ACTIVE: operation <op> already holds the idempotency key
      verify:<candidate>:0`, which blocks the change `execution_error`; each resume lifts it into the
      same refusal. A change paused while its controls run fails its resume at once with
      `PRECONDITION_FAILED: change is paused`. Cancelling is the only way left in both cases.
    what_expected: >
      A verification cut short is run again once the change is resumed, on the same frozen candidate.
    steps_to_reproduce:
      - "Kill the session while the controls of a verification run (or throw from the control runner), then `/495 resume`: the change is blocked on the reused idempotency key."
      - "Pause the change while the controls of a verification run, then `/495 resume`: refused, change is paused."
    root_cause: >
      A verification's idempotency key is the candidate and the count of evidence, which a run cut
      short does not change, and the ledger refuses a key once used (since bd7c5be). The pause leaves
      the verification operation open, and the resume re-runs it before ending the pause, which the
      kernel refuses on a paused change (since the first kernel). Both predate the revocation branch.
    evidence: >
      Found while reproducing BUG-2026-09-28T013000. Throwaway harness probes on 8f683d9, one per
      path, with the results above. A key naming the revision the verification starts from, and a
      pause closing the verification operation, as a temporary patch, make both reach the decision.
    risk_level: low
    file: specs/bugs/BUG-2026-09-28T081300-interrupted-verification-never-runs-again.md
    follow_ups: >
      A change a build before the fix paused during its verification keeps its operation open, and its
      resume stays refused until it is paused again, which closes that verification. One such a build
      blocked during its verification has its resume lift any stop (BUG-2026-09-28T113000).
    status: fixed
    fixed_in: c258255, 897ff02
