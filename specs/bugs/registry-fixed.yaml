  - bug_id: BUG-2026-09-29T130000
    date: "2026-09-29"
    title: "A reopened red-green pass is blocked by a green test a later step left on the branch"
    severity: medium
    priority: p2
    scope: cycle
    what_happened: >
      After the review and the acceptance run sent a story back to the red-green step, the step wrote
      its new tests and code, and Preflight was green at the head, then the step blocked with
      `no failing test read at this test-only commit (PASS)` on a commit an earlier step had left: a
      refactor of a test file that cannot fail.
    what_expected: >
      The step owes a red for the test-only commits of its own run, and only those. A test the
      self-review or the review adds afterwards passes at its commit whenever the code already keeps
      the promise, which the review rules ask for.
    steps_to_reproduce:
      - "Run a story through the red-green step and the self-review, and let the self-review commit a test-only refactor of a test file."
      - "Reopen the story after the acceptance run, and run the red-green step again."
      - "The step replays that refactor as a red and blocks."
    root_cause: >
      `pasRougeVert` (`cycle/src/cycle.ts`) replays every test-only commit between the base and the
      head, so that a pass interrupted before its journal entries is still checked. The range starts
      at the base whatever ran since, and `estCommitDeTestSeul` judges by the paths a commit touches,
      not by what it asserts.
    evidence: >
      test/cycle/cycle.test.ts, "replays only the test-only commits of the pass, so a green test a
      later step left on the branch does not block a reopened story": red at 4b73790 (blocked on the
      refactor commit), green at 07b068b. The guard "replays every test-only commit of a pass resumed
      after a block" is green on both. Preflight green under Node 24.21.0, 637 tests.
    risk_level: low
    follow_ups: "none"
    status: fixed
    fixed_in: 07b068b
  - bug_id: BUG-2026-09-29T150000
    date: "2026-09-29"
    title: "A red-green pass resumed after its work was done is blocked because its session committed nothing"
    severity: medium
    priority: p2
    scope: cycle
    what_happened: >
      A red-green launch that was blocked after its session had already committed every test and its
      code was launched again. The new session read the branch, replayed the reds, ran the tasks and
      Preflight, found nothing left to do and committed nothing. The step then blocked on
      `the red-green session committed nothing`, though the branch carried the whole pass.
    what_expected: >
      A pass has committed something when any of its launches did; a resumed launch whose session
      confirms the work and adds nothing finishes, once the reds, the task commands and Preflight
      hold.
    steps_to_reproduce:
      - "Let a red-green launch commit every test and its code, then block after the session."
      - "Launch the step again: the session commits nothing."
      - "The step blocks on the missing commit, whatever the branch carries."
    root_cause: >
      `pasRougeVert` (`cycle/src/cycle.ts`) counted the commits made since the head at the start of
      the current launch. The replay of the test-only commits already ranged over the whole run, so the
      two checks disagreed about where a pass begins.
    evidence: >
      test/cycle/cycle.test.ts, "finishes a pass resumed after its work was done, whose session has
      nothing left to commit": red at the test-only commit (blocked on the missing commit), green at
      bd10032. Preflight green under Node 24.21.0.
    risk_level: low
    follow_ups: "none"
    status: fixed
    fixed_in: bd10032
  - bug_id: BUG-2026-09-29T170000
    date: "2026-09-29"
    title: "A candidate that adds a file under node_modules/ is not refused, though the file can shadow a dependency the vitest control loads"
    severity: medium
    priority: p2
    scope: application
    what_happened: >
      The vitest unit control protects `node_modules/` as a directory. `protectedPathsChanged` allows
      a file added under a protected directory, so a candidate that adds
      `node_modules/vitest/node_modules/<package>/index.js` (which shadows the hoisted package for
      vitest) is frozen with that file in `allowed_protected_paths` and no altered protected path;
      only a modified or deleted file under `node_modules/` is refused.
    what_expected: >
      A candidate that changes what the vitest that judges it loads is refused, whether it modifies an
      installed file or adds one that takes the place of another.
    steps_to_reproduce:
      - "Call `protectedPathsChanged` on a manifest with `node_modules/vitest/node_modules/tinyrainbow/index.js` added and `node_modules/vitest/dist/index.js` modified, protected paths `['node_modules/']`."
      - "`altered` holds only `dist/index.js`; the added file is in `allowed`."
    root_cause: >
      The rule that a file added under a protected directory takes nothing from an oracle that already
      stood (`src/domain/gates/g4.ts`) holds for `test/` and `tests/`, where a new file is a new test.
      Under `node_modules/` a new file can resolve before an existing one. The rule is on main; the
      branch makes it reachable for `node_modules/` by protecting that directory in
      `vitestControl` (`src/application/stacks/node.ts`).
    evidence: >
      A throwaway probe of `protectedPathsChanged` on the manifest above returned
      `altered: [node_modules/vitest/dist/index.js]` and
      `allowed: [node_modules/vitest/node_modules/tinyrainbow/index.js]`. The promise of the story
      names a modified file, which the code refuses.
    risk_level: medium
    follow_ups: >
      Decide whether a file added under `node_modules/` is refused (a candidate that installs a
      dependency is then refused too) or accepted when it shadows nothing that exists on the
      reference; either adds a refusal or a resolution check, so it is a product decision.
    status: fixed
    fixed_in: a3ecb9e
