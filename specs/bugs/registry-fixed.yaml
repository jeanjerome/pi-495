bugs:
  - bug_id: BUG-2026-09-26T142500
    date: "2026-09-26"
    title: "Pausing a stopped change erases its stop, and a resume can no longer lift it"
    severity: medium
    priority: p2
    scope: domain
    what_happened: >
      A change blocked on a stop a resume lifts (a stalled specification, an execution error) accepted
      `/495 pause`. On resume it came back `blocked` with no stop reason, no detail and no longer
      retryable: a second resume lifted nothing, the names of the lost answers were gone, and cancel
      was the only way out left.
    what_expected: >
      A stopped change keeps its stop, its detail and its ways out whatever the operator does before
      lifting it.
    steps_to_reproduce:
      - "Take a change to the stop before G0 of a specification that no longer progresses."
      - "Run `/495 pause`, then `/495 resume` twice."
      - "The change stays `blocked` with `stop_reason` null and `stop_retryable` false, and `advance` writes nothing."
    root_cause: >
      `changePause` (`src/domain/change/decide.ts`) accepted any active change, blocked ones included.
      It saved only the status in the resume point, and its `status.changed` event cleared the stop
      reason, detail and retryability. `changeResume` restored `blocked` without them, and
      `harness.resume` lifts a block only when its reason is `execution_error` or it is retryable. The
      same code is on main for every stop a resume lifts; a stalled specification relies on that
      resume for its recourse.
    evidence: >
      test/v0/change-rules.test.ts, "refuses to pause a blocked change, which keeps its stop, its detail
      and its retryability", and test/v2/specification-reopening.test.ts, "refuses to pause a stopped
      change, whose stop a resume still lifts into a rewriting (6a)": red at 0d67f46 (2 failures out
      of 59, the pause accepted), green at 6d5a3e3, both in a detached worktree. Preflight green under
      Node 26.9.0, 486 tests.
    reopened: >
      The guard `6d5a3e3` added to `changePause` left a second way in: a change blocked while an
      intervention still ran. A `DomainError` thrown between `intervention.start` and
      `intervention.finish` (a missing adopted artifact, a failed store write, a worker that does not
      start) blocked the change and left the intervention `running`. `harness.pause` finishes a running
      intervention before it commits `change.pause`, and `intervention.finished` sets the status to
      `ready`: the guard saw a ready change, accepted the pause, and the stop was erased. The kernel now
      ends the running intervention in `block`, in the same decision as the stop, so a blocked change
      never has one: red at 287123c (3 failures out of 93), green at d6b0bd5, both in a detached
      worktree. Preflight green under Node 26.9.0, 490 tests.
    risk_level: medium
    follow_ups: "none"
    status: fixed
    fixed_in: d6b0bd5
  - bug_id: BUG-2026-09-26T145000
    date: "2026-09-26"
    title: "A resume lifts a stop no resume may lift when the step failed while its intervention ran"
    severity: medium
    priority: p2
    scope: application
    what_happened: >
      A change blocked on a missing capability, an invalid configuration or a policy refusal, by a step
      that failed while its intervention ran, came back `ready` on `/495 resume`. No `change.unblock`
      was recorded, so the lift was neither judged by the kernel nor attributed to the human who
      resumed.
    what_expected: >
      A resume lifts only an execution error or a stop the kernel declared retryable, under the actor
      who resumed; any other stop stays in place.
    steps_to_reproduce:
      - "Make the worker start throw `CAPABILITY_MISSING` after `intervention.start` is committed."
      - "Run `/495 advance`: the change stops `blocked capability_missing` with its intervention `running`."
      - "Run `/495 resume`: the change is `ready`."
    root_cause: >
      Same state as BUG-2026-09-26T142500: a block left the intervention running. `harness.resume`
      finishes a running intervention first, `intervention.finished` sets the status to `ready`, and
      the branch that lifts a block by `change.unblock` never ran. The code is on main.
    evidence: >
      test/v2/harness.test.ts, "does not lift on resume a stop no resume lifts, when the step failed
      while its intervention ran": red at 287123c, green at d6b0bd5, both in a detached worktree.
    risk_level: medium
    follow_ups: "none"
    status: fixed
    fixed_in: d6b0bd5
  - bug_id: BUG-2026-09-25T103000
    date: "2026-09-25"
    title: "In the TUI, every 495 message and every opening diagnostic is drawn twice on the screen"
    severity: low
    priority: p2
    scope: presentation
    what_happened: >
      In Pi's terminal interface, each reply of a /495 command appears twice: once as a message box in
      the conversation, once as an info notice under it. An opening diagnostic, the off-machine model
      announcement included, appears as a warning notice when it arises, then again as a message box at
      the first /495.
    what_expected: >
      Each text is drawn once on the screen, and a diagnostic reaches the structured entry once, as the
      off-machine announcement of e25s03 requires.
    steps_to_reproduce:
      - "Open Pi in the TUI with 495 loaded and an off-machine model selected."
      - "Run `/495 status`: the warning seen at opening is drawn again as a box, and the reply is drawn as a box and as a notice."
    root_cause: >
      A message sent with `display: true` is drawn in the conversation by Pi's terminal interface
      (docs/message-types.md: `display` controls terminal rendering). `emit` added a notice to every
      such message, and `flushDiagnostics` sent every queued diagnostic with `display: true` although
      the screen had been told when it was queued. The fix of BUG-2026-09-24T175500 counted notices
      only, through a probe on `ctx.ui.notify`, and took the drawn message for a channel off the
      screen.
    evidence: >
      Seen in a vhs recording of Pi 0.87.1 in the TUI with 495 loaded
      (~/.495-campagnes/demo-readme-bench/f2.png): the off-machine warning, then the same text in a
      "Custom · 495" box, then the /495 status reply in a box and again as a notice.
      test/v3/model-select.test.ts, four tests under "on the screen of Pi's terminal interface" that
      count notices and displayed messages together: red before the fix (2 !== 1 three times, 4 !== 2),
      green after it, Preflight green (456 tests).
    risk_level: low
    follow_ups: >
      a message 495 emits is drawn once, by Pi, with no notice; a diagnostic already announced on a
      screen is kept in the session with `display: false`
    status: fixed
  - bug_id: BUG-2026-09-24T175500
    date: "2026-09-24"
    title: "In the TUI, an off-machine model announcement and every opening diagnostic reach the screen twice"
    severity: low
    priority: p3
    scope: presentation
    what_happened: >
      In the TUI, a pending diagnostic is said on the screen as soon as it arises: `announce` notifies
      the opening diagnostics as warnings, and `modelSelected` notifies an off-machine model as a
      warning. The first `/495` that follows, or the first call of the tool, runs `flushDiagnostics`,
      which hands each pending text to `emit`. In the TUI, `emit` also notifies every structured
      message as an info notice. The same text is therefore said twice on the screen, once as a
      warning and once as an info notice, besides the message in the conversation.
    what_expected: >
      Each announcement is said once per channel, as the specification of the off-machine
      announcement and the `pending` comment in `src/extension/session.ts` require: once on the
      screen, once on the structured entry.
    steps_to_reproduce:
      - "Open Pi in the TUI with 495 loaded and a local model selected."
      - "Select a model whose address is not a loopback with `/model`: one warning notice."
      - "Run `/495 status`: the same text is notified again, as an info notice."
    root_cause: >
      `emit` doubles every message with an info notice when `ctx.mode` is `tui` (since a61d217), and
      the diagnostic queue, flushed through `emit` on the first operation (since d46e0d9), was written
      for entries without a screen. The TUI is the one mode that has both. The off-machine
      announcement goes through the same queue.
    evidence: >
      Seen in Pi's real terminal interface, driven through a pseudo-terminal
      (~/.495-campagnes/e25s04-tui): a probe extension loaded before 495 records every notice Pi's
      screen receives; opened on a model declared at a non-loopback address in an isolated Pi
      configuration, then `/495 status` twice: one warning, the same text as an info notice, then the
      two replies, on the build of a888f48 before the fix; the warning alone, then the two replies, on
      the fixed build. A first pass typed too fast and ran `/495` once with help as its reply; it is
      kept as avant-1.log and apres-1.log. First probed on the code with
      ExtensionSession under a fake context in `tui` mode (hasUI true): after `modelSelected` with a
      non-loopback model, one warning notice; after `flushDiagnostics`, the same text again as an info
      notice, and one message. test/v3/model-select.test.ts, two tests under "on the screen of Pi's
      terminal interface", red at 447df46 (2 failures of 2), green at 3a9ef82 with Preflight green
      (454 tests); a third, for an ordinary opening diagnostic, red on the code of a888f48 and green
      at 4591fe8. Pi 0.87.1 sets `mode: "tui"` in the interactive context
      (`interactive-mode.js`).
    risk_level: low
    follow_ups: >
      the owner decided to fix it with the acceptance of the admitted model; a diagnostic is now
      delivered by the first operation on the structured channel alone, since a screen was told when it
      was queued
    status: fixed
    fixed_in: 3a9ef82
  - bug_id: BUG-2026-09-24T000204
    date: "2026-09-24"
    title: "A change blocked because the selected model cannot carry an intervention stays blocked after /model and /495 resume"
    severity: medium
    priority: p2
    scope: interventions
    what_happened: >
      A change whose intervention is refused because the selected model cannot carry it (no model
      selected, a thinking level the model refuses, no tool calls) is blocked `capability_missing`,
      not retryable. Selecting a model with `/model` and running `/495 resume` lifts nothing: the
      next `advance` returns `capability_missing` at once, with no step. The change can only be
      cancelled.
    what_expected: >
      The model refusal names something the user fixes in the session, by selecting another model.
      `/495 resume` lifts the block, and the next intervention runs with the model selected since.
      A sandbox that is not qualified stays refused without retry: no command of the session
      qualifies it.
    steps_to_reproduce:
      - "Open a session with no model selected and run `/495 start <request>`."
      - "The change is blocked `capability_missing: model /: cannot carry this intervention`."
      - "Select a model with `/model`, then run `/495 resume`: the status stays blocked."
    root_cause: >
      `InterventionSupervisor.requireCapable` throws the model refusal without `retryable`, and
      `Harness.resume` lifts only `execution_error` blocks and blocks declared retryable. Present
      since the capability check was written; the model became selectable within a session with
      the model read at each intervention start, which makes `/model` then resume the natural remedy.
    evidence: >
      Reproduced by a scratch test during review: `advance` with an empty selection gives
      `capability_missing`; after `resume`, `advance` with a selectable model gives
      `capability_missing` again, with no step. test/v3/model-select.test.ts, "a change refused for
      its model is resumed with the model selected since (6e)", red at 6bd0ba5 (1 failure of 7),
      green at 144d371 with Preflight green (396 tests).
    risk_level: low
    follow_ups: >
      a change blocked by a model refusal before the fix carries a non-retryable block in its
      journal, and resume still does not lift it; such a change can only be cancelled
    status: fixed
    fixed_in: 144d371
  - bug_id: BUG-2026-09-23T184520
    date: "2026-09-23"
    title: "An unreadable config.json drops the human arbitration the owner wrote"
    severity: medium
    priority: p2
    scope: configuration
    what_happened: >
      A config.json that does not parse is ignored, and the session runs under the default policy. A
      setting that asked for a human decision (`policy.adoption.design: human`,
      `g5_human_acceptance: true`, `required_reviews`) is then replaced by the kernel's own default
      until the file is fixed. The only trace is one session-open diagnostic, `config.json ignored`.
    what_expected: >
      A setting the owner wrote to keep a decision for a human is not lost behind a typo without the
      owner deciding that it may be.
    steps_to_reproduce:
      - "Write `{\"policy\":{\"adoption\":{\"design\":\"human\"},\"g5_human_acceptance\":true}` (closing brace missing) to the data directory's config.json."
      - "Call `loadConfig` on that directory, or open a session."
      - "The active policy reads `adoption.design: kernel` and `g5_human_acceptance: false`, with one diagnostic."
    root_cause: >
      The load falls back to the default configuration on any parse error. Until the egress list was
      removed, the same fallback also emptied that list, so every intervention was refused and the
      loss of the other settings could not take effect. Without the list, nothing is refused.
    evidence: >
      Probe of loadConfig on 2026-09-23 against the branch that removes the egress list; spec e25s01 §6b
      stated the fallback without weighing the other settings. After the fix, test/v1/model-admitted.test.ts
      ("refuses an unreadable file instead of running under the defaults") holds the refusal, and a cold
      start of the built extension on a file keeping `adoption.design: human`, closing brace missing,
      answers `/495 start` with `CONFIGURATION_ERROR: config.json cannot be read: it is not valid JSON;
      no change runs until it is fixed or removed` and creates no ledger. Since 2908ec6 the refusal
      lasts until a new session is started, since a runtime created later in the same session would
      run unbound and announce nothing, and a config.json that is a dangling link is refused rather
      than read as absent; test/v3/pi-rpc-sdk.test.ts holds the first, test/v1/model-admitted.test.ts
      the second. Since 0b6539d the refusal names /reload, which replaces the extension runtime as a
      new session does, and a file that is not a regular file, or whose directory cannot be searched,
      is refused without its path.
    risk_level: medium
    follow_ups: >
      none — the owner decided on 2026-09-23 that an unreadable config.json stops every change until
      it is fixed or removed, rather than giving way to the defaults.
    status: fixed
    fixed_in: bda51c7
  - bug_id: BUG-2026-09-23T184521
    date: "2026-09-23"
    title: "A config.json field of the wrong type is loaded as written, and can hand a human's decision to the kernel"
    severity: medium
    priority: p2
    scope: configuration
    what_happened: >
      `policy`, `policy.budgets` and `policy.adoption` were spread into the active policy without checking
      that they are objects, so a string or a list put index keys ("0", "1", …) into the policy. Since
      bda51c7 a section that is not an object makes the file unreadable, and no change runs. No field
      value is type-checked yet, so `max_attempts: "abc"` is still loaded as written. Three cases reach a
      guard: `policy.adoption.design: "Human"` is loaded as is, and `src/domain/change/decide.ts` compares
      with `"human"`, so the kernel adopts the design and nothing is announced — the loss the refusal of
      an unreadable file exists to prevent; `policy.integration_enabled: "false"` is truthy, so
      integration is enabled, still behind a human authorization (`src/application/phases/integrate.ts`);
      `isolation.allow_unconfined: "no"` selects the unconfined backend, which never qualifies, so every
      role that writes is refused with `CAPABILITY_MISSING` and a startup diagnostic says the backend is
      not qualified (`src/extension/runtime.ts`, `src/application/intervention.ts`). `policy.baseline`
      is object-valued but is neither checked nor merged over its default: `"x"` is loaded as is, and
      `{"tolerance":"no_aggravation"}` drops `compare_to_reference`, so the comparison with the
      reference is skipped (`src/application/verification.ts`).
    what_expected: >
      A malformed section is refused or announced, and a field of the wrong type does not reach the
      policy.
    steps_to_reproduce:
      - "Write `{\"policy\":\"ab\"}` to the data directory's config.json."
      - "Call `loadConfig` on that directory."
      - "The active policy carries the keys \"0\" and \"1\", and no diagnostic is emitted."
    root_cause: >
      The loader checks only that the file itself is an object; each section is spread as read. A
      `__proto__` key becomes an ordinary own property, so the prototype is not reached.
    evidence: >
      Probe of loadConfig on 2026-09-23; the same result on main. A second probe on 2026-09-23 loads
      `{"policy":{"adoption":{"design":"Human"},"integration_enabled":"false"},"isolation":{"allow_unconfined":"no"}}`
      as `"Human"`, `"false"` and `"no"`.
    risk_level: medium
    follow_ups: >
      config.json is validated against a contract closed at every level before any setting applies:
      a field of the wrong type, the three values above included, makes the file refused as an
      unreadable one is, without any written value. Refused in a real Pi (`~/.495-campagnes/e25s05-human`
      and `-registre`). The attempt budget that never reaches a change stays open on its own entry.
    status: fixed
    fixed_in: c290f69
  - bug_id: BUG-2026-09-23T173000
    date: "2026-09-23"
    title: "An unreadable config.json diagnostic quotes an excerpt of the file to the session's model"
    severity: low
    priority: p3
    scope: configuration
    what_happened: >
      A config.json that does not parse was announced as `config.json ignored: <message>`, where the
      message was V8's JSON syntax error. That error quotes about twenty characters of the source around
      the fault. The diagnostic is emitted by `pi.sendMessage`, and Pi converts a custom message into a
      user message of the model's context (`convertToLlm` in `dist/core/messages.js`; `extensions.md`:
      "Custom content stored and sent to the model"). An excerpt of the file therefore reached the
      provider of the session's model.
    what_expected: >
      The diagnostic says the file is ignored and why, without reproducing any of its text.
    steps_to_reproduce:
      - "Write `{\"policy\":{\"egress\":[{\"provider_id\":k7f3a9}]}}` to the data directory's config.json."
      - "Call `loadConfig` on that directory, or open a session."
      - "The diagnostic reads `config.json ignored: Unexpected token 'k', ...\"vider_id\":k7f3a9}]}}\" is not valid JSON`."
    root_cause: >
      The load reported the caught error's message as is. The same code is on main; the egress-list
      echo was bounded, this path never was.
    evidence: >
      test/v1/model-admitted.test.ts, "says an unreadable file is ignored without reproducing any of its
      text", red before the fix. Cold start of the built extension on that file after the fix:
      `495: config.json ignored: it is not valid JSON`. Since bda51c7 such a file is refused rather
      than ignored, and the test that holds it, "refuses an unreadable file instead of running under
      the defaults, without reproducing any of its text", checks the same word is absent from the
      refusal.
    risk_level: low
    follow_ups: "none"
    status: fixed
    fixed_in: dcdd890
  - bug_id: BUG-2026-09-27T220000
    date: "2026-09-27"
    title: "/495 verify sets and clears busy without reading it first, so it can drop another operation's hold"
    severity: low
    priority: p3
    scope: extension
    what_happened: >
      `/495 verify` (`src/extension/command.ts`, the `verify` case) sets `session.busy = true`
      unconditionally and clears it in its own `finally`. Every other site that touches the flag —
      `conduct`, `/495 close`, the conversational tool — checks `if (session.busy)` first and refuses
      instead of taking it over. A `verify` started while another operation already holds `busy`
      (`conduct` awaiting an IH-01 decision through `presentDecisions`, or `/495 close` awaiting its
      confirmation) would clear the flag under that other holder as soon as it returns, before the
      holder's own dialog is answered.
    what_expected: >
      A second operation that finds `busy` already set is refused, as `conduct`, `/495 close` and the
      conversational tool already are, rather than taking the flag over and releasing it under the
      first holder.
    steps_to_reproduce:
      - "Reach a change stopped on a pending IH-01 decision, or a /495 close awaiting its confirmation, over one RPC connection (`session.busy` true, a dialog await pending)."
      - "Dispatch /495 verify as a second command on the same session while that await is still pending."
      - "verify's own `finally` clears `busy` as soon as it returns, before the first operation's dialog is answered."
    root_cause: >
      `case \"verify\"` (`command.ts`, ~lines 105-121) is the only busy-touching site with no guard.
      The same shared, unguarded flag already covered `conduct`'s own hold during `presentDecisions`
      before this branch; the branch adds one more long-held window, `/495 close`'s confirmation, to an
      already-reachable race, rather than making a previously unreachable one reachable (rule 1).
    evidence: >
      `command.ts:110-119` sets and clears `busy` with no guard; `conduct.ts:36-40` and
      `command.ts:226,236` both guard first. Confirmed against Pi 0.87.1's own source, not executed:
      the RPC mode launches every received line without awaiting it (`void handleInputLine(line)`,
      `dist/modes/rpc/rpc-mode.js:647`), the `prompt` case launches `session.prompt` the same way
      (`:302`), and `AgentSession.prompt` runs an extension command immediately, with no lock
      (`dist/core/agent-session.js:1216-1224`). Two `/495` commands sent on one RPC connection can
      therefore overlap while one is mid-await. Reproduced through the command in RPC mode by the
      review of the branch that reruns a verification cut short (record
      `specs/verifications/reprise-de-verification-et-revocation-relecture.md`, round 2, R2-2):
      `/495 verify`, refused by the kernel while a conduct holds the session, leaves `busy` false, and
      a `/495 resume` asked next passes the refusal that branch gives it and is inscribed.
      test/v3/resume.test.ts, "stays refused after a /495 verify refused while another operation holds
      the session, which keeps its hold": red at 45cce76, green at c06ad23, both in a detached
      worktree.
    risk_level: low
    follow_ups: "none"
    status: fixed
    fixed_in: c06ad23
  - bug_id: BUG-2026-09-28T013000
    date: "2026-09-28"
    title: "A change paused while its verification ran cannot have a question's resolution revoked, though nothing runs"
    severity: low
    priority: p3
    scope: domain
    what_happened: >
      A change paused during its verification keeps the verification operation open: `changePause`
      (`src/domain/change/decide.ts`) refuses only a running intervention and an external effect in
      flight, and the pause closes no operation. `/495 revoke` is then refused with `OPERATION_ACTIVE`
      by `requireRevocable`, although nothing runs. The owner's only way on is `/495 resume`, which
      runs the verification again; under the default automatic acceptance G5 can then close the change
      on the answer the owner wanted to revoke. An abrupt end of the session that leaves the operation
      open gives the same refusal. Introduced by the branch that adds `/495 revoke`.
    what_expected: >
      A revocation is refused only while something runs whose output would rest on the revoked
      resolution: a paused change, or one whose session ended, runs nothing.
    steps_to_reproduce:
      - "Take a change with an answered material question to its verification, and pause it while the verification operation is open."
      - "Run `/495 revoke q1`: it is refused with OPERATION_ACTIVE, verification operation in progress."
    root_cause: >
      The pause ends a running intervention but leaves a running verification's operation open, and
      `requireRevocable` refuses any open operation. The kernel cannot tell a verification a session left
      open from one another session runs, so a change whose session ended is paused first, as one whose
      intervention was cut short already is.
    evidence: >
      Reproduced by throwaway probes on 8f683d9, at the kernel (pause after `verification.start`, then
      `question.revoke`: OPERATION_ACTIVE) and through the harness (a control runner that pauses the
      change during its verification: `verifying paused`, operation open, revocation refused). A pause
      closing the verification operation, as a temporary patch, makes both accepted. Review record
      `specs/verifications/e01s04-relecture.md`, round 1, R1-7.
    risk_level: low
    file: specs/bugs/BUG-2026-09-28T013000-revocation-refused-on-a-change-paused-during-verification.md
    follow_ups: >
      The pause closes the verification operation it suspends, and the revocation's refusal names the
      pause; red tests and order in the bug file, after BUG-2026-09-28T081300's first cycle.
    status: fixed
    fixed_in: ded5f28
  - bug_id: BUG-2026-09-28T025000
    date: "2026-09-28"
    title: "After an integration fallback, a revocation says revoked the reconciliation of the Git effect, whose effect holds, and leaves the outcome accepted"
    severity: low
    priority: p3
    scope: domain
    what_happened: >
      When the destination advances and the combined tree differs, the invalidation for
      `destination_advanced` (`src/domain/invalidation.ts`) revokes IH-10, IH-11 and IH-08 and brings
      the change back to `verifying`. Revoking IH-10 clears `acceptance_decision_id`, so
      `requireRevocable` admits a revocation again. The plan the revocation shares with the mandate
      revision revokes every valid decision but IH-01 and IH-07, IH-12 included, although the
      reconciliation of the uncertain Git effect it recorded still holds. The same path carries
      `outcome: "accepted"` into clarification, where a revised artifact would set it back to `pending`
      (`src/domain/change/apply.ts`). Introduced by the branch that adds `/495 revoke`: before it,
      nothing reached that plan after an integration.
    what_expected: >
      A revocation says revoked only a decision whose effect it undoes, and a change back in
      clarification holds no accepted outcome.
    steps_to_reproduce:
      - "Take a change to G6 with IH-10, IH-11 and an IH-12 reconciliation recorded and valid."
      - "Record that the destination advanced with a combined tree that differs: the change is `verifying ready`, outcome `accepted`."
      - "Revoke the answer to a material question: the change is `clarifying`, outcome `accepted`, and the IH-12 decision is revoked."
    root_cause: >
      The plan of the mandate revision was kept for the revocation on the ground that IH-12 only
      follows an acceptance, after which a revocation is refused; the integration fallback withdraws
      that acceptance without undoing the reconciliation. The outcome is stale from the fallback, not
      from the revocation: invalidating G5 drops the gate and leaves `accepted`, so a change back in
      `verifying` says accepted, one whose re-verification fails at G5 too, and a revocation carries it
      on. That part predates the branch.
    evidence: >
      Reproduced by throwaway kernel probes on 8f683d9: after the fallback, `verifying ready accepted`
      with IH-12 valid; after `question.revoke`, `clarifying accepted` and a `decision.revoked` naming
