      resolve-plugins fetches the plugins and their dependencies, not the site skin a report goal resolves at run time.
    evidence: >
      Probed independently by both reviewers of e28s04 on an empty local repository; the v4 tests of
      `test/v4-platform/maven-quality*.test.ts` miss it because they reuse the machine's ~/.m2, where the skin is present.
    risk_level: medium
    follow_ups: >
      Make the adoption fetch the skin (or run the report goals without site rendering), with a v4 test on an empty local
      repository.
