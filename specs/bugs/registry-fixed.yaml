      Read on 2026-09-30, and git measured: `git add -A -- package.json node_modules/x/i.js` in a project
      ignoring `node_modules/` prints the message above and exits 1, while the tracked file is still
      staged. In a project that does not ignore `node_modules/`, the same command stages the dependency
      files, which would commit them. The path from the integrator to that call was not run end to end.
