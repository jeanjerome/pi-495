    follow_ups: "none"
    status: fixed
    fixed_in: bd10032
  - bug_id: BUG-2026-09-29T170000
    date: "2026-09-29"
    title: "A candidate that adds a file under node_modules/ is not refused, though the file can shadow a dependency the vitest control loads"
    severity: medium
    priority: p2
    scope: application
    what_happened: >
      The vitest unit control protects `node_modules/` as a directory. `protectedPathsChanged` allows
      a file added under a protected directory, so a candidate that adds
      `node_modules/vitest/node_modules/<package>/index.js` (which shadows the hoisted package for
      vitest) is frozen with that file in `allowed_protected_paths` and no altered protected path;
      only a modified or deleted file under `node_modules/` is refused.
    what_expected: >
      A candidate that changes what the vitest that judges it loads is refused, whether it modifies an
      installed file or adds one that takes the place of another.
    steps_to_reproduce:
      - "Call `protectedPathsChanged` on a manifest with `node_modules/vitest/node_modules/tinyrainbow/index.js` added and `node_modules/vitest/dist/index.js` modified, protected paths `['node_modules/']`."
      - "`altered` holds only `dist/index.js`; the added file is in `allowed`."
    root_cause: >
      The rule that a file added under a protected directory takes nothing from an oracle that already
      stood (`src/domain/gates/g4.ts`) holds for `test/` and `tests/`, where a new file is a new test.
      Under `node_modules/` a new file can resolve before an existing one. The rule is on main; the
      branch makes it reachable for `node_modules/` by protecting that directory in
      `vitestControl` (`src/application/stacks/node.ts`).
    evidence: >
      A throwaway probe of `protectedPathsChanged` on the manifest above returned
      `altered: [node_modules/vitest/dist/index.js]` and
      `allowed: [node_modules/vitest/node_modules/tinyrainbow/index.js]`. The promise of the story
      names a modified file, which the code refuses.
    risk_level: medium
    follow_ups: >
      Decide whether a file added under `node_modules/` is refused (a candidate that installs a
      dependency is then refused too) or accepted when it shadows nothing that exists on the
      reference; either adds a refusal or a resolution check, so it is a product decision.
    status: fixed
    fixed_in: a3ecb9e
