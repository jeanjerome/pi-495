      decision is pending. The specification skips a question already open
      (`src/application/phases/clarify.ts`), so nothing presents IH-01 again. Reachable on main: a
      coordinator probe on the `src/` of `fa7d370` reaches the same state through the second session's
      resume.
    evidence: >
      Review record `specs/verifications/reprise-de-verification-et-revocation-relecture.md`, round 3,
      B3-1 and A3-P1: probes of reviewers A and B on 82ff627, and the coordinator's probe on main
      (`REVISION_CONFLICT`, revision 59 against 48 expected; eight `clarifying -> clarifying/ready`
      steps). Declared in BUG-2026-09-28T081300, "Not covered".
      test/v2-kernel/answer-revocation.test.ts, "a revoked change blocked over its question asked again comes
      back to that question once its stop is lifted": red at f17f5a6, green at 89d6ecf; "a block
      written by a session whose record lost to the owner's revocation does not overwrite it": red at
      fad0ad9, green at 4532f55; both in a detached worktree.
    risk_level: low
    follow_ups: "none"
    status: fixed
    fixed_in: 4532f55
