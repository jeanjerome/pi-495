story_id: e01s03
spec: e01s03-seul-l-humain-declare-qu-une-question-n-est-plus-materielle.md
title: "Seul l'humain déclare qu'une question n'est plus matérielle ou qu'une réponse ne fixe rien d'observable"
status: passing
bcps: 5
requirement: BES-02
delta: ADDED
risk: P0
context: domain
