  - id: 4
    description: >
      `/495 revoke <question>` révoque depuis Pi, sur le modèle de `/495 close`. La commande exige
      une liaison, une question et une session libre. Elle exige une provenance humaine. Dans le
      TUI, une confirmation dit, en français et en anglais, que la question sera reposée et que le
      mandat, les exigences et tout ce qui a été adopté depuis ne le seront plus. Puis la conduite
      reprend et présente IH-01 reposée. En `print` ou `json`, la sortie dit qu'une provenance
      humaine est exigée, et rien n'est inscrit. Une confirmation refusée n'inscrit rien. Un refus
      du noyau affiche son code et son motif. L'aide et la description de `/495` nomment `revoke`.
      Tenu dans `test/v3/answer-revocation.test.ts`, sur un changement arrêté en clarification
      parce que la spécification perd la réponse à Q1 :
      - en TUI, confirmation acceptée : l'arrêt est levé, la sélection présentée ensuite est IH-01
        de Q1 avec ses trois options, le journal inscrit la révocation, et la révocation elle-même
        ne lance aucune intervention ;
      - en `print` : la sortie dit la provenance humaine exigée, et Q1 reste répondue ;
      - confirmation refusée : Q1 reste répondue et le changement reste arrêté ;
      - une question inconnue affiche `495 error: UNKNOWN_REFERENCE` ;
      - une session tenue par une autre opération 495 : la sortie dit le refus, et Q1 reste
        répondue.
      Aujourd'hui, `revoke` n'est pas une sous-commande : `/495 revoke q1` répond par la ligne
      d'aide et n'inscrit rien. Le test échoue sur la sélection IH-01 attendue, sur la phrase de
      provenance, sur le code d'erreur et sur le refus de la session tenue. La confirmation refusée
      et l'absence d'intervention valent aujourd'hui aussi : ces assertions n'ont pas de rouge, et
      restent aux mutations. La surface de `harness495`
      interdit déjà `revoke`, et reste tenue par `test/v3/question-closure.test.ts`.
    verify: "node --test test/v3/answer-revocation.test.ts test/v3/question-closure.test.ts"
    risk: P0
    security: high
    security_verify: >
      Aucun constat nouveau sur src/extension/command.ts et src/extension/tool.ts. La révocation
      n'est atteignable que par une sous-commande humaine, jamais par l'outil exposé au modèle. Une
      session sans humain qualifié n'inscrit rien. `/495 revoke` lit le verrou de session avant de
      le prendre, et le rend avant la conduite.
    status: failing
    allure:
      severity: critical
      categories:
        - "Security Review"
        - "extension"
        - "DEC-06"

