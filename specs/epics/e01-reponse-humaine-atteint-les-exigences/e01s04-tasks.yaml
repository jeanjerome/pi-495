tasks:
  - id: 1
    description: >
      Le noyau révoque la résolution d'une question matérielle, désignée par la question, dans une
      seule décision. La réponse ou la clôture et son acteur sont retirés. La décision IH-01 que le
      noyau a associée à la question en la posant est révoquée quand elle existe. G0 et les gates
      suivantes sont retirées. Aucun artefact ne reste adopté, et le protocole n'est plus gelé. Les
      preuves et les relectures sont invalidées. Les décisions enregistrées hors IH-01 sont
      révoquées, et les décisions en attente hors IH-01 sont retirées. Le changement revient en
      clarification. Une décision IH-01 repose la question sous l'identifiant de la demande que
      porte la commande, et l'événement de révocation porte l'acteur. La provenance est vérifiée par
      la fonction de la réponse à une décision et de la clôture. La révocation est refusée, en le
      disant, dans ces cas :
      une question inconnue, non matérielle, ou ni répondue ni close ; un changement inactif ; la
      phase `integrating` ; une intervention qui tourne ; une opération ouverte. `decision.revoke`
      et la cause `authorization_revoked` sont retirés : le noyau n'a plus qu'une révocation.
      Tenu dans `test/v0/change-rules.test.ts`, en cinq cas.
      (a) Q1 et Q2 sont répondues par IH-01, et le changement est conduit jusqu'à `deciding` sous
      `g5_human_acceptance` et une adoption humaine du mandat, IH-10 en attente. Après la
      révocation de Q1 :
      - Q1 n'a plus de réponse et sa décision IH-01 est révoquée ; celle de Q2 reste valide ;
      - la décision IH-02 qui a adopté le mandat est révoquée ;
      - aucune gate ne subsiste, aucun artefact n'est adopté, et le protocole n'est plus gelé ;
      - IH-10 n'est plus en attente, et une IH-01 attend pour Q1 sous le nouvel identifiant ;
      - la phase est `clarifying`.
      (b) Q1 est close par IH-01 puis révoquée : elle n'est plus close, n'a plus d'acteur de
      clôture, et sa décision est révoquée. Q1 close par `question.close` se rouvre de même, sans
      décision à révoquer.
      (c) Un acteur `agent` d'origine `tui_session`, une origine `model_output` ou `tool_call`, et
      une authentification `none` sont refusés en `INVALID_PROVENANCE`, et Q1 reste répondue.
      (d) Chaque refus de portée nomme sa cause, et Q1 reste répondue.
      (e) En clarification, IH-01 attend pour Q2 quand Q1, répondue, est révoquée : IH-01 attend
      pour Q2 et pour Q1.
      Aujourd'hui, aucune commande ne révoque la résolution d'une question. La seule révocation du
      noyau, `decision.revoke`, désigne une décision et ne vérifie que l'origine de l'acteur. Elle
      laisse la question répondue, les gates, les adoptions et IH-10 en place, et le changement
      dans sa phase (M5). Le rouge se voit sur la nouvelle entrée, conduite d'abord par l'effet de
      `decision.revoke`, comme le ferait une commande seulement branchée :
      - (a) échoue sur Q1 encore répondue, puis sur IH-02 restée valide ;
      - (b) échoue sur Q1 encore close ;
      - (c) échoue sur l'acteur `agent` d'origine `tui_session`, accepté ;
      - (d) échoue sur le changement clos, la phase `integrating` et l'intervention qui tourne,
        tous acceptés ;
      - (e) échoue sur l'absence d'IH-01 en attente pour Q1.
      Trois assertions n'ont pas de rouge, parce que cet effet les refuse déjà ou les laisse
      intactes : la décision de Q2 restée valide, et le refus d'une question inconnue ou non
      résolue. Elles restent aux mutations de la relecture.
    verify: "node --test test/v0/change-rules.test.ts"
    risk: P0
    security: high
    security_verify: >
      Aucun constat nouveau sur src/domain/change/decide.ts, src/domain/change/apply.ts et
      src/domain/invalidation.ts. La révocation passe par la seule vérification de provenance du
      noyau, et aucune autre révocation ne subsiste. La décision révoquée est celle que le noyau a
      associée à la question, jamais une décision désignée par l'appelant (M4). Aucune gate,
      adoption ou décision en attente hors IH-01 ne survit à la décision qui inscrit la révocation
      (M5), et une intervention qui tourne la refuse (M6).
    status: failing
    allure:
      severity: critical
      categories:
        - "Security Review"
        - "domain"
        - "DEC-06"

  - id: 2
    description: >
      Le harnais révoque la résolution d'une question pour le propriétaire. Il construit la demande
      IH-01 de la question comme la clarification la construit, dans la langue du changement, et la
      remet au noyau avec la révocation. Il rend la vue du changement et l'erreur éventuelle, sans
      lancer d'intervention. Le dossier exporté dit `revoked` toute décision que l'état tient pour
      révoquée.
      Tenu dans `test/v2/answer-revocation.test.ts`. Le changement est conduit sous
      `g5_human_acceptance` jusqu'à IH-10, après la réponse « 400 » à Q1. Après la révocation de Q1 :
      - les décisions en attente présentées au propriétaire sont exactement une IH-01, dont la
        question est celle de Q1 et les options répondre, clore et abandonner ;
      - aucune intervention n'a été lancée ;
      - le rapport dit la décision IH-01 de Q1 « (revoked) » ;
      - l'index exporté des décisions la dit `revoked: true`.
      Aujourd'hui, le harnais n'a pas de révocation. Conduite par `decision.revoke`, elle laisse
      IH-10 seule en attente et aucune IH-01, et le test échoue sur la décision présentée. L'index
      exporté recopie l'enregistrement fait au moment de la réponse, et dit donc `revoked: false` de
      toute décision : le test échoue aussi sur l'export. Le « (revoked) » du rapport, lu dans
      l'état, passe déjà sur l'effet de `decision.revoke` : cette assertion n'a pas de rouge.
    verify: "node --test test/v2/answer-revocation.test.ts"
    risk: P0
    security: high
    security_verify: >
      Aucun constat nouveau sur src/application/harness.ts et src/export/export-service.ts. La
      révocation prend la provenance de l'hôte, jamais du contenu. La demande IH-01 qui repose la
      question est inscrite dans la même décision que la révocation. Le dossier exporté ne dit
      révoquée qu'une décision que l'état tient pour révoquée, et n'en dit aucune valide qui l'ait
      été.
    status: failing
    allure:
      severity: critical
      categories:
        - "Security Review"
        - "application"
        - "DEC-06"

  - id: 3
    description: >
      Après une révocation, aucun rapport de spécification écrit avant elle n'est repris comme
      rapport courant, ni hérité par la clarification ou la spécification des exigences. Dès que la
      question reposée est résolue, la spécification est réécrite. La demande porte la nouvelle
      réponse comme réponse à déclarer, ou la question comme close. Les bornes d'e01s01 et e01s02
      s'appliquent ensuite comme après une première réponse.
      Tenu dans `test/v2/answer-revocation.test.ts`, avec trois rapports successifs :
      - un rapport qui pose Q1 ;
      - un rapport qui lie Q1 à REQ-400 ;
      - un rapport qui lie Q1 à REQ-422.
      Après la réponse « 400 », la conduite jusqu'à IH-10, la révocation, puis la réponse « 422 » :
      - une intervention de spécification est lancée après la nouvelle réponse ;
      - sa demande porte « Q q1: … -> 422 [to declare in `answers`] » ;
      - les exigences adoptées à G1 lient Q1 à REQ-422, et ne portent plus REQ-400 ;
      - le protocole gelé à G2 porte l'obligation de REQ-422 et non celle de REQ-400.
      Second cas : après la révocation, clore Q1 reposée lance une intervention de spécification.
      Sa demande dit Q1 close, et le mandat proposé porte Q1 close avec l'acteur.
      Aujourd'hui, une fois la tâche 2 faite, la clarification reprend le rapport qui liait Q1 à
      REQ-400. Ce rapport déclare Q1 : il est tenu pour établi, sans réécriture. Aucune intervention
      n'est lancée, et les exigences adoptées lient « 422 » à REQ-400, écrite pour « 400 ». Clore Q1
      reprend de même ce rapport. Le test échoue sur l'intervention de spécification que la story
      dit lancée, puis sur la liaison à REQ-422.
    verify: "node --test test/v2/answer-revocation.test.ts test/v2/specification-reopening.test.ts"
    risk: P0
    security: high
    security_verify: >
      Aucun constat nouveau sur src/application/artifacts.ts, src/application/phases/clarify.ts et
      src/application/phases/specify.ts. Aucune déclaration faite avant une révocation ne porte la
      nouvelle réponse, et aucun rapport écrit sur la foi de la réponse révoquée ne fonde un mandat
      ou des exigences après elle. Les bornes de réécriture d'e01s01 et e01s02 restent tenues :
      specification-reopening.test.ts passe inchangé.
