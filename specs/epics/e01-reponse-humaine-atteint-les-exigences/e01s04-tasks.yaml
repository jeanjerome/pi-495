# Toute tâche naît failing et ne bascule qu'après une sortie en 0 (D-52). Les commandes nomment
# des tests qui n'existent pas encore : leur échec est la cible, pas un défaut du plan.
#
# Chaque description finit par le test qui la tient, ce qu'il vérifie dans les termes de la story,
# et ce que le code fait aujourd'hui qui le fait échouer (D-63). Le test s'écrit d'abord ; son rouge
# se voit sur cette assertion, et s'inscrit à specs/verifications/e01s04-cycle-rouge-vert.md quand il
# est vu. Une assertion que le code d'aujourd'hui ne peut pas faire échouer est nommée comme telle :
# ce sont les mutations de la relecture qui la tiennent.
#
# Les tâches 1 à 4 se font dans l'ordre : le rouge de la tâche 3 n'existe qu'une fois la tâche 2
# verte, et la tâche 4 conduit la révocation que les tâches 1 à 3 construisent.
#
# security_verify: ce qu'une tâche classée high doit établir en plus de sa commande. Le dépôt n'a
# pas d'analyseur automatique ; la vérification est conduite à la main sur les chemins touchés, et
# son absence de constat est écrite au moment où la tâche bascule.

story_id: e01s04
spec: e01s04-une-reponse-donnee-par-erreur-se-revoque-et-ce-qui-en-decoulait-n-est-plus-adopte.md
title: "Une réponse donnée par erreur se révoque, et ce qui en découlait n'est plus adopté"
status: failing
bcps: 5
requirement: DEC-06
delta: ADDED
risk: P0
context: domain
