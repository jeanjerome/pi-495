tasks:
  - id: 1
    description: >
      495 lit le modèle que Pi tient pour sélectionné, avec son niveau de réflexion, au démarrage
      de chaque intervention, et une seule fois. Un modèle choisi par `/model`, par le cycle de
      modèles ou retrouvé à la reprise de session est donc celui de l'intervention suivante.
      L'intervention l'inscrit à son démarrage, si bien que la frontière entre deux modèles se lit
      au journal. Une intervention en cours garde le modèle avec lequel elle a démarré. Aucune
      copie n'est tenue par 495 : le contexte de Pi lit son modèle à l'appel (Pi 0.87.1). La
      sélection est lue dans le contexte de la commande ou de l'outil qui fait avancer le
      changement, jamais dans celui de l'ouverture de session, que Pi rend caduc quand il remplace
      la session.
    verify: "node --test test/v3/model-select.test.ts"
    risk: P1
    security: medium
    security_verify: >
      Aucun constat nouveau sur src/extension/session.ts. Le modèle reçu vient de l'hôte, jamais
      d'un fichier du projet cible, et il ne change que la sélection : la politique reste celle qui
      a été chargée.
    status: passing
    allure:
      severity: high
      categories:
        - "Security Review"
        - "integration"

  - id: 2
    description: >
      La vérification de capacité juge le modèle sélectionné au démarrage de l'intervention, pas
      celui de l'ouverture de session, et le modèle inscrit et remis au worker est celui qui a été
      jugé. Une session ouverte sans modèle, puis dotée d'un modèle par `/model`, lance
      `/495 start` sans refus.
    verify: "node --test test/v3/model-select.test.ts"
    risk: P0
    security: high
    security_verify: >
      Aucun constat nouveau sur src/application/intervention.ts : un modèle changé ne contourne pas
      la sonde de capacité, qui est appliquée au modèle effectivement joint.
    status: passing
    allure:
      severity: critical
      categories:
        - "Security Review"
        - "integration"

  - id: 3
    description: >
      L'ensemble des contrôles passe avec le changement.
    verify: "npm run check"
    risk: P1
    security: low
    status: passing
