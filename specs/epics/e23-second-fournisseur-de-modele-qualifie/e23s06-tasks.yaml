tasks:
  - id: 1
    description: >
      Le worker ouvre sa session avec un observateur posé sur `before_provider_request`, chargé par
      son propre chargeur de ressources, sans fork ni modification de Pi. Rien d'autre n'y entre.
      La tâche établit par exécution qu'un observateur qui ne renvoie rien laisse la requête
      intacte : un point d'accès de substitution reçoit le même corps avec et sans lui. Elle dit
      aussi ce que 495 fait le jour où l'accroche change ou disparaît, puisque Pi la présente comme
      un outil de débogage. Sur la version épinglée, la vérification de types échoue. Sur une autre
      version installée, une session qui a reçu une réponse sans qu'aucune observation arrive est
      inscrite comme non observée. Une erreur de l'observateur ne bloque pas la requête : l'hôte
      l'écarte et envoie la charge inchangée (Pi 0.87.0, `ExtensionRunner.emitBeforeProviderRequest`).
    verify: "node --test test/v3/provider-request-hook.test.ts"
    risk: P1
    security: medium
    security_verify: >
      L'observateur ne renvoie jamais de valeur et ne s'abonne à aucune accroche d'en-têtes. Il ne
      garde rien de la charge utile hors des textes système que 495 n'a pas écrits. Le chargeur de
      ressources ne charge aucune extension du projet cible.
    status: passing
    allure:
      severity: high
      categories:
        - "Security Review"
        - "integration"

  - id: 2
    description: >
      Ce que le fournisseur a écrit autour des instructions de 495 est relevé dans la charge utile,
      là où son bloc système est déjà composé, et non déduit de la table que 495 entretient. Deux
      formes sont lues : les messages Anthropic, dont le système est une liste de blocs de texte, et
      les complétions compatibles OpenAI, dont le système est le premier message. Le relevé situe
      l'invite que l'hôte rapporte avoir composée, et range le reste au-dessus ou au-dessous. Ce que
      cette invite contient en plus des instructions de 495 est la part de l'hôte : Pi 0.87.0 la
      termine par le répertoire de travail de la session. Des instructions introuvables telles
      quelles sont un écart nommé. Pi passe la charge sans la typer : une API
      inconnue, ou une forme inattendue, donne une observation non relevée avec sa raison, jamais
      une liste vide.
    verify: "node --test test/v1/imposed-layers-observed.test.ts"
    risk: P1
    security: low
    status: passing
    allure:
      severity: high
      categories:
        - "unit"

  - id: 3
    description: >
      Le dossier de chaque intervention porte ce qui a été observé, marqué comme un fait relevé et
      non comme une attente. La première observation d'une intervention est inscrite, puis chaque
      requête qui diffère de la précédente ; une session sans requête le dit. Le manifeste est écrit
      avant l'intervention et la charge utile n'existe qu'à l'envoi : l'observation voyage donc
      comme un événement d'intervention, sur le chemin qu'a pris la réécriture du contexte (`D-58`),
      et le relevé de fin d'intervention la porte à côté du coût. Le choix de l'accroche est tranché
      par lecture de Pi 0.87.0 : le bloc d'abonnement est ajouté par `buildParams` au moment de la
      sérialisation, donc après `context_with_system`, qui ne le porte pas.
    verify: "node --test test/v2/observed-layers-dossier.test.ts"
    risk: P1
    status: passing
    allure:
      severity: high
      categories:
        - "integration"

  - id: 4
    description: >
      Un écart entre l'observé et l'attendu est un fait écrit au dossier, et non un silence. Le
      noyau compare la liste du manifeste à l'observation et inscrit la concordance ou chaque écart
      par son type : attendu et non observé, avec la condition déclarée à côté ; observé et non
      attendu, avec sa position ; instructions de 495 introuvables. Un texte changé donne les deux
      premiers, et les deux textes sont au dossier. Une observation non relevée n'est comparée à
      rien : le dossier dit qu'elle manque. La déclaration du domaine garde sa forme, et son
      commentaire dit qu'elle est l'attente. Aucun écart n'arrête une intervention.
    verify: "node --test test/v2/imposed-layers-divergence.test.ts"
    risk: P1
    status: passing
    allure:
      severity: high
      categories:
        - "integration"

  - id: 5
    description: >
      La décision est consignée. L'observation est la source de ce que le modèle a reçu, et la
      déclaration n'est plus qu'une attente. La sur-déclaration du §6f d'`e23s02` reste, puisqu'elle
      est désormais visible comme écart. Le contrôle qui relisait le paquet du fournisseur perd sa
      raison d'être : l'observation voit le même changement, sur la version réellement installée.
      Sa branche n'est pas fusionnée. La décision dit aussi ce qui répond à la fragilité d'une
      accroche que Pi présente comme un outil de débogage.
    verify: "test -s specs/adr/D-60-la-strate-imposee-est-observee-dans-la-requete-et-la-declaration-devient-une-attente.md"
    risk: P3
    status: passing
