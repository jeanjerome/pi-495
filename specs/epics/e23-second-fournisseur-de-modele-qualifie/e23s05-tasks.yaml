  - id: 2
    description: >
      Le dossier porte, pour chaque intervention, le coût que l'hôte totalise pour la session, et
      d'où il vient : un calcul au tarif du catalogue de l'hôte, qui dit aussi si le fournisseur est
      employé par abonnement. La source est `getSessionStats()`, qui agrège toutes les entrées de la
      session, résumés et rafraîchissements du cache compris (Pi 0.87.0,
      `core/agent-session.d.ts`). La présence d'un abonnement se lit par
      `modelRuntime.isUsingSubscription()`, qu'emploie le pied de page de Pi. 495 ne tient aucune
      table de prix. Un modèle dont le catalogue porte un tarif nul, ou une session qui ne rapporte
      aucun usage, a un coût inconnu avec sa raison, jamais un coût nul. Le test oppose la lecture à
      une vraie session de l'hôte. Ce qui change de forme, c'est l'événement de fin d'intervention et
      le protocole du worker : aucun contrat publié ne décrit l'intervention, et `npm run contracts`
      ne change aucun des 28 schémas. Rien n'est engagé pendant qu'une campagne tourne.
