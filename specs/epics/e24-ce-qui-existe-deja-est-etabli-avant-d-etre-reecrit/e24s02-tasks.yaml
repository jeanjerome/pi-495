# Comme e24s01, ces tâches sont écrites sur un travail déjà livré — trois commits, Preflight vert à
# chacun. Leur état passant est constaté, pas obtenu par le cycle rouge-puis-vert que D-52 demande.
#
# Deux des tâches ont bien eu leur rouge, et il vaut d'être dit parce qu'il a été utile : la tâche 5
# a échoué lorsque la neutralisation a été retirée du chemin de dessin pour l'éprouver, et la
# tâche 6 lorsque le paquet installé a été fait dériver pour de vrai. Une tâche dont personne n'a vu
# le rouge n'établit rien.

