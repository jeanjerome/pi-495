tasks:
  - id: 1
    description: >
      La modification est dessinée en gouttière : barre, numéro de ligne, signe et séparateur à
      gauche, code à droite. Un `+` ou un `-` qui appartient au programme reste à droite du
      séparateur, donc un caractère du programme.
    verify: "node --test test/v0/review-surface.test.ts"
    risk: P1
    status: passing
  - id: 2
    description: >
      Les lignes remises au moteur sont construites depuis les segments que le harnais a calculés. Le
      moteur place et peint ; il ne décide pas de ce qui a changé. Une ligne inchangée entre deux
      lignes changées est dessinée une fois, comme contexte.
    verify: "node --test test/v0/review-surface.test.ts"
    risk: P1
    status: passing
  - id: 3
    description: >
      Un repli du contexte annonce combien de lignes inchangées il cache, et un second appui les
      remet. Un repli muet laisserait confondre une modification courte et une modification montrée
      courte.
    verify: "node --test test/v0/review-surface.test.ts"
    risk: P1
    status: passing
  - id: 4
    description: >
      La vue des modifications occupe tout l'écran et l'arbre revient avec tout autre mode ; sous le
      seuil étroit les panneaux alternent comme avant. Le moteur replie ses lignes pour la largeur du
      terminal qu'il lit lui-même et n'en accepte aucune de son appelant.
    verify: "node --test test/v0/review-surface.test.ts"
    risk: P1
    status: passing
  - id: 5
    description: >
      Une séquence terminal tenue dans un fichier relu est rendue inerte avant d'atteindre le moteur,
      qui peint ce qu'on lui donne sans rien inspecter.
    verify: "node --test test/v0/review-surface.test.ts"
    risk: P0
    security: high
    security_verify: >
      Éprouvé par un contrôle négatif : la neutralisation retirée du chemin de dessin, la tâche
      échoue ; remise, elle passe. Aucun autre chemin ne remet du texte du projet au moteur — la
      construction des lignes est le seul point de passage, et elle neutralise chacune.
    status: passing
  - id: 6
    description: >
      Les déclarations écrites à la main pour un paquet qui n'en publie pas sont refusées dès qu'il
      ne les tient plus. Le contrôle compile les appels de la revue contre le paquet installé, sans
      le renvoi de `paths`, donc la comparaison est celle du compilateur.
    verify: "npm run lint:declarations"
    risk: P1
    security: medium
    security_verify: >
      Éprouvé par un contrôle négatif réel : un champ renommé dans le paquet installé, la porte
      refuse en nommant la sonde ; le paquet restauré, elle repasse. Le contrôle lit le paquet, il ne
      le restate pas.
    status: passing
  - id: 7
    description: "L'ensemble des contrôles passe avec le changement."
    verify: "npm run check"
    risk: P1
    status: passing
