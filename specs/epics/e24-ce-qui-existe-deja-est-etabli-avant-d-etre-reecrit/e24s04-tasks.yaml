# Toute tâche naît failing et ne bascule qu'après une sortie en 0 (D-52). Les commandes opposent au
# relevé ce qu'il doit porter : c'est faible par nature — une expression qui cherche nos propres mots
# dans notre propre fichier — et ça n'est pas déguisé en preuve d'exécution. Ce qui tient vraiment
# cette story est que chaque décompte du relevé a été mesuré sur les deux arbres installés par une
# commande dont la sortie est reproductible, et que trois décomptes antérieurs en sont ressortis faux.
#
# Les trois commandes ont changé de cible, et le motif est mesuré plutôt que préféré. Elles visaient
# `e24s04-ce-que-pi-tient.md`, dans la capsule. Ce nom tombe sous `^e\d+s\d+-.+\.md$`, le motif par
# lequel `scripts/check-story-format.ts` reconnaît une spécification de story : un relevé écrit là se
# ferait réclamer les vingt sections du gabarit, et `npm run lint:story-format` refuserait. Essayé,
# refusé sur « section 1. Business narrative is missing ». Le relevé rejoint donc celui de `e24s01`
# et de `e24s03`, dans le périmètre, sous l'epic qu'il instruit.
#
# Les nouvelles commandes ont été éprouvées rouges avant l'écriture, contre l'état que HEAD portait,
# puis vertes après : le cycle de D-52 est tenu, et le mot cherché n'est jamais un nombre — une
# remesure garde ses phrases et change ses chiffres, et une porte accrochée au chiffre périmerait
# sans que rien ait faibli. C'est d'ailleurs exactement le défaut que cette story a trouvé ailleurs.

