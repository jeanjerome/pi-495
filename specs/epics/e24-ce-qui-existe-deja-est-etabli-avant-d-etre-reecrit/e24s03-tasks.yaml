# Toute tâche naît failing et ne bascule qu'après une sortie en 0 (D-52). Les commandes opposent au
# relevé ce qu'il doit porter : c'est faible par nature — une expression qui cherche nos propres mots
# dans notre propre fichier — et ça n'est pas déguisé en preuve d'exécution. Ce qui tient vraiment
# cette story est que chaque chiffre du relevé a été mesuré sur cette machine, par une commande dont
# la sortie est reproductible.
#
# Les cinq commandes ont été rouges avant que le relevé soit écrit, et vertes après : le cycle de
# D-52 est tenu ici, ce que la capsule de e24s01 ne pouvait pas dire.
#
# Les commandes cherchent une affirmation, jamais un chiffre : un relevé remesuré garderait ses
# phrases et changerait ses nombres, et une porte accrochée au nombre périmerait à la mesure
# suivante sans que rien ait faibli.

