      d'exécution, et ce que le refus capability_missing suppose d'elle. Un candidat comparé à un
      besoin non écrit se choisit sur ses qualités, pas sur les nôtres.
    verify: "grep -qF \"Ce que le besoin demande, écrit avant les candidats\" specs/product/SCOPE_LATEST.yaml"
    risk: P2
    status: passing
  - id: 2
    description: >
      Les candidats sont relevés sur la machine, pas sur ce qu'une page annonce : les quatre motifs
      que la documentation de containerization traite, les deux extensions d'exemple livrées, et les
      backends écrits à la main que le dépôt porte aujourd'hui. Chacun avec sa licence, son
      entretien, son poids et ce à quoi il lie.
    verify: "grep -qF '@anthropic-ai/sandbox-runtime' specs/product/SCOPE_LATEST.yaml && grep -qF '@earendil-works/gondolin' specs/product/SCOPE_LATEST.yaml"
    risk: P2
    status: passing
  - id: 3
    description: >
      L'écart entre ce que le dépôt écrit à la main et ce que l'écosystème livre est chiffré — lignes
