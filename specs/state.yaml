  last_step_completed: >
    `e23s05` EST TENUE. Ses sept tâches passent, et Preflight est vert sur Node 24.21, avec 365
    tests. Le relevé est `specs/verifications/e23s05-budgets-remesures.md`, et la matrice porte ses
    preuves sur les lignes NFR-04 et AGT-02. La branche `borne-d-appels-et-cout` n'est ni fusionnée
    ni poussée.

    CE QUI EST ÉTABLI. Quel que soit le rôle, la borne d'appels atteinte arrête le changement sous
    `budget_exhausted`. Le motif nomme la borne, sa valeur et ce qui a été consommé, rien ne démarre
    avant la relance, et la relance est inscrite au nom de qui relance. Chaque intervention porte le
    coût que l'hôte totalise, ou un coût inconnu avec sa raison, jamais un zéro. La relecture d'un
    dossier conservé se fait sans Pi (`scripts/measure-budgets.ts`). Trois campagnes réelles sont
    conservées sur la même cible et la même référence : `~/.495-campagnes/e23s05-distant`, arrêtée
    puis relancée sous le nom du noyau, avant la correction ; `e23s05-local`, sans arrêt ; et
    `e23s05-relance-locale`, arrêtée puis relancée au nom de `jeanjerome`.

    CE QUI RESTE OUVERT, CONSTATÉ SANS ÊTRE CORRIGÉ.
    1. La fin d'une intervention tronquée par la durée dit « the workspace keeps the unfinished
       work » pour tous les rôles. C'est faux pour la spécification, dont l'espace est effacé à la
       fin de l'intervention. Ce que la durée fait des autres rôles relève de `D-19`.
    2. Sur un même cas, le modèle local a tourné à 4,6, 2,5 puis 6,1 appels par minute, de part et
       d'autre de la bascule à 5. Le commentaire de `policy.ts` et `D-59` décrivent la seule mesure
       à 4,6, et « sur le modèle local, la durée tombe la première » ne vaut que pour elle.
    3. Une relance sans origine humaine établie (mode `-p`, ou RPC sans
       `HARNESS495_RPC_HUMAN_ACTOR`) est encore inscrite au nom du noyau.
    4. Le journal ne garde pas les bornes en vigueur. Seul le détail d'un arrêt en porte la valeur
       (`4/3`), et la relecture lit `config.json` tel qu'il est au moment où on la lance.
    5. Les appels lancés dans le même lot que celui qui dépasse la borne finissent aussi en erreur,
       même s'ils tenaient dans la borne. Le journal compte trois appels, le worker quatre.

    SUITE. `e23s06`, en attente : le dossier enregistre la strate imposée telle que le fournisseur
    l'a écrite.
