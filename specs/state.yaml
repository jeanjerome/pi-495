handoff:
  next_skill: verify-work
  last_step_completed: >
    e23s02 est faite : ses six tâches passent, un `status: passing` par tâche et au niveau de la
    story, et Preflight sort vert avec ce changement compris — 318 tests sur 318, neuf contrôles de
    lint, zéro avertissement.

    Chaque tâche a suivi le cycle rouge-vert en deux commits distincts, jamais mêlés : un commit
    `test:` seul, vérifié rouge à l'isolement par un arbre de travail détaché sur son propre
    parent, puis un commit `feat:` qui le fait passer. Le script du paquet cité par develop-tdd
    pour ce contrôle mécanique — `verify-tdd-red-commit.sh` — souffre du même défaut de racine que
    la porte de cohérence : invoqué à son chemin `/opt/homebrew`, il jugerait le dépôt Git de
    Homebrew. Il n'a pas été appelé ; la vérification d'isolement a été faite à la main, sur chaque
    commit rouge, et son résultat est dans l'historique des tool calls plutôt que dans ce fichier.

    Quatre pièces portent le changement. `src/domain/imposed-layers.ts` déclare, par identifiant de
    fournisseur, ce qu'il impose au-dessus des instructions locales — texte, position, condition —
    vide pour un fournisseur qui n'impose rien, inconnu, ou dont l'identifiant est vide ; seul
    `anthropic` est connu, la valeur relevée sur le paquet 0.86.1 pendant la planification.
    `ContextManifest` et `ContextInput` gagnent un champ `imposed_layers`, toujours présent, jamais
    mêlé à `trusted_instructions` ; `buildContext` le recopie sans le composer. `harness.ts`
    renseigne ce champ depuis `this.deps.model.provider_id` à chaque construction de contexte, donc
    sur toute intervention, écrivante ou non. `scripts/check-provider-system-block.ts`, nouveau,
    lit le paquet que le dépôt épingle — jamais celui installé sur la machine, D-54 — exige
    exactement une occurrence de la forme repérée, et refuse sur zéro, sur plus d'une, ou sur un
    texte qui diffère ; il est chaîné dans `npm run check` sous `lint:capsule` et
    `lint:provider-block`, désormais neuf contrôles de lint. `AGENTS.md` et `CONVENTIONS.md`
    portent le compte à jour.

    Un site de construction du manifeste avait échappé à la première recherche par grep :
    `scripts/e2e-local-model.ts` construisait aussi un littéral `ContextManifest`, trouvé par le
    typage strict et non par la relecture. La leçon vaut pour la prochaine fois qu'un champ est
    ajouté à ce type : chercher `adopted_refs:` retrouve les trois occurrences, mais seule la
    compilation les confirme toutes.

    `specs/archive/TRACEABILITY.md` sépare désormais CTX-02 de CTX-01/CTX-05 : la ligne nomme les
    quatre porteurs — déclaration, manifeste, câblage, contrôle — là où elle ne nommait que
    `context.ts`. `dist/` a été reconstruit avant Preflight ; il n'est pas suivi par git, donc rien
    à committer de ce côté.

    `active_story` reste `e23s02` : develop-tdd rend la main à verify-work, pas à plan-work — c'est
    son propre contrat de handoff, et rien ici n'a encore relu les huit scénarios Gherkin du §17 un
    par un ni conduit de vérification manuelle. Aucune tâche de cette story n'a demandé de
    `verify-script:` : les six sont sorties d'un `verify:` automatique, donc aucune manœuvre
    humaine n'est en attente. e23s03, sans spécification, reste la story suivante une fois
    verify-work — puis la suite de la chaîne — franchie sur celle-ci.
  open_decisions:
    - >
      La déduction de racine des scripts bigpowers n'est tranchée que pour la porte de cohérence,
      remplacée par un contrôle du dépôt (`D-54`). Tout autre script invoqué à son chemin de paquet
      déduit toujours sa racine de son propre emplacement, donc juge l'arborescence du paquet — ou
      `/opt/homebrew`, dépôt git de Homebrew — et non ce dépôt. `verify-tdd-red-commit.sh` rendait
      un PASS sur un commit de Homebrew ; `check-blind-spots.sh`, `completeness-critic.sh`,
      `sync-status-from-epics.sh` et `trace-stories.sh` lisaient les specs du paquet. À trancher
      pour chacun : passerelle de liens symboliques, contrôle à nous, ou abandon.
    - >
      `bp-timing.sh` écrit ses mesures dans ce fichier par un aller-retour PyYAML, qui remplace les
      scalaires de bloc par du texte entre guillemets à apostrophes doublées. La mise en forme a été
      restaurée une fois à la main ; elle se reperdra au prochain appel. À trancher : renoncer au
      chronométrage, ou déplacer les mesures hors de ce fichier.
    - >
      Quel adaptateur se tient derrière SandboxPort : les backends écrits à la main,
      @anthropic-ai/sandbox-runtime, ou une micro-VM. Pi n'implémente aucun bac à sable et le
      documente comme un choix. La première mesure se conduit sous Apple Container et non Docker —
      container system start, une image Debian, bwrap --unshare-user --unshare-net true — sur
      signal du propriétaire et jamais pendant qu'une campagne tourne, puisqu'un changement de bac
      à sable change environment_digest. L'enjeu dépasse le choix d'adaptateur : un environnement
      Linux qui laisse créer un espace de noms utilisateur rouvrirait NFR-05, seule exigence [P0]
      aujourd'hui déclarée infermable.
