handoff:
  next_skill: null
  last_step_completed: >
    La reprise des specs est faite pour la partie documentaire. Trois passes, chacune verte à
    Preflight, 85 exigences toujours tracées.

    LES CHIFFRES. Chaque valeur n'est plus écrite qu'à un seul endroit. `§8.10` de la spécification
    fonctionnelle recopiait les dix valeurs de `§12` en le disant lui-même : il ne porte plus que le
    comportement à la limite, qui ne change pas avec la valeur. `NFR-04` énonce trois garanties — un
    état local rendu sans attente perceptible, une annulation honorée, un processus contrôlé qui ne
    survit pas à sa terminaison — et ses durées sont descendues en configuration. `RM-032`, `RM-033`,
    l'étape 6 de `PF-14` et la ligne `DEC-03` de la conception de vérification ne portent plus de
    nombre. Deux occurrences subsistent et sont légitimes : `SA-015` et `SA-016` sont des exemples
    Gherkin, et un exemple a besoin d'une valeur concrète pour être exécutable.

    LA VUE DE REVUE. `UX-06`, `UX-07`, `UX-08` et `UX-11` disent ce que le relecteur établit, non la
    disposition qui le lui montre ; `§10.1`, `§10.3`, `§10.4`, `PF-12`, `RM-062`, `SA-023` et
    `SA-025` suivent. Plus aucune mention de panneau dans la spécification fonctionnelle.

    UNE AFFIRMATION FAUSSE A ÉTÉ TROUVÉE ET CORRIGÉE. `expression-besoins.md` §11.2 soutenait que la
    vue « n'est pas présentée comme une capacité déjà fournie par Pi ou par un package candidat ».
    `pi-tui` publie `HStack`, `VStack`, `Container`, `ScrollView`, `SelectList`,
    `KeybindingsManager`, `MouseRegion`, `visibleWidth`, `truncateToWidth`, `sliceByColumn`,
    `fuzzyFilter` et `stripTerminalSequences`. 495 en importe deux sur une soixantaine.

    LES RÈGLES NE CHANGENT PAS, ET C'EST LE POINT. Un invariant ne se délègue pas ; sa mise en œuvre,
    si. La correspondance est donc écrite en conception technique, §5.x : pour chacun des invariants
    déjà couverts, la surface Pi qui le tient. Relevé sur la version épinglée : 38 événements
    d'extension, 31 pages de documentation et 76 extensions d'exemple, toutes lisibles hors ligne
    dans le paquet installé. 495 pose quatre accroches.

    DEUX ENDROITS DU CODE SONT CONCERNÉS, et ce ne sont pas des hypothèses.
    `src/presentation/tui/review/measure.ts` calcule les colonnes qu'occupe une ligne stylée, ce que
    `visibleWidth` rend ; `NARROW_THRESHOLD`, mesuré sur le corpus figé de `D-33`, n'a de raison
    d'être que parce que la surface assemble ses panneaux à la main. Et `src/adapters/sandbox/` porte
    389 lignes de backends écrits à la main quand l'exemple livré par Pi couvre `sandbox-exec` et
    `bubblewrap` en 321 lignes par `@anthropic-ai/sandbox-runtime`. Rien de ce code n'a été touché :
    c'est un changement de comportement, pas de documentation.

    DEUX AFFIRMATIONS FAUSSES ONT ÉTÉ ÉCRITES PUIS RETIRÉES dans cette session, toutes deux faute
    d'avoir mesuré avant de conclure : cinq copies du budget de tentatives dont deux étaient des
    exemples légitimes, et « 4 500 lignes d'archive que rien ne lit ». La seconde a failli coûter une
    suppression. La règle qui en découle est consignée dans `AGENTS.md`.
  open_decisions:
    - >
      **Ramener sur Pi le code déjà écrit.** Trois endroits sont nommés et mesurés : la mesure de
      largeur et le seuil de bascule de la vue de revue, et les backends de bac à sable. C'est un
      changement de comportement sur du code en place, à conduire story par story sous le régime
      habituel, et non une reprise documentaire. La conception technique §5.x dit où s'accrocher
      pour chacun.
    - >
      **L'archive ne se supprime pas.** La mesure des références entrantes ne trouve aucun orphelin
      parmi les 32 fichiers de `archive/`. Trois dépendances vivantes l'interdisent : l'epic ouvert
      `e04` est adossé à `archive/chantiers/K-clarte-des-prompts-et-skills-du-harnais.md`,
      `SCOPE_LATEST.yaml` cite `archive/chantiers/README.md` comme source de son format, et
      `TRACEABILITY.md`, que Preflight lit, pointe quatre fois dans `chantiers/` et `revues/`.
      Ce qui reste à trancher est seulement si `MILESTONES.md`, `ROADMAP.md`, `PLAN.md` et
      `MODELE-LOCAL.md` gardent une valeur, question de fond et non de place occupée.
    - >
      **Le bac à sable est instruit, plus seulement ouvert.** La question hésitait entre des backends
      écrits à la main, `@anthropic-ai/sandbox-runtime` et une micro-VM. `docs/containerization.md`
      traite les quatre motifs et `examples/extensions/sandbox/` en livre un qui marche, bâti sur
      `@anthropic-ai/sandbox-runtime` avec `sandbox-exec` sur macOS et `bubblewrap` sur Linux —
      c'est-à-dire les trois options à la fois. `gondolin/` porte la variante micro-VM. Reste à
      conduire la mesure sous Apple Container, sur signal du propriétaire et jamais pendant qu'une
      campagne tourne, puisqu'un changement de bac à sable change `environment_digest`. `NFR-05`
      reste la seule exigence [P0] déclarée infermable.
    - >
      **Que deviennent les deux contrôles retirés.** Pour `controle-du-bloc-fournisseur`, la réponse
      est acquise en principe : `examples/extensions/provider-payload.ts` rapporte en dix-huit lignes
      ce que ce contrôle déduisait du code distribué du fournisseur, et l'exemple était dans le
      paquet avant que le contrôle soit écrit. `e23s06` porte la reprise. Pour `controle-de-capsule`,
      le bénéficiaire est nommé dans `D-54` et reste valable : rien ne refuse aujourd'hui une story
      dite faite sans preuve.
    - >
      La déduction de racine des scripts bigpowers n'est tranchée que pour la porte de cohérence,
      remplacée par un contrôle du dépôt (`D-54`). Tout autre script invoqué à son chemin de paquet
      déduit sa racine de son propre emplacement, donc juge l'arborescence du paquet — ou
      `/opt/homebrew` — et non ce dépôt. `check-blind-spots.sh` est à abandonner ou à réécrire : sa
      table d'états est lue par une expression qui ne correspond jamais, et quatre de ses sept
      vérifications sont mortes. `completeness-critic.sh` exige des identifiants de story dans les
      sources, ce qui enfreint les instructions globales : dérogation à chaque story, ou abandon.
    - >
      `bp-timing.sh` écrit ses mesures dans ce fichier par un aller-retour PyYAML, qui remplace les
      scalaires de bloc par du texte entre guillemets. Le défaut est confirmé à la source :
      `scripts/yaml-tools.py` du paquet lit par `yaml.safe_load` et réécrit par `yaml.safe_dump`,
      donc `bp-yaml-set.sh` détruirait ce handoff de la même façon — ce fichier s'édite à la main.
      À trancher : renoncer au chronométrage, ou déplacer les mesures hors de ce fichier.
