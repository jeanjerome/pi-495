    4. Le journal ne garde pas les bornes en vigueur.
    5. Les appels lancés dans le même lot que celui qui dépasse la borne finissent aussi en erreur.

    SUITE. La tâche 6 demande le signal du propriétaire pour la campagne sur l'abonnement, facturée
