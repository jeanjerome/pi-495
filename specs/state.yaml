  last_step_completed: >
    Le refus d'un profil incapable a un effet avant lancement (`e23s03`). La spécification de la
    story a été écrite avec le code, et les quatre tâches sont vertes. L'epic `e23` en est à
    `e23s04`, la première campagne qui consomme un quota d'abonnement.

    LE DÉFAUT ÉTAIT UNE TAUTOLOGIE. `describeCapabilities` répondait « disponible » dès que le
    couple fournisseur-modèle n'était pas vide ; ce couple est construit depuis le modèle que Pi a
    déjà résolu, donc la réponse ne pouvait être fausse que si aucun modèle n'était configuré. Les
    faits qui refuseraient — couple absent du catalogue, fournisseur non authentifié — étaient lus
    dans le worker, après lancement, et rendaient une intervention échouée. Un troisième n'était
    jamais lu : `sdk.js:138` de `pi-coding-agent` rabat un niveau de raisonnement non supporté sur
    le plus proche accepté, sans rien dire.

    CE QUE L'HÔTE RAPPORTE EST DÉSORMAIS LA SOURCE. `src/adapters/pi-worker/capabilities.ts` lit le
    catalogue, l'authentification, `getSupportedThinkingLevels`, la fenêtre de contexte et le
    plafond de sortie. Chaque valeur dit si elle est rapportée ou redite ; trois sortes — streaming,
    annulation, sessions — sont des propriétés du contrat publié pour tous, et le disent. Le
    catalogue arrive par `ctx.modelRegistry`, que `session.ts` passe au runtime.

    UNE SEULE SORTE N'EST RAPPORTÉE PAR RIEN. Ni `Model` de `pi-ai`, ni la définition de modèle que
    `models.json` accepte ne portent de champ d'appels d'outils : la déclaration dit le dialecte, pas
    ce que le serveur honore. Elle est donc observée — une requête, un outil trivial, rien du projet
    — une fois par couple et par session (`D-57`).

    MESURÉ SUR LA MACHINE, PAS DÉDUIT. Par le Pi installé, en session réelle : `omlx/qwen3.8-27b-oq8e`
    disponible, l'endpoint appelle l'outil (3,4 s pour la première observation, 0 ms ensuite), niveaux
    acceptés `off, minimal, low, medium, high` — donc `xhigh` et `max` sont refusés là où ils étaient
    rabattus, et `medium`, le défaut de `settings.json`, passe. Aucune campagne existante n'est
    refusée par le changement.

    DEUX QUESTIONS RESTENT AU PROPRIÉTAIRE, DUES AVANT `e23s04`. Le rythme de l'observation sur un
    fournisseur facturé — une requête par session, ou retenue au-delà, et alors sous quelle clé. Et
    la compaction : le worker la laisse active sans rien observer de ce qu'elle produit, donc le
    manifeste est scellé avant qu'un résumé remplace une partie du texte, et le compteur de jetons
    ignore ce que ce résumé coûte. Couper, observer, ou mesurer d'abord si le cas peut survenir dans
    le budget d'une intervention.

    TROIS DETTES CONNUES, INCHANGÉES. L'identité humaine déduite de `node:os` ne dit pas ce qui a été
    cherché chez Pi ; l'événement de reprise déclaré que rien n'émet attend l'epic qui touche ce
    contrat ; la table du bloc fournisseur reste une attente que rien ne confronte jusqu'à `e23s06`.
