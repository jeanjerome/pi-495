handoff:
  next_skill: develop-tdd
  last_step_completed: >
    e23s02 est planifiée : une spécification au gabarit des vingt sections, et six tâches portant
    chacune une commande exécutable et nées en `failing`. La forme tient — `lint:story-format` lit
    désormais deux documents au lieu d'un.

    Le propriétaire a tranché deux points que la planification a soulevés. Le manifeste de contexte
    reste un type interne : aucun schéma de contrat n'est publié pour lui, donc un lecteur extérieur
    n'a toujours rien contre quoi le valider, et la publication reste un travail candidat à part
    entière. Le contrôle, lui, lit le paquet du fournisseur que le dépôt épingle et non celui qui
    est installé sur la machine — les deux ont déjà divergé, et la tranche accepte de ne pas voir
    cette divergence-là en échange d'un contrôle qui ne s'esquive jamais. §18 de la story porte les
    deux.

    La conception retenue tient en quatre pièces : le noyau de domaine déclare ce qu'un fournisseur
    impose — texte, position, condition — ; le manifeste porte ces strates comme une liste nommée,
    toujours présente et vide quand rien n'est imposé, jamais mêlée aux instructions de confiance ;
    le noyau la renseigne depuis le fournisseur retenu ; et un contrôle relève le bloc dans le
    paquet épinglé et refuse tout écart. Les trois faits que le contrôle compare ont été relevés sur
    la version épinglée pendant la planification : le texte imposé, la condition qui le déclenche —
    le chemin d'abonnement, reconnu au préfixe du jeton — et la position, le prompt système de 495
    étant poussé en second. Une seule occurrence dans les 275 fichiers distribués, relevée en 12 ms.

    La porte de cohérence de plan-work est tranchée et remplacée. La mesure a corrigé l'hypothèse
    qui en était écrite : le script ne meurt pas sur les stories non planifiées mais sur la
    première story de la capsule, au premier tour de boucle, parce qu'il déduit sa racine de son
    propre emplacement et confie l'extraction à un module Python absent de la machine ; sous
    `set -euo pipefail` cette seule substitution en échec le fait sortir avant le premier constat.
    Les deux causes n'en font qu'une. Une passerelle de liens symboliques le ferait tourner — elle
    a été essayée et fonctionne — mais elle repose sur un cache que npm peut effacer et ne corrige
    pas le fond : le script exige une spécification pour chaque story qu'un epic déclare, alors que
    495 remplit une capsule story par story. `scripts/check-capsule.ts` le remplace, chaîné dans
    Preflight sous `lint:capsule`, et refuse ce qui est mal câblé sans refuser ce qui n'est pas
    encore câblé. Ses huit refus ont été éprouvés un par un sur des copies abîmées ; `D-54` porte la
    décision.

    Preflight est vert sur la branche : sortie 0, 305 tests sur 305, huit contrôles, zéro
    avertissement.

    Les trois finitions d'e23s01 restent dues et sont reprises telles quelles : le dédoublonnage
    de deux destinations identiques est silencieux et doit être annoncé dans les diagnostics puis
    épinglé par un test ; le test d'aliasing de `DEFAULT_EGRESS` exerce le chemin sans
    `config.json`, donc celui où `readEgress` n'est pas appelé, et prouve la garantie sur le
    mauvais chemin ; la ligne `SEC-05` de `specs/archive/TRACEABILITY.md` affirme la recette
    entière alors que seule sa première moitié est exercée, et doit le dire avec la notation
    `**partiel** :` qu'elle emploie déjà ailleurs.
  open_decisions:
    - >
      La déduction de racine des scripts bigpowers n'est tranchée que pour la porte de cohérence,
      remplacée par un contrôle du dépôt (`D-54`). Tout autre script invoqué à son chemin de paquet
      déduit toujours sa racine de son propre emplacement, donc juge l'arborescence du paquet — ou
      `/opt/homebrew`, dépôt git de Homebrew — et non ce dépôt. `verify-tdd-red-commit.sh` rendait
      un PASS sur un commit de Homebrew ; `check-blind-spots.sh`, `completeness-critic.sh`,
      `sync-status-from-epics.sh` et `trace-stories.sh` lisaient les specs du paquet. À trancher
      pour chacun : passerelle de liens symboliques, contrôle à nous, ou abandon.
    - >
      `bp-timing.sh` écrit ses mesures dans ce fichier par un aller-retour PyYAML, qui remplace les
      scalaires de bloc par du texte entre guillemets à apostrophes doublées. La mise en forme a été
      restaurée une fois à la main ; elle se reperdra au prochain appel. À trancher : renoncer au
      chronométrage, ou déplacer les mesures hors de ce fichier.
    - >
      Quel adaptateur se tient derrière SandboxPort : les backends écrits à la main,
      @anthropic-ai/sandbox-runtime, ou une micro-VM. Pi n'implémente aucun bac à sable et le
      documente comme un choix. La première mesure se conduit sous Apple Container et non Docker —
      container system start, une image Debian, bwrap --unshare-user --unshare-net true — sur
      signal du propriétaire et jamais pendant qu'une campagne tourne, puisqu'un changement de bac
      à sable change environment_digest. L'enjeu dépasse le choix d'adaptateur : un environnement
      Linux qui laisse créer un espace de noms utilisateur rouvrirait NFR-05, seule exigence [P0]
      aujourd'hui déclarée infermable.
