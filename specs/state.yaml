  last_step_completed: >
    La recette d'AGT-02 est tenue sur un parcours complet, deux fois. Les six tâches d'`e23s04`
    passent. Preflight vert.

    LE MÊME CAS DE CONTRAT ABOUTIT DES DEUX CÔTÉS. `~/.495-campagnes/e23-local` sur
    `omlx/qwen3.8-27b-oq8e` et `~/.495-campagnes/e23-distant` sur `anthropic/claude-sonnet-5`,
    chacun dans son répertoire de données, sur la même cible et la même référence
    `sha256:78a7b98e…`. Relus par `node scripts/compare-dossiers.ts --local … --distant …`, sortie
    0 : six portes `PASS` de part et d'autre, contrôle `unit` `PASS` des deux côtés, mêmes deux
    chemins modifiés, et `src/greet.js` à l'empreinte identique. L'écart est énoncé sans être
    opposé : `test/greet.test.js` fait 191 octets contre 273, et les deux spécifications ne nomment
    pas les mêmes exigences.

    CE QUE LA PAIRE A COÛTÉ. Local 248 s, 19 appels d'outils, 55 525 jetons ; distant 60 s, 16
    appels, 78 615 jetons. Le débit d'appels d'outils diffère d'un facteur trois et demi — 4,6
    contre 16,0 par minute. Sous les bornes en place (20 minutes, 100 appels), la durée tombe la
    première sur le modèle local et le nombre d'appels sur le distant : c'est le chiffre qu'`e23s05`
    a à corriger. Zéro refus du schéma et zéro réécriture du contexte de part et d'autre.

    LA STRATE IMPOSÉE EST EXERCÉE DANS SES DEUX CAS. `imposed_layers: []` — champ présent, vide —
    sur le fournisseur local ; la strate OAuth avec ses quatre champs dans les trois manifestes de
    la campagne distante, condition cette fois réellement remplie. Ce que le fournisseur a
    réellement écrit reste non observé : c'est `e23s06`.

    TROIS REFUS CONSERVÉS EN DOSSIERS COMPLETS. `e23-distant-refuse` (destination non déclarée),
    `e23-distant-sans-auth` (fournisseur non authentifié) — zéro intervention et rien de facturé
    pour les deux — et `e23-local-rapport-refuse` (sortie structurée refusée), qui garde le rapport
    brut.

    UN DÉFAUT TROUVÉ EN ROUTE, CORRIGÉ. Le repli qui lit un objet JSON nu s'ancrait sur la dernière
    accolade ouvrante ; sur un rapport imbriqué, cette accolade ouvre un objet intérieur et la
    tranche ne s'analyse en rien, de sorte qu'un modèle qui avait répondu était inscrit comme
    n'ayant pas su répondre. Rejoué sur le texte conservé : l'ancien repli ne lit rien, le nouveau
    lit l'objet et ses neuf clés.

    UNE RÉSERVE À TRANCHER. Les deux campagnes n'ont pas tourné sur la même version du harnais —
    `dist/` a été reconstruit entre elles pour porter ce correctif — et leurs empreintes
    d'environnement diffèrent, `sha256:957139c2…` contre `sha256:e7de231f…`. L'empreinte du dossier
    local est celle que le `dist/` courant recalcule sous `seatbelt` ; la différence ne touche que
    la lecture d'un rapport sans bloc clôturé, ni les portes ni les contrôles. Deux suites
    possibles, et elles appartiennent au propriétaire : reconduire la campagne distante sur le
    `dist/` courant, au prix d'une seconde dépense, ou laisser la réserve écrite au relevé et à la
    matrice. Au passage, `scripts/compare-dossiers.ts` imprime les deux empreintes sans les ranger
    ni parmi ce qui décide ni parmi ce qui est seulement énoncé.

    CE QUI EST ÉCRIT. `specs/verifications/e23-deux-fournisseurs.md` porte le relevé ; la matrice
    scinde l'ancienne ligne et donne à AGT-02 la sienne, adossée à la campagne, nommant la preuve
    conservée — `v3/capability-probe` pour la clause de l'endpoint sans format d'appels d'outils,
    que la campagne n'exerce pas — et portant la réserve.

    RESTENT DEUX STORIES À L'EPIC. `e23s05` remesure les budgets d'intervention sur un modèle
    frontière et lit le coût en argent que l'hôte rapporte et que 495 ignore. `e23s06` observe ce
    que le fournisseur écrit réellement au-dessus des instructions locales, depuis la charge utile
    que l'hôte publie.

    TROIS DETTES CONNUES, INCHANGÉES. L'identité humaine déduite de `node:os` ne dit pas ce qui a
    été cherché chez Pi ; l'événement de reprise déclaré que rien n'émet attend l'epic qui touche ce
    contrat ; la table du bloc fournisseur reste une attente que rien ne confronte jusqu'à `e23s06`.
