handoff:
  next_skill: request-review
  last_step_completed: >
    e23s02 est vérifiée et la recette est confirmée par le propriétaire, le 2026-09-21T23:01:49Z, à
    la révision fac24fe. La preuve est écrite dans `specs/verifications/e23s02-verify.yaml`, la
    mesure NFR dans `NFR-e23s02.json`, verdict GO, et la revue de sécurité ajoutée à
    `specs/security/REVIEW.md` — aucun constat à confiance ≥ 8.

    La première recette proposée a été refusée. Elle s'appuyait sur des tests et sur des sondes des
    modules bâtis ; le propriétaire a demandé une vraie exécution dans le harnais. Deux campagnes
    complètes ont donc été conduites avec l'extension chargée depuis `dist/`, le modèle local, le
    bac à sable réel, toutes deux acceptées avec les six portes au vert. Sur `omlx`, les trois
    artefacts de contexte portent le champ présent et vide. Sur `anthropic`, les trois portent la
    strate et ses quatre champs, et le texte réellement remis au modèle — relu par son empreinte
    dans le magasin d'objets — ne la contient ni en système ni en invite. Les deux dossiers sont
    gardés sous `~/.495-campagnes/e23s02-uat-omlx` et `-anthropic`.

    Une part de cette campagne est feinte et la preuve le dit : pour ne pas dépenser le quota
    d'abonnement, Pi a reçu un répertoire de configuration isolé — `PI_CODING_AGENT_DIR` — où un
    fournisseur *nommé* `anthropic` est servi par l'endpoint local. Ce que la campagne établit est
    que le harnais déclare ce que le domaine sait du fournisseur que Pi a résolu ; ce qu'Anthropic
    impose réellement reste établi à part, par `lint:provider-block` qui lit son code distribué.
    Aucune exécution unique ne tient les deux moitiés ensemble aujourd'hui.

    Un contrôle négatif accompagne la campagne : la même configuration sans la déclaration de sortie
    est refusée avant toute intervention, sous `policy_denied`. La campagne acceptée a donc franchi
    la porte d'e23s01 plutôt que de la contourner, et les deux stories se composent.

    Le relevé d'angles morts du paquet d'outils ne peut pas échouer, et c'est démontré, pas supposé.
    Sa table d'états est lue par une expression qui réclame une indentation sur une ligne dont
    l'indentation vient d'être retirée : la table est toujours vide, et quatre de ses sept
    vérifications — dont celle qui refuse une story dite faite sans preuve — lisent du vide sans le
    dire. e23s02 était exactement dans ce cas et il a rendu zéro constat. La règle qui comptait vit
    désormais dans `scripts/check-capsule.ts` : une story dite faite dans `execution-status.yaml`
    sans `specs/verifications/<story>-verify.yaml` est refusée. Elle a mordu avant que le fichier
    existe. Cela corrige au passage la preuve d'e23s01, qui enregistrait ce zéro comme un verdict
    obtenu « contre des données réelles » : il ne l'était pas.

    Le critère de complétude, lui, tourne et refuse — « zéro lien de story » — parce qu'il mesure la
    traçabilité en cherchant des identifiants de story dans les sources, ce que les instructions
    globales interdisent d'écrire. Dérogation motivée, comme pour e23s01 ; la traçabilité réelle est
    exigence → composant → preuve, et CTX-02 y a gagné sa propre ligne.

    Preflight reste vert : `npm run build && npm run check` en une seule exécution contiguë, sortie
    0, 318 tests sur 318, neuf contrôles de lint, zéro avertissement.

    L'auto-revue est écrite dans `specs/verifications/AUDIT-e23-e23s02.md`. Elle a corrigé une chose
    avant de rendre son rapport : `checkCapsule` faisait 57 lignes contre les 4 à 20 que la
    convention demande, et les quatre paramètres qui circulaient ensemble étaient un attroupement de
    données. Découpée en trois fonctions à un seul niveau d'abstraction, l'attroupement nommé
    `Capsule`, et les dix refus du contrôle rejoués un par un après coup — rien n'a bougé.

    Elle laisse un point ouvert et quatre consignés. Ouvert : `check-capsule.ts` n'a aucun test
    automatisé. Aucun des sept autres contrôles n'en a — c'est la pratique du dépôt, et elle tenait
    tant qu'un contrôle ne portait que des règles de structure. Celui-ci décide maintenant si une
    story peut se dire faite, et la question d'ouvrir la pratique d'un test par contrôle dépasse
    cette story. Consignés : un motif de secret dans le diff qui n'en est pas un — le préfixe de
    jeton cité dans la condition déclarée ; le périmètre de la branche, plus large que la story pour
    trois raisons écrites ; `context.ts` (351 lignes) et `harness.ts` (881) qui dépassaient déjà la
    borne avant que j'y ajoute six et quatre lignes ; et un cinquième parcours récursif de
    répertoire dans `scripts/`, dette nommée dont la fermeture toucherait quatre contrôles étrangers
    à cette story.

    Ronde de relecture 1 sur 5, deux relecteurs en aveugle, porte ET : **échec des deux côtés**.
    A rend 58 % avec un point bloquant, B rend 40 % avec deux. Leurs verdicts convergent sur
    l'essentiel, et les deux points bloquants sont réels, reproduits ici plutôt que crus sur parole.

    Un : quatorze des dix-huit commits de la branche portent des lignes d'attribution IA et un
    identifiant de session, ce que les instructions globales et CONVENTIONS interdisent en toutes
    lettres. Les quatre premiers en sont exempts — la règle a été tenue puis perdue en cours de
    session. B affirme dix-huit sur dix-huit ; c'est quatorze, mesuré.

    Deux : `imposedLayersFor` résout les clés héritées d'`Object.prototype`. `imposedLayersFor("toString")`
    rend `[null]`, `"__proto__"` rend `[{}]`. Conduit jusqu'au bout par B : un fournisseur nommé
    `__proto__` écrit une strate vide au dossier — le manifeste faux que cette story existe pour
    empêcher — et `toString` fait tomber la campagne sur « canonical JSON cannot represent function »
    au moment d'écrire l'artefact. `provider_id` vient de la configuration Pi du propriétaire, donc
    de l'extérieur. Le critère 6c de la story est faux pour six identifiants, et aucun test ne
    couvrait cette borne.

    Le reste se concentre sur `check-capsule.ts`, et les deux relecteurs remontent à la même racine :
    il est parti sans test. Quatre trous trouvés à la première sonde — une commande `verify:` réduite
    à un scalaire de bloc passe pour exécutable ; un fichier de preuve vide de zéro octet vaut
    vérification ; `checkVerified` rend zéro en silence quand `execution-status.yaml` manque ou que
    sa clé est renommée, exactement le défaut que son propre en-tête reproche à l'outil qu'il
    remplace ; et un commentaire YAML en fin de ligne rend une story « faite » invisible au contrôle.
    C'est le point que l'auto-revue avait laissé ouvert au relecteur : les deux ont tranché dans le
    même sens.

    Trois constats visent mon propre travail de test et de prose. L'assertion `/2|two/i` du test
    d'ambiguïté passe sur un message qui annonce **trois** blocs, parce que le chemin du dépôt
    contient un `2` — un test qui n'est pas auto-validant, vérifié ici. Le commentaire d'en-tête du
    contrôle de fournisseur cite `D-54` pour une décision que `D-54` ne porte pas : le choix de lire
    le paquet épinglé est au §18 de la story, et `D-54` ne mentionne jamais `node_modules`. Et la
    condition déclarée — le préfixe de jeton — n'est jamais relue par le contrôle, alors que la
    tâche 4 et le §1 de la story promettent de refuser quand elle diffère.

    Les quatre points ont été traités. Domaine : `imposedLayersFor` garde par `Object.hasOwn`,
    `ImposedLayer` en champs `readonly`, un test de limite sur cinq clés héritées du prototype.
    Contexte : `imposed_layers` devient requis sur `ContextInput` — plus de défaut silencieux — et
    les six sites d'appel réels ont été trouvés et corrigés, `scripts/bench-model.ts` compris, que
    ma propre auto-revue n'avait pas vu. Contrôle de fournisseur : la forme structurelle ne nomme
    plus l'identifiant `isOAuthToken`, seulement le ternaire et la position ; une recherche
    indépendante du préfixe `sk-ant-oat` referme le trou sur la condition ; l'échappement passe par
    `JSON.parse` plutôt qu'une expression maison ; la citation erronée de D-54 renvoie au §18 de la
    story. Contrôle de capsule : `linesOfSection` remplace trois scanners de section dupliqués ;
    `execution-status.yaml` absent ou sans table `development_status:` refuse au lieu de rendre
    zéro en silence ; un commentaire YAML en fin de ligne ne rend plus une story invisible ; un
    `verify: |` ne compte plus comme une commande ; la preuve d'une story faite doit nommer son
    propre `story_id`, ce qu'un fichier vide ne peut plus satisfaire ; un identifiant de tâche
    répété est refusé. Dix-sept scénarios de refus rejoués à la main après coup, plus les huit du
    contrôle de fournisseur — rien n'a régressé.

    Les dix-neuf « consider » n'ont pas tous été traités un par un avec vous : ceux qui touchaient
    du code déjà écrit cette session — nom non anglais, cast évitable, duplication locale — ont été
    corrigés en même temps que les should-fix voisins, par jugement plutôt que par question, comme
    l'auto-revue l'avait déjà fait pour l'attroupement de données. Restent délibérément non
    traités : le cinquième parcours récursif de répertoire à travers `scripts/`, qui toucherait
    quatre contrôles étrangers à cette story, et `condition: string` en prose libre, que les deux
    relecteurs ont jugé exigé par le scénario 6f plutôt que fautif.

    Réécriture d'historique confirmée par le propriétaire et conduite : les 23 commits de la
    branche (18 de la ronde précédente, 5 nouveaux) ne portent plus aucune ligne d'attribution.
    `git filter-branch` avec un filtre Python, les références de sauvegarde nettoyées ensuite.
    Preflight rejoué après coup : sortie 0, arbre identique.

    Ronde 1 close. Retour à `request-review` pour la ronde 2, sur les mêmes cinq fichiers de
    production, avec deux relecteurs neufs.
  open_decisions:
    - >
      La déduction de racine des scripts bigpowers n'est tranchée que pour la porte de cohérence,
      remplacée par un contrôle du dépôt (`D-54`). Tout autre script invoqué à son chemin de paquet
      déduit toujours sa racine de son propre emplacement, donc juge l'arborescence du paquet — ou
      `/opt/homebrew`, dépôt git de Homebrew — et non ce dépôt. `verify-tdd-red-commit.sh` rendait
      un PASS sur un commit de Homebrew ; `check-blind-spots.sh`, `completeness-critic.sh`,
      `sync-status-from-epics.sh` et `trace-stories.sh` lisaient les specs du paquet. À trancher
      pour chacun : passerelle de liens symboliques, contrôle à nous, ou abandon.

      Deux d'entre eux sont désormais instruits. `check-blind-spots.sh` ne souffre pas seulement de
      sa racine : même branché sur ce dépôt par la passerelle, sa table d'états est lue par
      `re.match(r'\s+(\S+):\s*"([^"]*)"', stripped)` sur une ligne déjà dénudée de son indentation,
      donc toujours vide, et quatre de ses sept vérifications sont mortes. Sa seule vérification qui
      comptait ici est reprise dans `check-capsule.ts`. Une passerelle ne le réparerait pas : il est
      à abandonner ou à réécrire. `completeness-critic.sh` tourne par la passerelle et refuse pour
      une raison qui ne se satisfait pas sans enfreindre les instructions globales — il exige des
      identifiants de story dans les sources. Reste à trancher ce qu'on en fait : dérogation écrite
      à chaque story, comme aujourd'hui, ou abandon.
    - >
      `bp-timing.sh` écrit ses mesures dans ce fichier par un aller-retour PyYAML, qui remplace les
      scalaires de bloc par du texte entre guillemets à apostrophes doublées. La mise en forme a été
      restaurée une fois à la main ; elle se reperdra au prochain appel. À trancher : renoncer au
      chronométrage, ou déplacer les mesures hors de ce fichier.
    - >
      Quel adaptateur se tient derrière SandboxPort : les backends écrits à la main,
      @anthropic-ai/sandbox-runtime, ou une micro-VM. Pi n'implémente aucun bac à sable et le
      documente comme un choix. La première mesure se conduit sous Apple Container et non Docker —
      container system start, une image Debian, bwrap --unshare-user --unshare-net true — sur
      signal du propriétaire et jamais pendant qu'une campagne tourne, puisqu'un changement de bac
      à sable change environment_digest. L'enjeu dépasse le choix d'adaptateur : un environnement
      Linux qui laisse créer un espace de noms utilisateur rouvrirait NFR-05, seule exigence [P0]
      aujourd'hui déclarée infermable.
