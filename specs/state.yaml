handoff:
  next_skill: plan-work
  last_step_completed: >
    La branche `strate-imposee-au-manifeste` est ouverte depuis `main` au commit 6807368, dans le
    dépôt principal et non dans un arbre de travail lié : c'est la forme qu'a prise la branche
    précédente, et un arbre séparé rappellerait une installation complète des dépendances pour
    rien.

    Preflight est vert sur `main` avant l'ouverture : sortie 0 relevée sans passer par un tube,
    305 tests sur 305, les sept contrôles de lint rendus sans un avertissement. `origin/main` est
    un ancêtre de `main` — trente et un commits d'écart, aucun dans l'autre sens — donc il n'y a
    rien à intégrer avant de partir. Aucun verrou de story n'est posé : `specs/agent-locks.yaml`
    n'existe pas dans ce dépôt.

    e23s02 n'a pas de spécification : la capsule ne porte que `e23s02-tasks.yaml` et ses quatre
    tâches, et `lint:story-format` ne lit qu'un seul document, celui d'e23s01. Le pas suivant est
    donc plan-work et non develop-tdd, qui n'aurait rien à lire. La question ouverte sur la porte
    de cohérence 4a de plan-work se pose à la sortie de ce pas-là : elle est maintenant atteinte.

    Les trois finitions d'e23s01 restent dues et sont reprises telles quelles : le dédoublonnage
    de deux destinations identiques est silencieux et doit être annoncé dans les diagnostics puis
    épinglé par un test ; le test d'aliasing de `DEFAULT_EGRESS` exerce le chemin sans
    `config.json`, donc celui où `readEgress` n'est pas appelé, et prouve la garantie sur le
    mauvais chemin ; la ligne `SEC-05` de `specs/archive/TRACEABILITY.md` affirme la recette
    entière alors que seule sa première moitié est exercée, et doit le dire avec la notation
    `**partiel** :` qu'elle emploie déjà ailleurs.
  open_decisions:
    - >
      La porte de cohérence inter-artefacts de plan-work, à son étape 4a, ne tient pas, et la
      mesure a corrigé l'hypothèse : le script ne rend pas quatre refus de gravité haute pour les
      stories non encore planifiées — il meurt avant d'en rendre aucun. Il sort en 1 sans écrire
      une ligne, ce qu'un lecteur ne distingue pas d'un blocage. Deux causes indépendantes, l'une
      et l'autre relevées : sous `set -e`, la lecture de la clé `spec:` d'un fichier de tâches qui
      n'en porte pas fait sortir le script, et l'extraction des commandes verify s'appuie sur un
      module Python absent de la machine tout en visant l'arborescence du paquet plutôt que ce
      dépôt. e23s01, jugée sur une capsule ne portant qu'elle, passe sans aucun constat. Trois
      voies : fabriquer cette capsule isolée à chaque story, écrire un contrôle à nous qui admette
      une capsule remplie story par story, ou passer la porte sciemment et écrire pourquoi. La
      question se pose à la sortie de plan-work, pas à son entrée.
    - >
      Tout script bigpowers invoqué à son chemin de paquet déduit sa racine de dépôt de son propre
      emplacement, donc juge `/opt/homebrew` — dépôt git de Homebrew — et non ce dépôt.
      `verify-tdd-red-commit.sh` rendait un PASS sur un commit de Homebrew ; `check-blind-spots.sh`,
      `completeness-critic.sh`, `sync-status-from-epics.sh` et `trace-stories.sh` lisaient les specs
      du paquet. Contournés par une passerelle de liens symboliques montée hors du dépôt. À trancher :
      garder cette passerelle comme outil de session, ou écrire nos propres contrôles.
    - >
      `bp-timing.sh` écrit ses mesures dans ce fichier par un aller-retour PyYAML, qui remplace les
      scalaires de bloc par du texte entre guillemets à apostrophes doublées. La mise en forme a été
      restaurée une fois à la main ; elle se reperdra au prochain appel. À trancher : renoncer au
      chronométrage, ou déplacer les mesures hors de ce fichier.
    - >
      Quel adaptateur se tient derrière SandboxPort : les backends écrits à la main,
      @anthropic-ai/sandbox-runtime, ou une micro-VM. Pi n'implémente aucun bac à sable et le
      documente comme un choix. La première mesure se conduit sous Apple Container et non Docker —
      container system start, une image Debian, bwrap --unshare-user --unshare-net true — sur
      signal du propriétaire et jamais pendant qu'une campagne tourne, puisqu'un changement de bac
      à sable change environment_digest. L'enjeu dépasse le choix d'adaptateur : un environnement
      Linux qui laisse créer un espace de noms utilisateur rouvrirait NFR-05, seule exigence [P0]
      aujourd'hui déclarée infermable.
