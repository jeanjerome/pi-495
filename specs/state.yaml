  next_skill: verify-work
  last_step_completed: >
    `e25` EST ENGAGÉ sur décision du propriétaire du 2026-09-23 ; sa capsule est découpée en quatre
    stories (14 points). `e25s01` a ses quatre tâches passantes sur la branche
    `le-modele-choisi-est-admis`, avec Preflight vert et 382 tests. La politique ne porte plus de liste
    de destinations. Une clé `policy.egress` restée dans `config.json` est ignorée et annoncée à
    l'ouverture, et le README démarre en deux étapes. Le cycle rouge-vert et la revue de sécurité sont
    dans `specs/verifications/e25s01-cycle-rouge-vert.md`. Le suivant est `verify-work` sur elle ;
    la branche n'est pas fusionnée.
    « Le modèle choisi dans Pi » désigne le modèle sélectionné au démarrage de l'intervention :
    AGT-07 l'exige, et le premier usage passe par `/model` avant `/495 start` (motif écrit dans la
    capsule, clé `sens_du_modele_choisi`). Le propriétaire a tranché le même jour que `config.json`
    ne porte plus aucune configuration de modèle : `policy.egress` est retirée, pas rendue
    facultative, et D-53 devient sans objet. `main` est poussé sur `origin/main` jusqu'à `e0dc925`, qui porte le README réécrit, Pi
    épinglé en 0.87.1 et le package en 0.2.0. La 0.1.0 est publiée sur npm et étiquetée `v0.1.0` ;
    la 0.2.0 n'est ni publiée ni étiquetée, et sa publication revient au propriétaire (2FA).

    `e23s06` a clos `e23` avec ses huit tâches passantes et Preflight vert sur Node 24.21, avec 393
    tests. Le relevé est `specs/verifications/e23s06-strate-observee.md`, la décision `D-60`, et la
    ligne CTX-02 de la matrice porte les preuves. La branche `controle-du-bloc-fournisseur` est
    supprimée ; le contrôle qu'elle portait reste dans l'historique, au commit `3b1c260`.

    CE QUI EST ÉTABLI. Le worker observe chaque requête par `before_provider_request`, sans la
    modifier. Il sépare ce que le fournisseur a écrit autour de l'invite de l'hôte de ce que l'hôte
    a ajouté aux instructions de 495. La fin de chaque intervention porte, au journal, chaque
    observation qui diffère de la précédente et sa comparaison avec le manifeste. Trois campagnes
    réelles sont gardées, sur la même cible et le même `dist/` (`sha256:ede62b19…`).
    `e23s06-distant` : sur le vrai chemin d'abonnement, le bloc d'Anthropic est observé et concorde
    à chaque intervention, pour 0,0828 $. `e23s06-local` : rien d'imposé, et la concordance.
    `e23s06-negatif` : un fournisseur déclaré, joint sans ce chemin, donne l'écart nommé avec sa
    condition, et le changement va tout de même à son verdict.

    UN FAIT TROUVÉ, À TRANCHER PAR LE PROPRIÉTAIRE. Pi termine l'invite de 495 par une section
    `<cwd>`, qui porte le chemin absolu de l'espace de travail, et il l'envoie au fournisseur à
    chaque requête. Le dossier le dit désormais. Rien ne l'empêche : dire si ce chemin doit quitter
    la machine est une décision sur les données qui sortent.

    CE QUI RESTE OUVERT, CONSTATÉ SANS ÊTRE CORRIGÉ.
    1. La borne de durée n'a d'effet décidé que pour le producteur (`D-19`).
    2. Le débit du modèle local varie de part et d'autre de la bascule, et `D-59` ne décrit que 4,6.
    3. Une relance sans origine humaine établie est encore inscrite au nom du noyau.
    4. Le journal ne garde pas les bornes en vigueur.
    5. Les appels lancés dans le même lot que celui qui dépasse la borne finissent aussi en erreur.
