  last_step_completed: >
    `e23s05` est planifiée : la fiche est écrite au format de story, et le journal de tâches en
    compte sept, toutes rouges, chacune avec une commande qui échoue aujourd'hui. Preflight était
    vert avant le plan (338 tests) ; après, le format de story et la traçabilité le restent.

    LA PRÉMISSE DE LA STORY EST TOMBÉE. L'epic disait qu'avec un modèle frontière, la borne cessait
    d'être le temps pour devenir la fenêtre d'abonnement. Pi dit le contraire (`providers.md:36`) :
    l'usage par un harnais tiers est facturé au jeton, sur l'usage supplémentaire, hors des
    plafonds du plan. La capsule est corrigée ; `D-46` le sera par la décision que la tâche 4
    consigne.

    UN DÉFAUT SONDÉ. Avec un producteur scripté, le noyau et l'application étant réels : la borne
    de durée suspend l'intervention (`truncated`, reprise sur l'espace de travail) ; la borne
    d'appels l'annule (`cancelled`), et le changement est bloqué comme `execution_error`, avec pour
    détail « producer intervention cancelled ». Lu dans le code sans être sondé : la spécification
    lève une erreur de configuration réessayable, la préparation continue sur un résultat partiel,
    et la revue est inscrite invalide. Le motif `budget_exhausted` est déclaré dans
    `contracts/v1/common.ts` et rien ne l'émet. Sur le modèle distant, c'est la borne d'appels qui
    tombe la première. Non sondé sur le worker réel : son propre contrôle
    (`worker-main.ts:137`) lève une erreur dans l'outil pendant que le superviseur interrompt la
    session ; la campagne de la tâche 5 dira lequel des deux l'emporte.

    UNE DÉCISION DU PROPRIÉTAIRE, 2026-09-23. Quand le nombre d'appels est atteint, le changement
    s'arrête et attend sa relance, sous `budget_exhausted`, et rien n'est dépensé au-delà sans son
    geste. L'autre option, que la reprise se fasse d'elle-même comme pour la durée, est écartée.
    La durée garde son effet (`D-19`).

    CE QUE L'HÔTE REPORTE DU COÛT. `getSessionStats()` totalise l'usage et le coût sur toutes les
    entrées de la session, résumés et rafraîchissements du cache compris.
    `modelRuntime.isUsingSubscription()` dit si le fournisseur est employé par abonnement. Le coût
    est calculé au tarif du catalogue (`calculateCost`, pi-ai `models.js`), et un tarif absent vaut
    zéro (`models.md`). Le modèle local déclare 0 partout ; son coût sera inscrit inconnu, jamais
    nul (`NFR-06`, `AGT-07`).

    HORS DE LA STORY, ET ÉCRIT COMME TEL. Aucune borne en argent. Les valeurs par défaut ne
    changent pas. La préparation relancée refait son intervention, parce qu'elle ne garde pas son
    espace de travail.

    RESTE À L'EPIC, après `e23s05` : `e23s06`, qui observe ce que le fournisseur écrit au-dessus des
    instructions locales.

    DÉJÀ TRANCHÉ, À NE PAS ROUVRIR SANS UN FAIT NOUVEAU. Les deux campagnes d'`e23s04` n'ont pas
    tourné sur le même `dist/`. La campagne distante n'est pas reconduite, et la réserve reste
    écrite au relevé, à la matrice et au §19 de la story.

    TROIS DETTES CONNUES, INCHANGÉES. L'identité humaine déduite de `node:os` ne dit pas ce qui a
    été cherché chez Pi. L'événement de reprise déclaré n'est émis par rien, et attend l'epic qui
    touche ce contrat. La table du bloc fournisseur reste une attente que rien ne confronte jusqu'à
    `e23s06`.
