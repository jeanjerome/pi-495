handoff:
  next_skill: kickoff-branch
  last_step_completed: >
    La branche `sortie-vers-le-fournisseur-declaree` est entrée dans `main` en avance rapide : les
    28 commits sont gardés un par un, aucun commit de fusion n'est créé, et l'historique reste
    linéaire comme il l'a toujours été. La branche locale est supprimée — le travail n'est plus
    atteignable que depuis `main`. Rien n'est poussé : `main` porte trente commits d'avance sur
    `origin/main`, ce que le propriétaire a tranché en connaissance de cause.

    Les contrôles ont été conduits sur l'arbre exact qui est devenu `main`, ce qui rend la fusion
    verte par construction. Preflight sort en 0 : typage, 305 tests, sept contrôles de lint, zéro
    avertissement. Les 28 commits tiennent le format `<type>: <description>` et ne portent aucune
    attribution IA. La couverture de lignes vaut 82,00 % pour l'ensemble, et sur les trois fichiers
    de production touchés 96,2 % (`intervention.ts`), 96,8 % (`config.ts`) et 83,5 % (`policy.ts`)
    — où les lignes rendues non couvertes sont le littéral de `DEFAULT_POLICY`, pas de la logique.
    La revue de sécurité est du jour et au périmètre de cette branche, sans constat à confiance
    ≥ 8. Zéro angle mort, arbre propre, et aucun secret dans le diff hors le jeton sentinelle que
    le test plante lui-même.

    Une mesure à garder pour la prochaine fois qu'une couverture se lit : lancer la suite sous
    `--experimental-test-coverage` fait tomber un test, et un seul — celui qui épingle
    l'environnement du worker au caractère près, parce que Node ajoute `NODE_V8_COVERAGE` à
    l'environnement du processus fils. C'est l'instrument qui perturbe la mesure ; sans lui les 305
    passent.

    Les trois finitions d'`e23s01` sont reportées sciemment et restent à faire avant que la story
    puisse se dire sans reste. Un, le dédoublonnage de deux destinations identiques est silencieux :
    la fusion se justifie, mais elle doit être annoncée dans les diagnostics et épinglée par un
    test. Deux, le test d'aliasing de `DEFAULT_EGRESS` exerce le chemin sans `config.json`, donc
    celui où `readEgress` n'est pas appelé : il prouve la garantie sur le mauvais chemin. Trois, la
    ligne `SEC-05` de `specs/archive/TRACEABILITY.md` affirme la recette entière alors que seule sa
    première moitié est exercée — la sentinelle est plantée dans l'environnement du contrôleur,
    jamais dans une sortie d'outil, ce que le §18 de la story met hors périmètre ; la ligne doit le
    dire avec la notation `**partiel** :` qu'elle emploie déjà six fois ailleurs.

    `active_story` passe à `e23s02` parce que l'epic contraint l'ordre, non parce que ces finitions
    sont abandonnées : elles se replanifient avant la prochaine tranche ou avec elle.

    Le chronométrage de cette invocation n'est pas écrit : `bp-timing.sh` reformaterait ce fichier
    entier, et la décision ouverte à ce sujet n'est pas tranchée.
  open_decisions:
    - >
      La porte de cohérence inter-artefacts de plan-work, à son étape 4a, ne tient pas, et la
      mesure a corrigé l'hypothèse : le script ne rend pas quatre refus de gravité haute pour les
      stories non encore planifiées — il meurt avant d'en rendre aucun. Il sort en 1 sans écrire
      une ligne, ce qu'un lecteur ne distingue pas d'un blocage. Deux causes indépendantes, l'une
      et l'autre relevées : sous `set -e`, la lecture de la clé `spec:` d'un fichier de tâches qui
      n'en porte pas fait sortir le script, et l'extraction des commandes verify s'appuie sur un
      module Python absent de la machine tout en visant l'arborescence du paquet plutôt que ce
      dépôt. e23s01, jugée sur une capsule ne portant qu'elle, passe sans aucun constat. Trois
      voies : fabriquer cette capsule isolée à chaque story, écrire un contrôle à nous qui admette
      une capsule remplie story par story, ou passer la porte sciemment et écrire pourquoi. La
      question se pose à la sortie de plan-work, pas à son entrée.
    - >
      Tout script bigpowers invoqué à son chemin de paquet déduit sa racine de dépôt de son propre
      emplacement, donc juge `/opt/homebrew` — dépôt git de Homebrew — et non ce dépôt.
      `verify-tdd-red-commit.sh` rendait un PASS sur un commit de Homebrew ; `check-blind-spots.sh`,
      `completeness-critic.sh`, `sync-status-from-epics.sh` et `trace-stories.sh` lisaient les specs
      du paquet. Contournés par une passerelle de liens symboliques montée hors du dépôt. À trancher :
      garder cette passerelle comme outil de session, ou écrire nos propres contrôles.
    - >
      `bp-timing.sh` écrit ses mesures dans ce fichier par un aller-retour PyYAML, qui remplace les
      scalaires de bloc par du texte entre guillemets à apostrophes doublées. La mise en forme a été
      restaurée une fois à la main ; elle se reperdra au prochain appel. À trancher : renoncer au
      chronométrage, ou déplacer les mesures hors de ce fichier.
    - >
      Quel adaptateur se tient derrière SandboxPort : les backends écrits à la main,
      @anthropic-ai/sandbox-runtime, ou une micro-VM. Pi n'implémente aucun bac à sable et le
      documente comme un choix. La première mesure se conduit sous Apple Container et non Docker —
      container system start, une image Debian, bwrap --unshare-user --unshare-net true — sur
      signal du propriétaire et jamais pendant qu'une campagne tourne, puisqu'un changement de bac
      à sable change environment_digest. L'enjeu dépasse le choix d'adaptateur : un environnement
      Linux qui laisse créer un espace de noms utilisateur rouvrirait NFR-05, seule exigence [P0]
      aujourd'hui déclarée infermable.
