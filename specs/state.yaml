  last_step_completed: >
    `e23s06` EST SPÉCIFIÉE, sur la branche `strate-imposee-observee`, ouverte depuis
    `borne-d-appels-et-cout`. Aucune des deux n'est fusionnée ni poussée. La story est
    `e23s06-le-dossier-enregistre-la-strate-imposee-telle-que-le-fournisseur-l-a-ecrite.md` et ses
    huit tâches sont en `failing`. Preflight est vert sur Node 24.21, avec 365 tests.

    CE QUE LA LECTURE DE PI 0.87.0 A TRANCHÉ AVANT D'ÉCRIRE. Seule `before_provider_request` porte
    le bloc d'abonnement. `buildParams` l'ajoute à la sérialisation, après `context_with_system`.
    Un gestionnaire qui ne renvoie rien laisse la charge inchangée, et un gestionnaire en erreur est
    écarté sans bloquer la requête (`ExtensionRunner.emitBeforeProviderRequest`). Le worker peut
    charger un observateur en ligne, par `DefaultResourceLoader` et `extensionFactories`, qui
    restent chargées sous `noExtensions`. `session-cost.test.ts` a déjà le banc voulu : un point
    d'accès de substitution, y compris sur le chemin d'abonnement, sans rien dépenser.

    CE QUI RESTE OUVERT D'`e23s05`, CONSTATÉ SANS ÊTRE CORRIGÉ.
    1. La borne de durée n'a d'effet décidé que pour le producteur (`D-19`). La spécification coupée
       bloque le changement comme une erreur de configuration. La préparation coupée voit sa suite
       partielle jugée, puis une seconde préparation démarre. La revue coupée laisse G5
       indéterminée, et une nouvelle tentative d'implémentation démarre sans le propriétaire.
    2. Sur un même cas, le modèle local a tourné à 4,6, 2,5 puis 6,1 appels par minute. Le
       commentaire de `policy.ts` et `D-59` décrivent la seule mesure à 4,6.
    3. Une relance sans origine humaine établie (mode `-p`, ou RPC sans
       `HARNESS495_RPC_HUMAN_ACTOR`) est encore inscrite au nom du noyau.
    4. Le journal ne garde pas les bornes en vigueur ; la relecture lit `config.json` tel qu'il est.
    5. Les appels lancés dans le même lot que celui qui dépasse la borne finissent aussi en erreur.

    SUITE. `develop-tdd` sur les tâches 1 à 4 d'`e23s06`, puis la décision `D-60`. La campagne de la
    tâche 6 demande le signal du propriétaire : elle consomme de l'usage facturé.
