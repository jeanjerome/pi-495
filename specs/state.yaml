    `e23s06` EST À SA RECETTE, sur la branche `strate-imposee-observee`, ouverte depuis
    `borne-d-appels-et-cout`. Aucune des deux n'est fusionnée ni poussée. Les tâches 1 à 5 passent.
    Les tâches 6 à 8 attendent la campagne facturée. Preflight est vert sur Node 24.21, avec 393
    tests.

    CE QUI EST ÉTABLI. Le worker charge une seule extension, un observateur de
    `before_provider_request`, hébergé par le chargeur de Pi avec toute découverte coupée. Un point
    d'accès de substitution reçoit le même corps avec et sans lui. L'observateur demande à Pi l'invite
    qu'il a composée (`ctx.getSystemPrompt()`) et la repère dans la charge utile. Ce qui l'entoure
    est la part du fournisseur. Ce qu'elle contient en plus des instructions de 495 est la part de
    l'hôte. La fin de chaque intervention porte, au journal, chaque observation qui diffère de la
    précédente et sa comparaison avec le manifeste. `D-60` consigne la décision.

    UN FAIT TROUVÉ À LA PREMIÈRE EXÉCUTION. Pi termine l'invite de 495 par une section `<cwd>` qui
    porte le chemin absolu de l'espace de travail, et il l'envoie au fournisseur à chaque requête.
    Rien ne le disait avant. La story le rend visible au dossier et ne change pas ce que le modèle
    reçoit : dire si ce chemin doit quitter la machine est une décision du propriétaire.

    DEUX CAMPAGNES GRATUITES CONDUITES, sur `~/.495-campagnes/e23s04-cible`, avec l'extension
    chargée depuis `dist/`. `e23s06-local` (`chg_mue0bl838bf2881f97`, `omlx`) est acceptée, G0 à G5
    `PASS`. Ses trois interventions portent chacune une seule observation, sans rien au-dessus ni
    au-dessous, avec la section `<cwd>` comme ajout de l'hôte et la concordance. `e23s06-negatif`
    (`chg_mue0g30t123dbc39c5`) est le contrôle négatif : un fournisseur nommé `anthropic` servi par
    le modèle local, via `PI_CODING_AGENT_DIR=~/.495-campagnes/e23s02-rev2-piconf`. Il est accepté
    aussi, et ses trois interventions portent l'écart « attendu et non observé » avec la condition
    déclarée à côté. Aucun jeton dans les deux dossiers : les six `sk-ant-oat` sont le préfixe de la
    condition. Le script de lancement et la relecture sont dans le bloc-notes de la session, pas dans
    le dépôt.

    CE QUI RESTE OUVERT D'`e23s05`, CONSTATÉ SANS ÊTRE CORRIGÉ.
    1. La borne de durée n'a d'effet décidé que pour le producteur (`D-19`).
