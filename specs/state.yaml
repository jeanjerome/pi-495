  last_step_completed: >
    La story `e23s04` est spécifiée et sa première tâche est verte. Les deux questions qui la
    précédaient sont tranchées par `D-58` ; aucune n'appelait un arbitrage du propriétaire.

    LE RYTHME DE L'OBSERVATION RESTE LA SESSION. Retenir le résultat au-delà demanderait une clé et
    une péremption, donc de décider ce qui rend une qualification caduque. Le but ne l'a jamais
    demandé : l'observation existe pour éviter qu'une intervention entière se paie une incapacité, et
    elle y suffit dès qu'elle précède la première intervention de la session. Elle coûte environ
    soixante jetons présentés et deux cent cinquante-six au plus rendus.

    LA RÉÉCRITURE DU CONTEXTE EST LUE, PAS COUPÉE. L'hôte publie `compaction_start` et
    `compaction_end`, et le résultat porte les jetons remplacés, ce qui reste et l'usage de la requête
    qui a écrit le résumé. `src/adapters/pi-worker/session-observer.ts` les lit, ajoute cet usage aux
    jetons connus et inscrit `context_compacted` au dossier — motif, jetons remplacés, jetons
    restants, coût du résumé, ou la raison pour laquelle la réécriture n'a pas eu lieu. Prouvé contre
    une vraie session de l'hôte dans `test/v3/session-observation.test.ts`. Couper aurait rendu le
    harnais moins capable ; mesurer d'abord est ce que l'observation fait.

    LE CAS EST ATTEIGNABLE, PAS COURANT. Seuil de l'hôte `contexte > fenêtre − réserve`, réserve de
    16 384 par défaut ; sur le modèle local, fenêtre de 131 072, donc réécriture au-delà de 114 688.
    La plus longue intervention au journal porte 107 095 jetons connus.

    LA CAMPAGNE N'A JAMAIS EU LIEU. Les campagnes que le dossier appelle `anthropic` employaient
    `~/.495-campagnes/e23s02-rev2-piconf/models.json`, qui déclare un fournisseur nommé `anthropic` à
    l'adresse `http://127.0.0.1:8000/v1` — l'endpoint local sous un autre nom, ce qui était le bon
    montage pour éprouver une table indexée sur l'identifiant du fournisseur. `~/.pi/agent/auth.json`
    est vide : aucune requête n'a jamais quitté cette machine.

    DEUX GESTES DU PROPRIÉTAIRE OUVRENT LA TÂCHE 2. Authentifier Pi auprès du fournisseur
    d'abonnement, qui est interactif ; et déclarer la destination `off_machine` dans la configuration
    de la campagne distante, là où les campagnes antérieures portaient `on_machine` sans mentir. À
    savoir avant de dépenser : l'usage d'un abonnement Claude Pro/Max par un harnais tiers est compté
    au jeton sur l'usage supplémentaire du compte, et non prélevé sur les plafonds du plan.

    RESTENT QUATRE TÂCHES. Les deux campagnes, la comparaison des dossiers — `scripts/compare-dossiers.ts`
    n'est pas écrit et sa commande est déclarée rouge —, la matrice portée sur la campagne, et le
    relevé déposé en preuve.

    UN MANQUE NOMMÉ, HORS PÉRIMÈTRE. L'hôte rapporte le coût en argent de chaque réponse, détaillé
    par entrée, sortie et cache ; 495 n'en lit rien et ne compte que les jetons. C'est le sujet de
    `e23s05`, qui remesure les budgets sur un modèle frontière.

    TROIS DETTES CONNUES, INCHANGÉES. L'identité humaine déduite de `node:os` ne dit pas ce qui a été
    cherché chez Pi ; l'événement de reprise déclaré que rien n'émet attend l'epic qui touche ce
    contrat ; la table du bloc fournisseur reste une attente que rien ne confronte jusqu'à `e23s06`.
