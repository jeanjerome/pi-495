handoff:
  next_skill: release-branch
  last_step_completed: >
    e23s01 est livrée : la sortie de données vers le fournisseur est déclarée, et une destination
    non déclarée est refusée avant qu'un processus démarre. Le code utile tient en trois fichiers.
    `ActivePolicy` porte `egress`, une liste de destinations `{ provider_id, location }` ;
    `undeclaredEgressReason` dit dans le domaine pourquoi une destination n'est pas déclarée, aux
    côtés de `evaluateG2` et `evaluateG5` ; `refuseUndeclaredDestination` lève le refus dans le
    superviseur, à l'ouverture de l'intervention puis à l'entrée de `run()`. Aucun composant, aucun
    code d'erreur, aucun identifiant nouveaux : `POLICY_DENIED` et `policy_denied` existaient.

    Le noyau ne déclare rien de lui-même — il ne connaît aucune machine — et `extension/config.ts`
    porte le défaut `omlx` sur la machine. `readEgress` valide la déclaration lue de `config.json`
    et applique la règle de `D-53` : une déclaration dont une partie est illisible ne déclare rien
    du tout, parce que revenir au défaut réadmettrait une destination que le propriétaire vient
    peut-être de retirer. Un fichier qui s'analyse sans être un objet est traité comme illisible ;
    un `provider_id` surdimensionné est refusé et nommé par sa longueur, jamais recopié. Un
    `location` invalide refuse aussi tout : le propriétaire l'a tranché ainsi, et `D-53` porte le
    motif — le refus juge si le fichier peut être cru, pas ce que le champ autorise.

    Quatre rondes de relecture croisée en double aveugle. Elles n'ont jamais trouvé de défaut
    laissant passer une destination non déclarée ; presque tous les constats visaient ce qui était
    écrit autour du code. Trois enseignements valent d'être gardés. D'abord le test par mutation :
    trois comportements que des commits existaient pour introduire — le refus reprenable, les
    actions suivantes, le fichier illisible — n'étaient tenus par aucun test, et seule la mutation
    l'a montré. Ensuite la véracité documentaire : un recensement a trouvé treize affirmations
    fausses réparties sur quatre fichiers, la story se contredisant elle-même entre son §6a et son
    §12 ; dix-huit artefacts affirment des faits sur ce code, et corriger l'un en périme d'autres.
    Enfin le piège du remède : rendre le refus reprenable promettait une reprise qui ne pouvait pas
    marcher, la déclaration n'étant lue qu'au démarrage du runtime — le message le dit désormais.

    Preflight vert à la clôture, 300 tests, sept contrôles de lint, zéro avertissement biome,
    arbre propre, 28 commits sur `sortie-vers-le-fournisseur-declaree`. La branche n'est pas
    fusionnée : `release-branch` ouvrira la PR.

    Reste à faire sur cette story, mis de côté sciemment et non oublié — deux finitions d'une
    demi-heure. Un, le dédoublonnage de deux entrées identiques est silencieux : la fusion est
    justifiée, puisqu'une déclaration qui dit deux fois la même chose se comprend, mais elle doit
    être annoncée et épinglée par un test. Deux, le test d'aliasing de `DEFAULT_EGRESS` exerce le
    chemin sans `config.json`, donc celui où `readEgress` n'est pas appelé : il prouve la garantie
    sur le mauvais chemin. Et une ligne de traçabilité : la recette de SEC-05 demande une sentinelle
    injectée dans l'environnement du contrôleur **puis dans une sortie d'outil** ; la seconde moitié
    n'est pas couverte, le §18 la met hors périmètre, et la matrice doit le dire avec la notation
    `**partiel** :` qu'elle emploie déjà six fois ailleurs.

    Les deux questions de la story ne sont pas en attente d'un arbitrage : elles sont
    inrépondables tant que `e23s04` n'a pas configuré l'abonnement et déclaré une destination hors
    machine. Elles restent au §19.
  open_decisions:
    - >
      La porte de cohérence inter-artefacts de plan-work, à son étape 4a, ne tient pas, et la
      mesure a corrigé l'hypothèse : le script ne rend pas quatre refus de gravité haute pour les
      stories non encore planifiées — il meurt avant d'en rendre aucun. Il sort en 1 sans écrire
      une ligne, ce qu'un lecteur ne distingue pas d'un blocage. Deux causes indépendantes, l'une
      et l'autre relevées : sous `set -e`, la lecture de la clé `spec:` d'un fichier de tâches qui
      n'en porte pas fait sortir le script, et l'extraction des commandes verify s'appuie sur un
      module Python absent de la machine tout en visant l'arborescence du paquet plutôt que ce
      dépôt. e23s01, jugée sur une capsule ne portant qu'elle, passe sans aucun constat. Trois
      voies : fabriquer cette capsule isolée à chaque story, écrire un contrôle à nous qui admette
      une capsule remplie story par story, ou passer la porte sciemment et écrire pourquoi. La
      question se pose à la sortie de plan-work, pas à son entrée.
    - >
      Tout script bigpowers invoqué à son chemin de paquet déduit sa racine de dépôt de son propre
      emplacement, donc juge `/opt/homebrew` — dépôt git de Homebrew — et non ce dépôt.
      `verify-tdd-red-commit.sh` rendait un PASS sur un commit de Homebrew ; `check-blind-spots.sh`,
      `completeness-critic.sh`, `sync-status-from-epics.sh` et `trace-stories.sh` lisaient les specs
      du paquet. Contournés par une passerelle de liens symboliques montée hors du dépôt. À trancher :
      garder cette passerelle comme outil de session, ou écrire nos propres contrôles.
    - >
      `bp-timing.sh` écrit ses mesures dans ce fichier par un aller-retour PyYAML, qui remplace les
      scalaires de bloc par du texte entre guillemets à apostrophes doublées. La mise en forme a été
      restaurée une fois à la main ; elle se reperdra au prochain appel. À trancher : renoncer au
      chronométrage, ou déplacer les mesures hors de ce fichier.
    - >
      Quel adaptateur se tient derrière SandboxPort : les backends écrits à la main,
      @anthropic-ai/sandbox-runtime, ou une micro-VM. Pi n'implémente aucun bac à sable et le
      documente comme un choix. La première mesure se conduit sous Apple Container et non Docker —
      container system start, une image Debian, bwrap --unshare-user --unshare-net true — sur
      signal du propriétaire et jamais pendant qu'une campagne tourne, puisqu'un changement de bac
      à sable change environment_digest. L'enjeu dépasse le choix d'adaptateur : un environnement
      Linux qui laisse créer un espace de noms utilisateur rouvrirait NFR-05, seule exigence [P0]
      aujourd'hui déclarée infermable.
