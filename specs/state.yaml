  last_step_completed: >
    La revue dessine ses modifications avec un paquet de l'écosystème au lieu de les réécrire, et la
    capsule de `e24` enregistre ce travail. Trois commits, Preflight vert à chacun : `85b8d9d`,
    `6c34012`, `03cf4c3`.

    CE QUI A ÉTÉ LEVÉ. La forme en blocs ANCIEN/NOUVEAU venait de `conception-technique.md` §5.5,
    pas d'une exigence — `UX-07` ne prescrit aucune forme et délègue « la forme de la comparaison »
    au TUI, ce que le relevé des spécifications avait déjà noté. `D-56` porte la décision.

    CE QUI A ÉTÉ PAYÉ. `@xynogen/pix-pretty` publie ses sources TypeScript et aucun build : elles ne
    compilent pas sous les réglages du dépôt, et Node refuse de typer-effacer un fichier sous
    `node_modules`. D'où des déclarations écrites à la main sous `types/pix-pretty/`, un chargeur
    réclamé par le paquet lui-même, et les deux premières dépendances d'exécution du harnais. La vue
    des modifications prend tout l'écran, le moteur ne prenant aucune largeur de son appelant.

    TROIS DÉFAUTS TROUVÉS APRÈS COUP, ET CE QUI LES A TROUVÉS. Le chargement différé échouait sous
    Pi : ma sonde passait grâce à `--import jiti/register`, un crochet global que Pi ne pose pas, et
    le lanceur de tests portait le même drapeau — 316 tests verts pour une raison que la production
    n'avait pas. C'est le banc de `bench/`, qui ouvre `dist/` dans une vraie session Pi, qui l'a
    montré en trente secondes. Puis le repli du contexte ne s'annonçait plus, contre `UX-07`. Puis,
    en le réparant, que le moteur recomparait les deux côtés du hunk et dessinait une ligne
    inchangée comme supprimée puis rajoutée : les lignes lui sont désormais construites depuis les
    segments du calcul maison.

    CE QUI REFUSE MAINTENANT. `lint:declarations` compile les appels de la revue contre le paquet
    installé, sans le renvoi de `paths` : la comparaison est celle du compilateur, pas d'une
    expression régulière sur du code tiers. Éprouvé par contrôle négatif réel, comme la
    neutralisation des séquences terminal d'un fichier relu.

    LA CAPSULE DE `e24` est écrite après coup et le dit, story par story : l'état passant de ses
    tâches est constaté, pas atteint par le cycle rouge-puis-vert de `D-52`. Deux tâches font
    exception et ont eu leur rouge, toutes deux par contrôle négatif.
  open_decisions:
    - >
      **La vue de revue s'assemble sur `pi-tui`, et le travail se conduit dans une session à lui.**
      La direction est arrêtée par le propriétaire ; ce qui reste est l'exécution. `pi-tui` publie
      `HStack`, `VStack`, `Container`, `ScrollView`, `SelectList`, `KeybindingsManager`,
      `MouseRegion`, `visibleWidth`, `truncateToWidth`, `sliceByColumn`, `wrapTextWithAnsi` et
      `fuzzyFilter` ; 495 porte 873 lignes sous `src/presentation/tui/` qui refont la disposition
      (`review-surface.ts`), le clavier et le focus (`keymap.ts`), l'arbre virtualisé et filtré
      (`tree-pane.ts`), le lecteur (`reader-pane.ts`) et la mesure de largeur (`measure.ts`).

      L'OBSTACLE DE STRUCTURE EST LEVÉ, et c'est lui qui expliquait pourquoi ce code avait été écrit
      à la main : `check-layers.ts` interdisait `@earendil-works` à la couche `presentation`, où
      vivent ces 873 lignes. D'où la même absurdité écrite deux fois dans le dépôt —
      `src/extension/review-command.ts` importait `truncateToWidth` parce qu'il en avait le droit,
      et `src/presentation/tui/review/measure.ts` recalculait les colonnes d'une ligne stylée parce
      qu'il ne l'avait pas. La justification invoquait `UX-11` — qu'aucune vue ne fasse dépendre la
      donnée de revue d'un composant — mais cette donnée vit dans `application/review.ts` et
      `presentation/structured/`, que la règle n'atteignait pas : elle gardait la donnée en
      interdisant la vue, qui est ailleurs. L'interdiction reste sur le noyau des exigences et
      décisions — `domain/`, `contracts/`, `ports/`, `application/`, `export/` — parce que `NFR-07`
      [P0] la nomme et qu'elle y garde son sens : le noyau se teste sans réseau ni modèle réel.

      CE QUI NE BOUGE PAS. Les 481 lignes du modèle de comparaison — `src/application/review.ts` et
      `src/presentation/structured/review-text.ts` — restent à 495 et restent indépendantes du
      rendu : c'est ce qui fait tenir `UX-11`, la même comparaison hors du TUI. Les invariants
      `RM-057` à `RM-066` et les exigences `UX-06` à `UX-11` ne changent pas non plus ; ils viennent
      d'être réécrits pour dire l'acquis, et c'est précisément ce qui rend le rendu remplaçable
      sans rien perdre.

      UN EFFET DE BORD À NOMMER. `D-33` a figé `NARROW_THRESHOLD`, `CONTENT_PAGE_LINES` et
      `FILE_READ_BUDGET_BYTES` sur un corpus mesuré, et pose que re-mesurer est une révision de
      décision. Un conteneur qui gère lui-même la largeur peut rendre le premier sans objet : si
      c'est le cas, `D-33` se révise explicitement plutôt que de laisser une constante orpheline.

      Mise à jour du 2026-09-22 : la mesure et le décodage clavier passent déjà par `pi-tui`
      (`measure.ts`, `keymap.ts`), et le dessin de la comparaison est sorti du dépôt vers
      `@xynogen/pix-pretty` (`D-56`). La disposition, l'arbre virtualisé et le focus restent écrits
      ici : la décision n'est pas close, son périmètre a rétréci.
    - >
      **L'archive ne se supprime pas.** La mesure des références entrantes ne trouve aucun orphelin
      parmi les 32 fichiers de `archive/`. Trois dépendances vivantes l'interdisent : l'epic ouvert
      `e04` est adossé à `archive/chantiers/K-clarte-des-prompts-et-skills-du-harnais.md`,
      `SCOPE_LATEST.yaml` cite `archive/chantiers/README.md` comme source de son format, et
      `TRACEABILITY.md`, que Preflight lit, pointe quatre fois dans `chantiers/` et `revues/`.
      Ce qui reste à trancher est seulement si `MILESTONES.md`, `ROADMAP.md`, `PLAN.md` et
      `MODELE-LOCAL.md` gardent une valeur, question de fond et non de place occupée.
    - >
      **Le bac à sable suit l'exemple de Pi, et le travail se conduit dans une session à lui.** La
      direction est arrêtée par le propriétaire ; ce qui reste est l'exécution, pas le choix. La
      question hésitait entre des backends écrits à la main, `@anthropic-ai/sandbox-runtime` et une
      micro-VM : `examples/extensions/sandbox/` livre les trois à la fois en 321 lignes, bâti sur
      `@anthropic-ai/sandbox-runtime` avec `sandbox-exec` sur macOS et `bubblewrap` sur Linux, et
      `gondolin/` porte la variante micro-VM. `docs/containerization.md` en donne les quatre motifs.

      Ce dont cette session-là aura besoin. `src/adapters/sandbox/` porte aujourd'hui 389 lignes
      écrites à la main, derrière `SandboxPort`. L'exemple remplace le `bash` intégré, mais indique
      lui-même la voie qui n'y touche pas — confiner par mutation de l'entrée sur `tool_call` — et
      c'est celle qui laisse la frontière de 495 où elle est. Le confinement ne se relâche pas :
      `CONVENTIONS.md` interdit qu'un backend non qualifié tourne sans confinement, et impose
      `capability_missing`. La mesure se conduit sous Apple Container et non Docker, sur signal du
      propriétaire, et jamais pendant qu'une campagne tourne — un changement de bac à sable change
      `environment_digest` et rend les campagnes antérieures non transférables. `NFR-05` en dépend :
      c'est la seule exigence [P0] aujourd'hui déclarée infermable, et un environnement Linux qui
      laisse créer un espace de noms utilisateur la rouvrirait. L'ADR s'écrit dans cette
      session-là, avec ce qui aura été mesuré, plutôt qu'ici sur une intention.
    - >
      **Que deviennent les deux contrôles retirés.** Pour `controle-du-bloc-fournisseur`, la réponse
      est acquise en principe : `examples/extensions/provider-payload.ts` rapporte en dix-huit lignes
      ce que ce contrôle déduisait du code distribué du fournisseur, et l'exemple était dans le
      paquet avant que le contrôle soit écrit. `e23s06` porte la reprise. Pour `controle-de-capsule`,
      le bénéficiaire est nommé dans `D-54` et reste valable : rien ne refuse aujourd'hui une story
      dite faite sans preuve.
    - >
      La déduction de racine des scripts bigpowers n'est tranchée que pour la porte de cohérence,
      remplacée par un contrôle du dépôt (`D-54`). Tout autre script invoqué à son chemin de paquet
      déduit sa racine de son propre emplacement, donc juge l'arborescence du paquet — ou
      `/opt/homebrew` — et non ce dépôt. `check-blind-spots.sh` est à abandonner ou à réécrire : sa
      table d'états est lue par une expression qui ne correspond jamais, et quatre de ses sept
      vérifications sont mortes. `completeness-critic.sh` exige des identifiants de story dans les
      sources, ce qui enfreint les instructions globales : dérogation à chaque story, ou abandon.
    - >
      **Deux artefacts de suivi sont l'œuvre de ces scripts et ne valent pas ce qu'ils affichent.**
      `specs/blind-spots.json` annonce `total_findings: 0` : ce zéro est celui d'un script dont
      quatre vérifications sur sept sont mortes, pas celui d'un dépôt sans angle mort.
      `specs/traceability-matrix.json` compte cinq stories quand l'epic en porte six, et
      `tagged_stories: 0`. Les deux datent du 2026-09-21 et aucun contrôle du dépôt ne les lit —
      ils ne trompent donc que le lecteur humain, et les régénérer avec les scripts en l'état
      produirait un faux apaisement plutôt qu'une mise à jour. À traiter avec le sort des scripts
      eux-mêmes.

      `bp-timing.sh` écrit ses mesures dans ce fichier par un aller-retour PyYAML, qui remplace les
      scalaires de bloc par du texte entre guillemets. Le défaut est confirmé à la source :
      `scripts/yaml-tools.py` du paquet lit par `yaml.safe_load` et réécrit par `yaml.safe_dump`,
      donc `bp-yaml-set.sh` détruirait ce handoff de la même façon — ce fichier s'édite à la main.
      À trancher : renoncer au chronométrage, ou déplacer les mesures hors de ce fichier.
