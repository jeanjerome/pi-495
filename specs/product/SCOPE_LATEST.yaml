# Périmètre du travail ouvert de 495 — PRD borné.
# Sources : specs/archive/ROADMAP.md §2, §3 et §5, specs/archive/TRACEABILITY.md,
# specs/archive/chantiers/README.md. Le texte normatif des exigences reste dans
# specs/archive/amont/expression-besoins.md ; ce fichier ne le restitue pas.

feature_name: Travail ouvert de 495 — seconde moitié de P0

core_value: >
  Rendre opposable sur une cible réelle ce que le noyau sait déjà décider, et fermer les cas où un
  changement aboutit alors qu'il ne devrait pas.

summary: >
  495 conduit un changement de Pi à travers des gates adossées à des preuves exécutées. Les
  incréments IT-0 à IT-4 sont livrés et qualifiés sur la machine de référence : un cycle complet va
  de la demande à l'acceptation sur une cible Maven, avec un modèle local, sous Seatbelt.

  Ce qui reste de P0 se répartit en deux natures. D'un côté, des capacités absentes du noyau : juger
  ce que vaut la référence elle-même (QLT-01..03, QLT-05, ARC-01..03), caractériser un existant peu
  testé sans consacrer ses défauts (PRE-04), faire évoluer la capacité de vérification à chaque
  incrément (PRE-05), déclencher une phase documentaire (RAG), et instruire toutes les disciplines
  applicables à un changement (EXP). De l'autre, dix travaux sortis des campagnes conduites sur des
  cibles réelles, qui portent moins sur des fonctions manquantes que sur des comportements de bord.

  L'ordre est commandé par un défaut de gravité particulière : une réponse humaine à une question
  matérielle est enregistrée, attribuée et portée au mandat sans atteindre les exigences, de sorte
  qu'un changement est accepté en rendant un contrat que son propriétaire n'avait pas décidé. Ce
  défaut ne fait échouer aucun parcours — il en fait réussir un qui ne devrait pas, ce qu'aucune
  gate ni aucun contrôle ne rattrape. Il passe donc devant tout le reste, à une réserve près : la
  qualification d'un second fournisseur de modèle le précède, non parce qu'elle prime en gravité,
  mais parce que la campagne qui établit ce défaut n'a pour témoin qu'un modèle local qui rend deux
  fois sur trois un rapport que le schéma refuse. Un instrument réparé avant de servir de preuve.

in_scope:
  - epic: e23-second-fournisseur-de-modele-qualifie
    source: spikes/organisation-des-quatre-chantiers
    objet: >
      Un second fournisseur de modèle est qualifié par le chemin d'abonnement que Pi expose déjà : la recette « le même cas de contrat passe avec deux fournisseurs qualifiés » est tenue sur un parcours complet et non plus par des preuves unitaires, le refus d'un profil incompatible avant une intervention facturée reçoit un effet, les budgets d'intervention sont remesurés sur un modèle frontière, la sortie de données vers le fournisseur est déclarée, et le bloc système que le fournisseur impose au-dessus des instructions locales est porté au manifeste de contexte comme contrainte extérieure.
    motif: >
      Aucun code n'est à écrire pour joindre le fournisseur : Pi consomme déjà un abonnement par jeton OAuth présenté en Bearer, sans frapper de clé d'API. Ce qui reste est ce que le harnais doit porter en conséquence. Tant que le modèle local est le seul témoin, une instruction mauvaise ne se distingue pas d'un modèle incapable, et les campagnes des epics suivants héritent de cette confusion.

  - epic: e24-ce-qui-existe-deja-est-etabli-avant-d-etre-reecrit
    source: specs/adr/D-55
    objet: >
      Avant qu'une capacité soit écrite, ce qui y répond déjà est établi et comparé : l'API et les
      paquets de Pi, les paquets construits pour Pi par d'autres, et ce qui existe hors de cet
      écosystème. L'étude cherche les candidats plutôt que d'en valider un — `pix-pretty`, du
      monorepo `pix-mono`, est un point de départ nommé et non une réponse : sous licence MIT, il
      publie `diff`, `diff-render`, `highlight`, `renderers`, `icons`, des vues d'arbre et des
      cadres modaux, et il est consommé par `pix-read`, `pix-bash` et `pix-edit`. L'epic livre, pour
      chaque besoin examiné, le candidat retenu ou l'absence de candidat, et la raison : réutiliser,
      s'inspirer de la forme, ou écrire — avec ce qui a été cherché et non trouvé quand on écrit.
      Les critères de choix sont dits avant d'être appliqués : ce que le besoin demande réellement,
      la licence, l'entretien du paquet, le poids qu'il ajoute, et ce à quoi il nous lie.
    motif: >
      Le coût de ne pas regarder est mesuré, pas supposé. Quatre défauts d'une seule surface ont été
      trouvés en lisant ce que Pi publiait déjà : un alignement faux sur les glyphes larges, les
      emojis et les accents combinants ; les touches Home, Fin, Suppr et les flèches modifiées
      arrivant en octets bruts ; des noms de fichier coupés dès que le relecteur réduisait le
      partage ; et la hauteur du terminal ignorée après un redimensionnement. Aucun n'aurait été vu
      autrement. Pi embarque hors ligne trente-sept pages de documentation et soixante-dix-sept
      extensions d'exemple, et 495 pose quatre accroches sur les trente-neuf publiées — compté sur
      `0.87.1`, la version épinglée.
      L'étude ne remplace pas `e08`, qui fait cesser la réimplémentation dans la revue elle-même :
      elle le précède et le déborde, puisqu'elle vaut pour toute capacité à venir et regarde
      au-delà de Pi. La clause de `e08` sur la règle de couches est par ailleurs dépassée :
      l'interdiction d'importer un paquet Pi depuis `presentation/` a été levée, et ne demeure que
      sur le noyau des exigences et décisions, où `NFR-07` la nomme.
    prior_art: |
      ## Prior Art

      | Besoin examiné | Candidat | Source | Verdict | Notes |
      |---|---|---|---|---|
      | Largeur de cellule (glyphes larges, emojis, accents combinants) | `visibleWidth`, `truncateToWidth`, `stripTerminalSequences` | `@earendil-works/pi-tui` (peer dep du dépôt) | **adopt — déjà fait** | `src/presentation/tui/review/measure.ts` les réexporte telles quelles ; son commentaire nomme la raison (« une deuxième implémentation ici se déciderait avec l'hôte sur les lignes qui comptent »). Défaut clos par `447c67e`. |
      | Décodage clavier (flèches, Home/Fin/Suppr, Page haut/bas en séquences d'échappement) | `parseKey` | `@earendil-works/pi-tui` | **adopt — déjà fait** | `src/presentation/tui/review/keymap.ts:9`. Défaut clos par `47fac58`. |
      | Colonnes de l'arbre gardées quel que soit le partage | — | — | **build — aucun candidat ne s'applique** | Négociation propre à 495 entre le partage demandé et les noms changés visibles (`D-33`, `SA-025`, `treeWidthNeeded` dans `tree-pane.ts`) ; elle s'appuie déjà sur `visibleLength`, donc sur `pi-tui`, pour la seule mesure. Défaut clos par `45c10a2`. |
      | Hauteur du terminal suivie après un redimensionnement seul | — | — | **build — aucun candidat ne s'applique** | Bug de clé de cache interne à `ReviewSurface.render` (la hauteur manquait à la clé à côté de la largeur), pas une capacité qu'un paquet fournirait. Défaut clos par `b866531`. |
      | Diff de lignes (Myers) et mise en évidence intraligne | package npm `diff` | dont dépend `pix-pretty/diff.ts` | **build — décision antérieure tenue** | `specs/adr/D-06` : dépendance de production écartée du domaine de revue par choix, pour garder exacts les segments `unchanged/old/new/intraline` que la spec exige. La réétude ne trouve pas de motif de la rouvrir. |
      | Rendu du diff en lignes de terminal | `renderUnified` de `diff-render.ts` ; `renderDiff` de Pi | `@xynogen/pix-pretty` ; `@earendil-works/pi-coding-agent` | **adopt — `pix-pretty`, décidé en `D-56`** | Ce qui interdisait les signes et les numéros de ligne était `conception-technique.md` §5.5, un choix de rendu que `specs/RELEVE_SPECS_LATEST.md` avait déjà nommé comme tel — `UX-07` ne prescrit aucune forme et délègue « la forme de la comparaison » au TUI. La clause est levée. La gouttière de `pix-pretty` tient ce que `UX-07` exige réellement ; son moteur dessinant à la largeur du terminal, la vue des modifications prend tout l'écran. Le candidat de Pi, plus sobre mais indifférent à la largeur, est écarté au même endroit. |
      | Dialogues d'arbitrage humain (confirmation, sélection, saisie, overlay) | `gate-overlay.ts`, `confirm.ts`, `modal-frame.ts` | `pix-pretty` | **aucun candidat retenu — besoin déjà couvert** | 495 appelle directement `ctx.ui.confirm`, `ctx.ui.select`, `ctx.ui.input`, `ctx.ui.custom` de Pi (`src/extension/command.ts:233`, `conduct.ts:66,77`, `session.ts:176`, `review-command.ts:14`). `gate-overlay.ts` nomme la porte d'autorisation d'une commande (consommé par `pix-gate`, `pix-sudo`, `pix-ssh`) : aucun rapport avec les gates G0..G6 de 495 malgré l'homonymie. |
      | Icônes par type de fichier | `icons.ts`, `icon-catalog.ts`, `icon-persist.ts` | `pix-pretty` | **aucun candidat retenu — besoin absent** | `tree-pane.ts:71` affiche un marqueur de statut par lettre (`SYMBOL[status]`), pas une icône par extension ; rien dans la revue n'appelle ce besoin aujourd'hui. |
      | Coloration syntaxique | `highlight.ts` (`cli-highlight`) | `pix-pretty` | **aucun candidat retenu — besoin absent** | La revue affiche du texte et des hunks, jamais du code coloré par langage. |

      **`pix-pretty` lui-même : deux forks, pas un paquet.** Aucun `pix-pretty` non scopé n'existe sur
      npm. Deux comptes GitHub publient le même monorepo `pix-mono` sous des scopes distincts :
      `@xynogen/pix-pretty` (65 versions, publiée il y a 4 jours, dépend de son propre
      `@xynogen/pix-runtime`) et `@dihak/pix-pretty` (4 versions, publiée il y a une semaine, tests
      livrés dans le tarball, dépend de son propre `@dihak/pix-data`). Les deux sont MIT et déclarent
      les mêmes peer dependencies que ce dépôt : `@earendil-works/pi-coding-agent` et
      `@earendil-works/pi-tui`. Le jour où un besoin réel adopterait l'un des deux, le choix du scope
      est une question distincte, avec son propre critère — pas tranchée ici faute de besoin.

      **Ce que l'étude confirme plutôt qu'elle ne le découvre.** Les deux défauts que la lecture de la
      documentation de Pi a fait corriger (largeur de cellule, décodage clavier) sont aussi les deux
      endroits où `pix-pretty` réutilise `pi-tui` au lieu d'écrire sa propre version — la discipline
      de `D-55` vaut donc pour le paquet tiers autant que pour 495.

      **Ce que coûte une adoption, mesuré sur celle qui a été faite.** `pix-pretty` publie ses sources
      TypeScript et aucun build, à toutes ses versions et sur ses deux forks. Trois conséquences, que
      `D-56` porte : ses sources ne compilent pas sous les réglages de ce dépôt, donc ses déclarations
      sont écrites à la main ; et Node refusant de typer-effacer un fichier sous `node_modules`, le
      paquet réclame `jiti` et le charge lui-même, ce qui fait une seconde dépendance d'exécution.
      Tenir ce point par un drapeau sur le lanceur de tests l'aurait laissé faux sous Pi, qui n'en
      pose aucun. S'y ajoutent dix-sept mégaoctets, une
      bibliothèque native inutilisée, et une vue qui prend tout l'écran parce que le moteur ne prend
      aucune largeur de son appelant. Le critère « le poids qu'il ajoute et ce à quoi il nous lie »
      n'est plus une formule : il a un prix chiffré.

      ---

      ## Prior Art — la frontière d'exécution

      **Ce que le besoin demande, écrit avant les candidats.** `SEC-01` veut un profil explicite de
      lecture, écriture, réseau, commandes, secrets et effets externes, l'absence de permission
      valant refus. `SEC-02` veut une frontière effective sur les fichiers, les sous-processus et le
      réseau, et dit que l'interception d'appels ou la seule séparation de processus ne suffisent
      pas. `SEC-05` veut une liste explicite des variables transmises et pas de secret sur la ligne
      de commande. `NFR-05` veut macOS Apple Silicon et Linux x86-64 qualifiés, et rien d'autre
      annoncé avant recette. Le refus `capability_missing` suppose de la frontière qu'elle rende son
      verdict *avant* d'exécuter : `SandboxPort.qualify` répond sans lancer de processus, et
      `CONVENTIONS.md` interdit qu'un backend non qualifié tourne sans confinement. Le port ajoute
      trois contraintes de forme que le besoin ne dit pas mais que le code tient : sept profils
      (`observe` à `integrate`), un réseau en tri-état `denied | loopback | allowed`, et
      « Never uses a shell ».

      Les critères de choix sont ceux de `e24s01` : ce que le besoin demande réellement, la licence,
      l'entretien du paquet, le poids ajouté, et ce à quoi l'adoption nous lie.

      | Besoin examiné | Candidat | Source | Verdict | Notes |
      |---|---|---|---|---|
      | Génération d'un profil de confinement macOS | `SandboxManager.wrapWithSandbox*` | `@anthropic-ai/sandbox-runtime` | **candidat, refusé en l'état** | Mesuré ici : le profil SBPL que le dépôt génère fait 21 lignes et 883 caractères ; celui d'ASRT en fait 263 et 16 950, calqué sur la politique du bac à sable de Chrome. Deux obstacles le refusent aujourd'hui, tous deux mesurés — voir plus bas. |
      | Confinement Linux | `bubblewrap` piloté par ASRT, avec `apply-seccomp` vendorisé pour `arm64` et `x64` | `@anthropic-ai/sandbox-runtime` | **candidat** | `BubblewrapSandbox` est écrit mais ne qualifie sur aucune machine : `NFR-05` reste la seule exigence [P0] déclarée infermable. ASRT ajoute le filtre d'appels système que le dépôt n'a pas. |
      | Confinement Windows | `srt-win.exe` (`arm64`, `x64`) et les contrôles WFP | `@anthropic-ai/sandbox-runtime` | **besoin absent** | `NFR-05` interdit d'annoncer Windows avant recette, et aucune campagne ne le vise. La capacité existe chez le candidat ; elle ne crée pas le besoin. |
      | Réseau en tri-état `denied / loopback / allowed` | `allowLocalBinding`, `allowUnixSockets`, `allowMachLookup` | `@anthropic-ai/sandbox-runtime` | **réutiliser, si adoption** | Le `loopback` que le dépôt écrit à la main en trois règles SBPL est un booléen de configuration chez le candidat. |
      | Politique réseau par domaine | `allowedDomains`, `deniedDomains`, `strictAllowlist`, `deniedResolvedAddresses` | `@anthropic-ai/sandbox-runtime` | **aucun candidat dans le dépôt — capacité absente** | Le tri-état du dépôt ne sait pas autoriser un hôte et un seul. Mesuré ici sur la version installée : allowlist vide → `curl: (56) CONNECT tunnel failed, response 403` en 23 ms ; `registry.npmjs.org` autorisé → sortie 0 en 78 ms ; le même refusé explicitement → 403 en 25 ms. |
      | Masquage des secrets transmis | `credentials.files`, `credentials.envVars`, modes `deny` et `mask` | `@anthropic-ai/sandbox-runtime` | **aucun candidat dans le dépôt — capacité absente** | Le processus confiné voit une sentinelle ; le proxy hôte substitue la vraie valeur à la sortie vers les hôtes déclarés. C'est la recette de `SEC-05` écrite comme capacité, là où le dépôt n'a que `env_allowlist`. Sur macOS le masquage de fichier dégrade en `deny`, le paquet le dit. |
      | Verdict de qualification rendu avant toute exécution | `isSupportedPlatform()`, `checkDependencies()` | `@anthropic-ai/sandbox-runtime` | **réutiliser, si adoption** | Mesuré sur cette machine : `isSupportedPlatform` rend `true`, `checkDependencies` rend zéro erreur et zéro avertissement. C'est la donnée que `qualify()` déduit aujourd'hui de `existsSync("/usr/bin/sandbox-exec")`. |
      | Attribution d'une violation à la commande qui l'a causée | `SandboxViolationStore`, `annotateStderrWithSandboxFailures`, étiquette de journal par commande | `@anthropic-ai/sandbox-runtime` | **aucun candidat dans le dépôt — capacité absente** | `startupIncident` distingue l'incident de confinement du test rouge en lisant les 400 premiers octets de `stderr` ; le candidat corrèle chaque violation observée à un identifiant d'invocation. |
      | Lancement hors shell, groupe de processus, délai, bornage de sortie | — | — | **écrire — tenu, et aucun candidat ne s'applique** | `runProcess` (150 lignes) tient `shell: false`, `detached`, `SIGTERM` puis `SIGKILL` après un sursis, et la troncature à `max_output_bytes`. C'est la forme que `ProcessObservation` exige ; aucun des candidats ne la rend. |
      | Frontière portant la session entière plutôt que le contrôle | micro-VM Gondolin ; Docker simple ; OpenShell ; Docker Sandboxes | `@earendil-works/gondolin` ; `docs/containerization.md` | **hors du besoin** | Les quatre motifs que `containerization.md` traite confinent le processus `pi`. 495 ne confine pas sa propre session : il confine les contrôles qu'il exécute, un par un, sous sept profils distincts. Un motif qui isole tout le processus ne rend pas les profils indépendants que `SEC-01` exige. |

      **Les candidats, mesurés sur la machine et non sur ce qu'une page annonce.**
      `@anthropic-ai/sandbox-runtime` est en `0.0.77`, publiée il y a quatre jours, la soixante-treizième
      depuis octobre 2025 ; licence Apache-2.0 ; elle publie un `dist/` construit et ses `.d.ts`, donc
      rien à réécrire à la main et aucun chargeur à réclamer — l'inverse exact de ce que `D-56` a payé.
      Installée dans un répertoire jetable hors du dépôt : 8,8 Mo pour le paquet, 16 Mo pour l'arbre
      de cinq paquets. `@earendil-works/gondolin` est en `0.12.0`, publiée il y a quatre mois, licence
      Apache-2.0, 2,9 Mo annoncés par le registre et non installés ici ; elle exige Node ≥ 23.6 et
      QEMU, **absent de cette machine**, donc elle n'est pas éprouvable ici sans installation
      préalable. L'extension d'exemple `sandbox/` (321 lignes) épingle ASRT `0.0.26`, publiée en
      janvier 2026 : quarante-neuf versions derrière ce que le registre sert aujourd'hui, et elle
      remplace l'outil `bash` intégré de Pi — un besoin qui n'est pas celui de 495.

      **Une estimation antérieure est corrigée.** `specs/spikes/organisation-des-quatre-chantiers.md`
      chiffrait l'adoption à « environ 390 lignes de génération de profil en moins ». Compté sur le
      code : les deux corps qui génèrent réellement un profil font 44 lignes — 31 pour le SBPL de
      Seatbelt, 13 pour les arguments de bubblewrap. Les 389 lignes de `src/adapters/sandbox/`
      comprennent aussi `runProcess` (150 lignes) et la qualification, que le candidat ne remplace
      pas : il rend une ligne de commande, pas une `ProcessObservation` bornée, expirée et tuée par
      groupe de processus. Le gain de code est réel mais dix fois plus petit qu'annoncé, et ce n'est
      donc pas là qu'il faut chercher le motif d'adopter : celui-ci est la politique réseau par
      domaine, le masquage des secrets et un `bubblewrap` entretenu ailleurs que chez nous.

      **Deux obstacles refusent l'adoption aujourd'hui, et aucun n'est de principe.**
      La licence d'abord : `node-forge`, dépendance d'ASRT, déclare `(BSD-3-Clause OR GPL-2.0)`.
      `scripts/check-distribution.ts` n'admet une licence duale que si *chaque* branche est sur la
      liste permissive, et `GPL-2.0` n'y est pas — `npm run lint:distribution` refuserait donc
      l'installation. Trois issues : porter `GPL-2.0` sur la liste, qui est une décision de licence et
      non un réglage ; obtenir du paquet qu'il déclare la branche retenue ; ou renoncer.
      Le shell ensuite : `wrapWithSandboxArgv` ne rend pas l'argv sans shell que son nom laisse croire.
      Mesuré ici, il rend `['/bin/bash', '-c', <18 712 caractères>]`, le troisième élément portant
      `env …` puis `sandbox-exec -p '(version 1) …'`. `SandboxPort.run` dit « Never uses a shell » et
      `runProcess` lance avec `shell: false` ; adopter le candidat tel quel remplacerait une exécution
      sans shell par une ligne de bash de dix-huit mille caractères, soit exactement la voie que
      `SEC-02` demande de confiner. L'`env` rendu à côté est l'environnement hôte complet et non une
      liste blanche, donc `buildEnv(profile.env_allowlist, profile.env)` serait contourné et `SEC-05`
      avec lui.

      **Une contrainte de couplage, trouvée en mesurant faux.** Le proxy qui tient la politique réseau par domaine
      tourne *dans le processus Node qui enveloppe la commande*. Un premier relevé attribuait
      au candidat un refus réseau en huit secondes ; la cause était `spawnSync` dans la sonde, qui
      bloque la boucle d'événements et empêche le proxy de répondre — y compris pour un domaine
      autorisé. Relancé en asynchrone, le même refus tombe en 23 ms. `runProcess` lance déjà en
      asynchrone, donc le dépôt satisfait la contrainte ; mais elle devient une contrainte du port et
      non un détail d'implémentation, et elle mérite d'être écrite avant qu'un appelant la brise.

      **Ce que l'étude ne tranche pas, et ce que chaque réponse coûterait.** La mesure sous
      **Apple Container** — présent sur cette machine en 1.4.1 — reste la condition de l'arbitrage, et
      elle ne se conduit pas pendant qu'une campagne tourne : `sandbox_backend` entre dans les faits
      d'environnement hachés en `environment_digest` (`src/application/environment.ts`), et
      `src/application/qualification.ts` écarte toute qualification portant un autre digest. Changer de
      backend rend les campagnes antérieures non transférables. Les trois réponses possibles :
      garder les 389 lignes écrites à la main ne coûte rien aujourd'hui et laisse `NFR-05` infermable
      côté Linux ; adopter ASRT derrière `SandboxPort` gagne la politique par domaine, le masquage de
      secrets, un `bubblewrap` entretenu ailleurs et l'attribution des violations, contre la levée
      des deux obstacles, 16 Mo, un proxy en processus et un digest d'environnement neuf ; router
      vers une micro-VM gagne une frontière plus forte, contre QEMU, Node ≥ 23.6 et une granularité
      qui est la session quand le besoin est le contrôle.

      ---

      ## Prior Art — ce que Pi tient déjà

      **Le critère, écrit avant les sujets.** `D-55` pose une question et une seule : le fait que 495
      établit lui-même, Pi le rapporte-t-il déjà ? Elle se tranche contre la version épinglée et non
      contre la documentation, qui décrit le Pi le plus récent. Le dépôt épingle
      `@earendil-works/pi-coding-agent` en `^0.87.0` et installe `0.87.0` ; tout chiffre qui suit est
      lu dans cet arbre-là.

      **Ce que la mesure donne, avant tout verdict.** Pi publie **39 accroches** à `0.87.0` — les
      surcharges `on(event: "…")` d'`ExtensionAPI`, dans `dist/core/extensions/types.d.ts`. 495 en
      pose **quatre** : `session_start`, `session_shutdown`, `session_before_switch`,
      `session_before_fork` (`src/extension/index.ts:18-21`). Le worker ne passe pas par les
      accroches — son `ResourceLoader` rend une liste d'extensions vide — mais par
      `session.subscribe`. Ce flux porte **23 sortes d'événements** (`AgentSessionEvent`,
      `dist/core/agent-session.d.ts`) ; `worker-main.ts` en lit **une**, `message_end`.

      **Trois décomptes antérieurs sont corrigés, et c'est la leçon plutôt qu'un détail.** Le motif
      de cet epic et `D-55` annonçaient « trente-huit accroches publiées », « trente et une pages de
      documentation » et « soixante-seize extensions d'exemple ». Recomptés à une règle écrite — les
      surcharges `on(event: "…")` d'`ExtensionAPI`, les fichiers `.md` de `docs/`, les entrées
      d'`examples/extensions/` hors `README.md` — les trois sont faux d'une unité : 39, 30 et 77.
      Les accroches sont le cas instructif, parce que le tarball de `0.86.1` est encore récupérable
      et répond : 37 à `0.86.1`, 39 à `0.87.0`, la différence étant exactement les deux événements
      que `D-55` nomme — `agent_before_settle` et `context_with_system`. Aucune des deux versions ne
      donne 38, et les deux autres comptes sont identiques sur les deux arbres, donc aucun des trois
      ne s'explique par le relèvement de version. Un décompte qui ne dit ni sa version ni sa règle ne
      se vérifie pas ; il se recopie.

      | Sujet | Ce que Pi tient | Ce que 495 écrit | Verdict | Motif |
      |---|---|---|---|---|
      | Compaction | `session_before_compact`, `session_compact`, `session_compact_failed`, `compaction_start`/`compaction_end` sur `subscribe`, `ctx.compact()`, `ctx.getContextUsage()` ; `docs/compaction.md` (463 lignes) ; `custom-compaction.ts`, `trigger-compact.ts`, `summarize.ts` | l'active et n'en enregistre rien (`worker-main.ts:304`) | **accroche manquante pour un besoin écrit** | `CTX-02` promet que le dossier dise ce qui a été mis devant le modèle ; une compaction réécrit ce que le modèle reçoit, après que le manifeste a été scellé. Et son appel au modèle est facturé hors du compteur. |
      | Confiance de projet | `project_trust`, `ctx.isProjectTrusted()`, `docs/security.md`, `project-trust.ts` | rien | **besoin absent — déjà fermé plus bas** | La confiance de projet garde le *chargement* de ressources de projet. Le worker n'en charge aucune : `ResourceLoader` explicitement vide, `SettingsManager.inMemory`, `.pi/` dans les exclusions, configuration lue en `~/.495/config.json`. C'est plus strict que refuser la confiance, qui laisse Pi charger `AGENTS.md` et `CLAUDE.md`. |
      | Rendu du lecteur | `registerMessageRenderer`, `registerEntryRenderer`, `registerMarkdownTransformer` ; `message-renderer.ts`, `entry-renderer.ts`, `built-in-tool-renderer.ts`, `truncated-tool.ts` | `registerMessageRenderer("495", …)` posé (`index.ts:23`) ; `reader-pane.ts` dessine le modèle de revue | **besoin couvert — une écriture morte relevée** | Ce que Pi rend est une entrée de transcription ; ce que `reader-pane.ts` rend est un fichier de la cible sous un mode de lecture. Deux objets, pas un doublon. En passant : `pi.appendEntry("495-binding", b)` (`session.ts:165`) est écrit une fois et relu nulle part — `resolveBinding` interroge le journal. |
      | Gardes de permission | `tool_call` rendant `{ block, reason }`, `tool_result`, `user_bash` ; `permission-gate.ts`, `confirm-destructive.ts`, `protected-paths.ts`, `dirty-repo-guard.ts` | `noTools: "all"` et des outils à lui ; la garde est dans l'outil (`PathGuard`, `worker-main.ts:31-56`), dans le budget (`:134-142`) et dans le profil de bac à sable | **besoin couvert plus bas — l'accroche ne s'applique pas** | Une accroche `tool_call` garde les outils de Pi. Le worker n'en active aucun : il n'y a rien à garder là où 495 écrit lui-même l'outil et exécute son corps sous profil. Un refus posé au-dessus de l'outil serait une seconde garde, pas la garde. |
      | Décisions humaines | `ctx.ui.confirm`/`select`/`input`/`custom`/`notify`, `ui_prompt_start`, `ui_prompt_end` ; `question.ts`, `qna.ts`, `questionnaire.ts`, `timed-confirm.ts` | appelle les dialogues de Pi directement (relevé en `e24s01`) ; déduit l'acteur de `node:os` | **dialogue couvert — identité : contournement non déclaré** | Pi rend le mode, le `hasUI` et l'identifiant de session, et aucune identité : ni `ExtensionContext` ni `ExtensionUIContext` ne portent d'utilisateur. `safeUser()` lit `userInfo().username` faute de mieux, et `ADR-014` veut la provenance fournie par l'hôte. Le contournement est légitime ; `D-55` demande qu'il nomme, là où il vit, ce qui a été cherché et non trouvé. |
      | Délégation | `examples/extensions/subagent/` — 1 547 lignes, un processus `pi` par enfant pour un contexte isolé, modes simple, parallèle et chaîné, sortie structurée ; `handoff.ts` | un compteur `delegations` initialisé à zéro en six endroits et jamais incrémenté | **prendre la forme avant d'écrire** | `AGT-05` [P1] veut des sous-budgets, une profondeur maximale, un plafond cumulatif et une annulation qui descend. L'exemple livré n'est pas réutilisable tel quel — il lance la CLI `pi`, quand 495 lance son propre worker — mais il donne la forme, qui est ce que le second volet de `D-55` demande de reprendre. C'est le seul sujet des six où rien n'est encore écrit : le moment de regarder est maintenant. |

      **La compaction est le seul écart qui coûte aujourd'hui.** Le worker l'active
      (`SettingsManager.inMemory({ compaction: { enabled: true }, retry: { enabled: true, maxRetries: 2 } })`)
      et n'observe rien de ce qu'elle produit. Deux conséquences, lues dans les déclarations de la
      version épinglée et non exécutées — c'est une lecture, et elle est écrite comme telle.
      D'abord le dossier : `CTX-02` fait promettre au manifeste ce qui a été mis devant le modèle, et
      il est scellé avant l'intervention ; une compaction remplace ensuite les premiers tours par un
      résumé que 495 n'a ni composé ni enregistré. Ensuite le compteur : `counters.tokens_known`
      n'additionne que `usage.totalTokens` des `message_end` d'assistant (`worker-main.ts:335`),
      alors que l'appel de résumé porte son usage sur `CompactionResult.usage`, rendu par
      `compaction_end`, et qu'un réessai automatique émet une requête de plus sans `message_end`
      supplémentaire. Le budget d'intervention sous-compte donc de tout le travail de résumé et de
      réessai.

      **Ce que l'observation coûterait, dit avant d'être proposé.** `InterventionEvent`
      (`src/ports/execution.ts:178-202`) est un ensemble fermé qui n'a de place ni pour une
      compaction ni pour un réessai : l'enregistrer est une modification de contrat, donc de
      `src/contracts/`, pas l'ajout d'un abonnement. Ce n'est pas un motif de ne pas le faire ; c'est
      le prix, et il appartient à l'epic qui porte `CTX-02`, pas à celui-ci.

      **Ce que 495 établit lui-même, relu sujet par sujet.** Le critère de `D-55` s'applique partout
      où le dépôt entretient une table, analyse un fichier ou relit du code tiers pour fonder un
      fait. Cinq endroits, contre la version épinglée :

      - `src/domain/imposed-layers.ts` — table entretenue à la main. Déjà relevée par `D-55`, et
        `e23s06` est ouverte pour la remplacer par une observation sur `before_provider_request`,
        accroche présente à `0.86.1` comme à `0.87.0`. Ce que la relecture ajoute : le contrôle que
        son commentaire nomme, `scripts/check-provider-system-block.ts`, n'est pas sur cette branche
        — il vit sur `controle-du-bloc-fournisseur` et `aaefb8f` l'a sorti de Preflight. La table est
        donc, aujourd'hui, une attente que rien ne confronte.
      - `scripts/check-declarations.ts` — la bonne forme, et elle sert de repère : il compile une
        sonde contre le paquet installé sans le mappage `paths`, de sorte que la comparaison est
        celle du compilateur et non d'une expression régulière. Aucune accroche Pi ne s'y applique :
        le paquet en cause est `pix-pretty`, pas Pi.
      - `scripts/check-distribution.ts` — lit les licences dans l'arbre installé. Pi ne rapporte pas
        la licence d'un autre paquet ; il n'y a pas d'accroche à chercher, et la lecture directe est
        la source.
      - `src/adapters/platform/paths.ts` — porte déjà la clause de contournement que `D-55` exige, et
        elle est vérifiée ici : `ExtensionContext` ne porte aucun emplacement de stockage, et Pi
        n'exporte que `CONFIG_DIR_NAME`, `getAgentDir`, `getPackageDir`, `getDocsPath`,
        `getExamplesPath` et `getReadmePath`. La clause tient.
      - `src/extension/session.ts` — `safeUser()` déduit l'acteur du système d'exploitation. Vérifié
        de la même façon : aucune identité d'utilisateur dans `ExtensionContext` ni dans
        `ExtensionUIContext`. Il manque la clause, pas la recherche.

      À l'inverse, deux faits sont déjà pris chez Pi plutôt que redits : `pi_version` vient de
      `VERSION` (`session.ts:79`) et de `pi.VERSION` (`worker-main.ts:100`), jamais d'un numéro écrit
      dans le dépôt.

      **Accroches posées contre accroches publiées.** Quatre sur trente-neuf ; trente-cinq absences.

      **Une accroche non posée n'est un défaut que si un besoin la réclamait.** Quatre le sont :
      `session_before_compact`, `session_compact` et `session_compact_failed` pour `CTX-02` et les
      budgets, `before_provider_request` pour la strate imposée, déjà ouverte par `e23s06`. Les
      trente et une autres ne nomment aucun besoin d'aujourd'hui, et trois le nomment même à
      l'envers : `session_info_changed`, `session_before_tree` et `session_tree` porteraient la
      session Pi dans le dossier, ce qu'`ADR-018` refuse. Reste une précision de forme, qui décide
      où se pose l'observation de la compaction : les accroches ne sont pas chargées *dans le
      worker*, dont la liste d'extensions est vide ; ce qui y est atteignable est `compaction_start`
      et `compaction_end` sur `session.subscribe`. L'accroche et l'événement ne sont pas au même
      endroit, et c'est l'événement qui s'applique.

      **Trouvé en passant, et laissé où il est.** `InterventionEvent` déclare un événement
      `checkpointed` que rien n'émet — seule la déclaration existe. Pi livre `git-checkpoint.ts`, qui
      pose un point de reprise par tour. Ce n'est pas un sujet de `D-55` : c'est une déclaration sans
      producteur, et elle appartient à l'epic qui voudra la tenir ou la retirer.

  - epic: e01-reponse-humaine-atteint-les-exigences
    source: chantiers/L
    objet: >
      Une réponse humaine à une question matérielle atteint l'artefact que la gate adopte, et un rapport qui défait une liaison sans poser de question dispose d'un recours.
    motif: >
      Un changement accepté rend 400 là où son propriétaire avait décidé 422, et le protocole gelé exige ce 400. La discrimination établit que l'oracle distingue le comportement nouveau de l'ancien, jamais qu'il distingue le bon contrat du mauvais.

  - epic: e02-sortie-refusee-garde-une-issue
    source: chantiers/F
    objet: >
      Une sortie d'intervention structurée mais refusée laisse au changement une issue, et un rapport complet et valide n'est plus perdu parce que la recherche part de la fin.
    motif: >
      A tué deux lancements sur quatre.

  - epic: e03-mandat-coherent-avec-sa-verification
    source: chantiers/J
    objet: >
      Le mandat n'interdit plus au producteur la vérification qu'il lui ordonne de conduire.
    motif: >
      Symptôme de e04 ; aujourd'hui seule une exclusion de workspace invisible depuis le prompt sauve le cas qui passe par Maven.

  - epic: e04-clarte-des-instructions-d-intervention
    source: chantiers/K
    requirements: [CTX-03]
    objet: >
      Les instructions portées à un producteur sont découpées et sélectionnées par rôle, au lieu d'un bloc unique ; la sélection tient compte de la phase en cours autant que du rôle, et des capacités déclarées du modèle, jamais de son nom ; les skills, modèles de prompts et références documentaires qu'elle assemble sont des ressources versionnées.
    motif: >
      Trois campagnes montrent qu'elles se contredisent ou se noient. Cause de e03. Le découpage par rôle, la dépendance à la phase et la dépendance au modèle visent un seul et même constructeur : les séparer produirait deux plans qui éditent la même fonction. L'axe modèle reste sans objet tant qu'un seul fournisseur est qualifié.

  - epic: e05-commande-de-test-d-une-cible-node
    source: chantiers/E
    objet: >
      Une cible Node voit sa commande de test lue depuis ce qu'elle déclare, et une copie de travail conserve ce dont ses dépendances ont besoin.
    motif: >
      Une cible en vitest ne passe pas ; aucune capacité n'est opposable sur une cible Node.

  - epic: e06-inventaire-des-cas-particuliers-d-un-arbre
    source: chantiers/H
    objet: >
      L'inventaire d'un arbre traite le sous-module et le fichier spécial, et la revue ne dépend plus d'un workspace que rien ne réclame.

  - epic: e07-lisibilite-d-un-changement-arrete
    source: chantiers/G
    objet: >
      L'état d'un changement, arrêté ou abouti, est lisible : une cause énoncée une fois, une notification sur la ligne décisive, des risques résiduels qui portent sur le candidat.

  - epic: e08-la-revue-s-appuie-sur-ce-que-pi-rend
    source: chantiers/I
    objet: >
      La revue cesse de réimplémenter ce que Pi rend déjà, sans affaiblir la règle de couches qui garde le modèle de revue indépendant du rendu.

  - epic: e09-etat-d-arret-et-session-conductrice
    source: chantiers/M
    objet: >
      Clore une intervention ne rend plus prêt un changement bloqué, et une seule session conduit un changement donné.

  - epic: e10-referentiel-de-qualite-d-une-cible
    source: chantiers/N
    requirements: [QLT-01, QLT-02, QLT-03, QLT-05]
    objet: >
      Le noyau sait dire ce que vaut une cible sur la qualité : conventions, seuils et contrôles définis par technologie et composant, existant mesuré avec les écarts localisés et les périmètres séparés, remise aux standards traduite en incréments priorisés, et conformité démontrée dans le seul périmètre réellement contrôlé.
    motif: >
      Les quatre ne sont pas livrables séparément : mesurer un existant suppose un référentiel adopté, et démontrer une remise en conformité suppose la baseline qui lui sert de point de départ.

  - epic: e11-architecture-cible-d-une-cible
    source: chantiers/N
    requirements: [ARC-01, ARC-02, ARC-03]
    objet: >
      Le noyau sait dire ce que vaut l'architecture d'une cible : diagnostic de l'architecture réellement présente avec ses angles morts déclarés, recommandation argumentée par les contraintes et non par un style, et migration traduite en étapes avec contrats de transition et retour arrière.
    motif: >
      Même chaîne : recommander une cible suppose le diagnostic de l'existant, et planifier une migration suppose la cible adoptée.

  - epic: e12-cartographie-des-controles-existants
    requirements: [PRE-01]
    objet: >
      La cartographie des contrôles d'une cible porte les assertions qu'ils tiennent réellement, au-delà de l'échelle de capacité à quatre niveaux déjà livrée.
    motif: >
      L'instabilité relève de VER-08, livré. Ce qui reste est la part assertions.

  - epic: e13-tests-de-caracterisation-d-un-existant
    requirements: [PRE-04]
    objet: >
      Un existant peu testé reçoit des tests de caractérisation et des jeux de référence avant transformation, en distinguant comportement observé et comportement voulu, sans consacrer un défaut existant comme exigence.

  - epic: e14-capacite-de-verification-par-increment
    requirements: [PRE-05]
    objet: >
      À chaque incrément, la couverture nécessaire est complétée et les contrôles nouveaux ou modifiés sont qualifiés avant de servir d'autorité d'acceptation, avec isolation des données de test et un corpus de contre-exemples réutilisables.

  - epic: e15-besoin-de-connaissance-identifie
    requirements: [RAG-01]
    objet: >
      Une phase documentaire se déclenche sur une technologie nouvelle, un changement de version, un manque de références ou des erreurs d'API ; les questions à résoudre sont enregistrées et le moyen justifié, sans prétendre mesurer ce qu'un modèle connaît.

  - epic: e16-corpus-officiel-versionne
    requirements: [RAG-02]
    objet: >
      La documentation correspondant aux versions utilisées est récupérée avec son origine, sa version, sa date, son empreinte et ses droits ; les références communautaires sont distinguées et une documentation indisponible ou ambiguë reste signalée.

  - epic: e17-utilisation-de-la-documentation-verifiee
    requirements: [RAG-04]
    objet: >
      Un choix technique se rattache à ses sources, et les usages d'API importants sont confrontés à des exemples exécutables, au compilateur, au typage ou à des tests de contrat.
    motif: >
      Une citation ne prouve pas que le code produit est correct.

  - epic: e18-disciplines-applicables-examinees
    requirements: [EXP-01]
    objet: >
      Pour un changement significatif, les disciplines à examiner sont déterminées, et chacune est traitée, déclarée non applicable avec motif, ou signalée comme restant à instruire.

  - epic: e19-choix-argumentes-avec-proportionnalite
    requirements: [EXP-02]
    objet: >
      Une décision importante porte ses contraintes, alternatives raisonnables, bénéfices, coûts, risques et moyens de validation ; un choix local réversible reçoit une justification courte.
    motif: >
      Ni la sophistication ni le nombre d'agents ne constituent un critère d'expertise.

  - epic: e20-expertises-mobilisees-et-verifiees
    requirements: [EXP-03]
    objet: >
      Un risque est associé au moyen d'analyse qui lui convient — règle automatique, documentation officielle, expérimentation, revue spécialisée ou décision humaine — et les désaccords comme les zones non maîtrisées sont explicités.
    motif: >
      Un rôle nommé « senior » ne garantit aucune compétence.

  - epic: e21-qualite-de-la-demarche-evaluee
    requirements: [EXP-04]
    objet: >
      Les recommandations et réalisations sont confrontées à des critères adoptés et à des cas de référence ; défauts, décisions contestées et reprises sont mesurés.
    motif: >
      Aucune équivalence avec une équipe senior ne se revendique sur des prompts de rôle ou des contrôles verts.

  - epic: e22-arbitrage-de-verifiabilite
    requirements: [IH-04]
    objet: >
      Un oracle insuffisant ouvre une demande de décision humaine portant l'obligation, la lacune, les options et le risque, avec pour issues préparer, assigner une revue humaine ou réviser l'exigence.
    motif: >
      Déclarée dans les contrats, mais exclue du constructeur de demandes de décision.

  - epic: e25-le-modele-choisi-dans-pi-est-autorise
    source: arbitrage du propriétaire, 2026-09-23
    requirements: [SEC-05]
    delta: MODIFIED
    objet: >
      Le modèle choisi dans Pi est autorisé. Le dossier enregistre le fournisseur employé et s'il est
      sur la machine ou hors d'elle, d'après l'adresse que Pi connaît du modèle. À l'ouverture de
      session, 495 signale un modèle hors de la machine : il prévient au lieu de bloquer.
    avant: >
      Une intervention dont le fournisseur n'est pas nommé dans `policy.egress` est refusée avant tout
      envoi. Sans cette clé, la liste ne nomme que `omlx`, sur la machine. La situation de chaque
      destination est ce que le propriétaire a écrit, et rien ne la confronte à l'adresse réelle.
    apres: >
      Le fournisseur du modèle choisi dans Pi est admis, et `config.json` ne porte plus aucune
      configuration de modèle : `policy.egress` et le défaut `omlx` disparaissent, et une clé restée
      dans un fichier existant est ignorée avec un diagnostic qui le dit. La situation du modèle est
      lue de l'adresse que Pi tient pour lui, portée au dossier et annoncée quand elle est hors de la
      machine. La politique de sorties réseau que SEC-05 demande de permettre, pour le canal modèle,
      est le choix du modèle dans Pi : 495 ne la double plus d'une liste à lui.
    motif: >
      Choisir un modèle avec `/model`, c'est déjà consentir à lui envoyer ce que la session contient ;
      la liste redemande ce consentement à la même personne, dans son propre répertoire de données.
      Elle ne borne que le canal de 495 : l'agent de Pi joint le même fournisseur dans la même
      session. Un projet qui imposerait son modèle par `.pi/settings.json` passe déjà par la
      confiance que Pi demande pour ce dossier. Et le défaut `omlx` est la configuration d'une seule
      machine : tout autre utilisateur est refusé au premier `/495 start`, et le README consacre une
      étape entière du démarrage à contourner ce refus. Pi porte l'adresse sur chaque modèle
      (`baseUrl`) : la situation peut être observée au lieu d'être déclarée.
    cout: >
      Retirer la liste, son chargement, la règle de refus et leurs tests, et écrire la décision qui
      remplace la déclaration obligatoire introduite par e23s01 et rend D-53 sans objet. Passer à un modèle
      distant n'est plus un acte propre à 495 : il suffit de le choisir avec `/model`.
    constat: >
      Le modèle est lu une fois, à la création du runtime de la session (`src/extension/session.ts`,
      `createRuntimeAt`, appelé au `session_start`) ; 495 n'écoute pas `model_select`, de sorte qu'un
      changement par `/model` en cours de session ne l'atteint pas. L'epic dit lequel des deux « le
      modèle choisi dans Pi » désigne : celui de l'ouverture de session, ou celui qui est sélectionné
      au moment de l'intervention.

out_of_scope:
  - item: Les trois revues obligatoires restantes (chantiers/B)
    raison: depends-on-external-factor
    detail: >
      Trois des six revues attendent une autorité ou un environnement qui n'existent pas ici. Les
      six dossiers existent et trois revues sont conduites.

  - item: Portabilité Linux qualifiée (NFR-05)
    raison: depends-on-external-factor
    detail: >
      Le backend Linux est implémenté et son refus éprouvé sur Linux, mais jamais exécuté en
      confinement. La machine de référence est macOS arm64 ; Linux n'est pas revendiqué.

  - item: Les autres angles de VER-04 — propriétés, fuzzing, contrats, tests différentiels et métamorphiques, activation selon le risque
    raison: deferred
    detail: L'angle mutation est livré. Le reste est au-delà de P0 (ROADMAP §3).

  - item: VER-07, IMP-01..04, CON-04, CON-05, RAG-03, RAG-05, ARC-05, REQ-05, AGT-05, AGT-07, GIT-04, EXT-05
    raison: deferred
    detail: >
      Au-delà de P0 (ROADMAP §3). Une capacité requise par un incrément P0 ne peut pas être écartée
      au motif qu'une intégration avancée est prévue ensuite — mais aucune de celles-ci ne l'est.

  - item: Un intégrateur dédié à un outil de mutation, de fuzzing ou d'indexation documentaire
    raison: deferred
    detail: >
      L'orchestration générique par le runner relève du socle ; les intégrations spécialisées
      viennent après (règle de cadrage, ROADMAP §3).

constraints:
  - "Aucune CI : tout se qualifie sur la machine de référence, `npm run check` en local avant chaque commit."
  - >
    Machine de référence macOS 27 arm64, Node 24.21, Pi 0.87.1 ; Linux non revendiqué. `node`
    alimente `environment_digest` autant que `pi_version`, et la machine présente Node 24 par un
    épinglage qui vit hors du dépôt, dans `~/.zshenv` (`D-50`) : aucun contrôle ne le vérifie.
  - >
    `devDependencies` suit la version de Pi que la machine de référence exécute — 0.87.1 pour les
    trois paquets `@earendil-works`. Un caret sur une version 0.x verrouille le mineur : laisser la
    borne en arrière fait tourner les tests contre une version et les campagnes contre une autre,
    sans qu'aucun contrôle le refuse. `pi_version` alimente `environment_digest`, donc une montée
    de version de la machine invalide le protocole gelé de tout changement en vol. Les autres
    dépendances suivent la dernière version publiée tant que Preflight reste vert ; `@types/node`
    fait exception et suit le plancher de `engines`, jamais la dernière publiée (`D-50`).
  - >
    Sur le chemin d'abonnement, Pi s'annonce au fournisseur sous `user-agent: claude-cli/2.1.280`
    et `x-app: cli` ; 495 ne compose pas ces en-têtes. Ce chemin est retenu pour la qualification
    sur la machine de référence, et aucun usage au-delà n'est revendiqué tant que la question n'a
    pas été instruite.
  - Preflight vert est une condition d'entrée, pas un objectif de sortie.
  - "Les travaux touchant au protocole gelé changent `environment_digest` et invalident le protocole d'un cycle en cours : ne pas les engager pendant qu'une campagne tourne."
  - Tout composant nouveau réclame un identifiant `CMP-*` inscrit au catalogue dans le même changement.
  - Une exigence devenue couverte s'inscrit dans la matrice de traçabilité, qui refuse une absence silencieuse.

success_criteria:
  - Un changement dont le propriétaire a décidé un contrat ne peut plus être accepté en rendant un autre contrat.
  - Une intervention dont la sortie est refusée dispose toujours d'une issue ; aucun lancement ne meurt sans recours.
  - Une cible Node va de la demande à l'acceptation comme la cible Maven le fait déjà.
  - Le noyau rend un jugement sur la référence elle-même, et pas seulement sur le candidat qui lui est opposé.
  - Chaque exigence sortie de l'état « absente » est inscrite dans la matrice avec la preuve qui la tient, et la règle de décision de livraison est appliquée en dix points.
  - Le même cas de contrat passe de bout en bout avec deux fournisseurs de modèle qualifiés, et le manifeste de contexte déclare toute strate d'instruction qu'un fournisseur impose sans que le harnais la choisisse.

