manual:
  method: >
    Four runs through a real `pi --mode rpc`, driven by ~/.495-campagnes/scripts/e25s03-drive.ts and
    run one after the other by e25s03-run.sh, each on its own data directory, its own clone of the
    minimal JS target and its own PI_CODING_AGENT_DIR, then read back read-only from the SQLite
    ledger and the export. The screen is read from the `notify` warnings Pi's RPC mode forwards, and
    the structured entry from the `495` messages. Two runs use the branch build; two use the build
    of main at fadf8f1 as negative controls, with the same script. Every data directory, database
    and export included, is then searched for `nip.io`, `:8000` and the API key.
  fiction_declared: >
    omlx-loin is the local endpoint reached by a public name, 127.0.0.1.nip.io, which DNS resolves to
    127.0.0.1. 495 reads the name, not what it resolves to, so it situates omlx-loin off this
    machine, as §5 says it must. Nothing left the machine. What this shows is that 495 reads,
    journals and announces the situation from the address Pi holds. It does not show a model that
    is really remote: that acceptance belongs to e25s04. The worker did reach the model under
    omlx-loin: the cost line of the specifying intervention's end, which the worker writes from the
    model it resolved, names omlx-loin/qwen3.8-27b-oq8e.
