        on_machine. `nip.io`, `:8000` and the key: absent from the whole data directory.
    - id: "chg_muf9zifgc0c19487c5"
      dossier: "~/.495-campagnes/e25s03-aller-negatif"
      code: "main, fadf8f1 — negative control"
      sequence: "The same as e25s03-aller."
      outcome: "accepted — closed, completed, G0..G5 PASS, 5 min 48 s"
      observed: >
        0 screen notices and 0 announcements over the whole run, although the specifying
        intervention ran under omlx-loin. The three intervention starts carry no location.
    - id: "none — no change is started"
      dossier: "~/.495-campagnes/e25s03-ouverture"
      code: "branch, db1173c"
      sequence: "Opened on omlx-loin/qwen3.8-27b-oq8e (the settings default); session replaced; /495 status twice."
      observed: >
        1 screen warning at opening; 1 more after new_session, for the replacing session, although
        Pi's RPC mode starts it twice. The first /495 status is answered with the announcement, once,
        then the status; the second with the status alone.
    - id: "none — no change is started"
      dossier: "~/.495-campagnes/e25s03-ouverture-negatif"
      code: "main, fadf8f1 — negative control"
      sequence: "The same as e25s03-ouverture."
      observed: "0 screen notices, 0 announcements."
  entries:
    note: >
      The same opening on omlx-loin, then `/495 status`, through `pi -ne --no-session -p` and
      `pi -ne --no-session --mode json`, with the same PI_CODING_AGENT_DIR as e25s03-ouverture.
      A first attempt passed `--mode json -p` as one unsplit zsh argument and printed nothing to
