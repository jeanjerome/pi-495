    HARNESS495_SCRIPTED_AGENT the specify intervention returns report 183 verbatim
    (~/.495-campagnes/scripts/e01s02-rapport-183.json), so that it loses Q1 and gains nothing. No
    real model lost Q1 a second time: in e01s01 the local model declared it at the first reopening.
    The scripted intervention still records the selected model omlx/qwen3.8-27b-oq8e in
    intervention.started, though no model was called. The resume campaign then calls the real model.
    Nothing left the machine.
