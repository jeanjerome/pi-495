security:
  scan: hand review over the diff against the merge base
  report: specs/security/REVIEW.md
  high_findings_confidence_ge_8: 0
  blocked: false
  established_not_assumed:
    - >
      The manifest reaches the worker process — the whole mandate is serialised into
      `{ type: "mandate", mandate, config }` (adapters/pi-worker/supervisor.ts:153) — and stops
      there: no file under src/adapters/pi-worker/ reads `mandate.context`. What the worker hands
      the model is `m.system_prompt` and `m.prompt`, nothing else.
    - >
      Measured on dist/, a context built with the layer and one built without produce byte-identical
      system_prompt, prompt and record, and the same prompt_digest. 0 extra bytes leave for the
      provider.

blind_spots:
  command: "scripts/check-blind-spots.sh (tool package)"
  exit_code: 0
  findings: { high: 0, medium: 0, low: 0 }
  trusted: false
  note: >
    The zero is vacuous and is recorded as such. Run at its package path the script reads
    /opt/homebrew/lib/node_modules/bigpowers/specs/execution-status.yaml, which does not exist, and
    exits 1. Run through a symlink gateway so it reaches this repository it exits 0 with zero
    findings — but its status table is parsed by
    `re.match(r'\s+(\S+):\s*"([^"]*)"', stripped)` applied to a line already stripped of its
    indentation. That match can never succeed, so the parsed table is always empty. Reproduced in
    isolation: the parser returns {} on this repository's own file. Four of its seven checks read
    that table — verify-gap, test-gap, epic-orphan, bootstrap-testless — and cannot fire. The three
    that do not depend on it — stale-tag, double-tag, sc-gap — are live, and their zero is real.
    The proof is not theoretical: e23s02 was marked done with no verification evidence at all, the
    exact condition its verify-gap check calls HIGH, and it reported zero findings.
  replacement: >
    The one HIGH check that mattered now lives in scripts/check-capsule.ts, which this repository
    owns and Preflight runs: a story marked done in execution-status.yaml must carry
    specs/verifications/<story>-verify.yaml. Verified to have teeth before this file existed — it
    refused, naming e23s02.
  corrects: >
    specs/verifications/e23s01-verify.yaml records blind_spots exit_code 0 with a note claiming the
    run was "against real data". That claim does not hold: the checks keyed on story status could
    not have fired then either.

completeness_critic:
  command: "scripts/lib/completeness-critic.sh (tool package, through the gateway)"
  exit_code: 1
  findings: { blocker: 1, warning: 0, filled: 1 }
  blocker: "active story e23s02 has zero explicit story-tag links"
  waived: true
  waiver_reason: >
    Structural conflict, not a gap in the work, and the same one e23s01 recorded as a known limit.
    The critic measures traceability by grepping story identifiers inside source files; the global
    instructions forbid exactly that — no ticket, chantier, lot or phase reference in code comments,
    commits or written content. The count cannot rise without breaking a standing rule. 495 traces
    requirement -> component -> evidence in specs/archive/TRACEABILITY.md instead, held green by
    scripts/check-traceability.ts, and CTX-02 gained its own row in this story.

