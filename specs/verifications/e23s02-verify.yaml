after_confirmation:
  - >
    2026-09-22, after the owner's confirmation: the capsule control was moved to its own branch
    (`controle-de-capsule`) and unchained from this branch's Preflight, which now runs eight lint
    controls rather than nine. The measurements above were taken while it was chained and are left
    as they were — they record what was run. What no longer holds on this branch is the sentence
    under `blind_spots` saying that control is chained and green: it is neither, here. Nothing else
    in this verification depended on it. D-54 carries the same note.
  - >
    2026-09-22, review round 3: three statements written above are wrong and are corrected in the
    documents that carry them rather than silently here. The ReDoS figure in `security.note` — "both
    expressions return in 0 ms" — measured the wrong input shape; the imposed-block expression is
    quadratic in repeated unmatched prefixes (0.9 ms at 13 KB, 50.4 ms at 105 KB), bounded by file
    size and not exploitable, but not what was written. `NFR-e23s02.json`'s claim of equality "over
    the whole imposed array" is equality over its double-quoted string literals only. The security
    review's failure-direction table overclaims on two rows for the same reason. The owner's
    confirmation rested in part on these sentences and was told so.

known_limits:
  - >
    The true subscription path was not exercised. Both campaigns reach a local endpoint; the
    anthropic one reaches it under a provider merely named anthropic. What Anthropic actually
    imposes is established separately, by lint:provider-block reading the provider's own shipped
    code. No single execution holds the two halves together, and that remains true.
  - >
    The control reads the packages the repository pins, not the one installed on the machine. The
    two agree today — the control was run against the installed tree as well and passed — but §18
    accepts not seeing that divergence in exchange for a control that never dodges.
  - >
    Pi documents `before_provider_request`, an extension hook that hands over the provider's request
    payload after it is built. It would let the dossier record what the model actually received
    instead of what the domain declares, and would close the over-declaration of §6f. That is
    e23s06, opened for it (D-55); this story's declarative approach stands until it lands.
  - >
    One refusal of the provider control — a declaration naming no token prefix at all — is exercised
    by hand and not covered by a test.
