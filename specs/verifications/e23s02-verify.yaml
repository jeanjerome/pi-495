manual:
  method: >
    The owner refused a walk resting on unit tests and module probes and asked for confirmation by a
    real execution in the harness. Two full campaigns were conducted through the built extension
    loaded from dist/, against the real local model, under the real sandbox, each accepted with the
    six gates passing — and one negative control. The dossiers were then read back read-only from
    their SQLite ledger and object store, the way a dossier reader would, not through any test
    helper.
  campaigns:
    - id: "chg_mubtj37ia3e0a8a347"
      provider: omlx
      dossier: "~/.495-campagnes/e23s02-uat-omlx"
      outcome: "accepted — G0..G5 PASS, unit=PASS, 3 interventions (specify, prepare, implement)"
      observed: "all 3 context artifacts carry imposed_layers present and empty"
    - id: "chg_mubtue1mfff8d2f5f6"
      provider: anthropic
      dossier: "~/.495-campagnes/e23s02-uat-anthropic"
      outcome: "accepted — G0..G5 PASS, 3 interventions, model selection recorded as provider_id anthropic"
      observed: >
        all 3 context artifacts carry the declared layer with its four fields, and the text actually
        handed to the model — fetched from the object store by prompt_digest — contains it in
        neither system_prompt nor prompt
      fiction_declared: >
        To exercise the declaring path without spending the owner's subscription quota, Pi was given
        an isolated agent directory (PI_CODING_AGENT_DIR) whose models.json defines a provider named
        anthropic served by the local endpoint. Everything else is real. What this run proves is
        that the harness declares what the domain knows about the provider Pi resolved; it does not
        and cannot prove that Anthropic imposed anything during it. That half is proven
        independently by lint:provider-block, which reads Anthropic's own shipped code.
    - id: "negative control"
      provider: anthropic
      outcome: "refused — blocked, policy_denied, before any intervention opened"
      observed: >
        Same isolated configuration without the egress declaration: POLICY_DENIED, "anthropic is not
        declared in policy.egress; declared destinations: omlx". This is what shows the accepted run
        passed the e23s01 gate rather than bypassing it, and that the two stories compose.
  confirmed_by_owner: null
  confirmed_at: null
  confirmation_note: >
    Pending. The real-run evidence the owner asked for is recorded above and presented for their
    confirmation; this field is not set until they give it.
  steps:
    - step: "La strate est nommée au manifeste, avec texte, position et condition (§5)"
      expected: "Le manifeste porte la strate, distincte des instructions composées"
      actual: "Dossier réel chg_mubtue1mfff8d2f5f6 — les 3 artefacts de contexte la portent, quatre champs ; trusted_instructions ne la contient pas"
      passed: true
    - step: "Un fournisseur qui n'impose rien déclare une liste vide, champ présent (6a)"
      expected: "imposed_layers = [] et le champ existe"
      actual: "Dossier réel chg_mubtj37ia3e0a8a347 — les 3 artefacts portent [] avec le champ présent"
      passed: true
    - step: "Une sélection de modèle non résolue ne déclare rien (6b)"
      expected: "Liste vide ; aucun diagnostic émis par le constructeur"
      actual: "test/v1/imposed-layers.test.ts pour la liste vide. La seconde clause tient à la forme : buildContext ne rend que {manifest, system_prompt, prompt, record} — il n'a pas de canal de diagnostic à ne pas employer"
      passed: true
    - step: "Un fournisseur jamais vérifié ne déclare rien (6c)"
      expected: "Liste vide, sans deviner"
      actual: "test/v1/imposed-layers.test.ts"
      passed: true
    - step: "Le texte imposé par le paquet a changé (6d)"
      expected: "Refus nommant le texte relevé et le texte déclaré"
      actual: "test/v3/provider-system-block.test.ts sur fixture au texte modifié"
      passed: true
    - step: "Le bloc n'est plus relevable dans le paquet (6e)"
      expected: "Refus quand même — la perte du moyen de vérifier n'est pas une preuve d'innocuité"
      actual: "test/v3/provider-system-block.test.ts sur fixture sans la forme ; deux autres refus tenus, plus d'une occurrence et répertoire absent"
      passed: true
    - step: "La condition est déclarée avec la strate, appliquée ou non (6f)"
      expected: "La condition est écrite en toutes lettres et ne dépend pas du chemin emprunté"
      actual: "Dossier réel — la condition est inscrite dans les 3 artefacts. « Appliquée ou non » tient à la forme : imposedLayersFor ne prend que l'identifiant de fournisseur, et la campagne réelle le montre — la condition est déclarée alors que rien ne l'imposait, l'endpoint étant local"
      passed: true
    - step: "Le dossier écrit porte la strate, le texte remis en reste exempt (§5)"
      expected: "Chaque artefact de contexte la porte ; l'enregistrement adressé par empreinte ne la contient pas"
      actual: "Dossier réel relu depuis SQLite et le magasin d'objets : 3 artefacts sur 3 la portent, et le texte remis au modèle ne la contient ni en système ni en invite"
      passed: true

gaps:
  closed: true
  open: []

known_limits:
  - >
    Aucune campagne n'a été conduite contre le vrai chemin d'abonnement. Ce qui est prouvé est que
    le harnais déclare ce que le domaine sait du fournisseur que Pi a résolu ; ce qu'Anthropic impose
    réellement est prouvé séparément, par lint:provider-block lisant le code distribué du paquet.
    Les deux moitiés ne se recouvrent pas : aucune exécution unique ne les tient ensemble
    aujourd'hui.
  - >
    La condition déclarée n'est pas observable par 495. La campagne réelle sur un endpoint local
    nommé anthropic en est la démonstration involontaire : la strate a été déclarée alors que rien
    ne l'imposait. C'est la sur-déclaration que le §19 de la story porte comme question ouverte.
  - >
    Le contrôle est lié à la sortie d'un minifieur — noms de variables compris. Une reconstruction
    du paquet sans changement de comportement peut le faire refuser. C'est la posture voulue, mais
    elle rend le refus ambigu : il dit que la forme a bougé, jamais laquelle des trois garanties.
  - >
    Deux gardes du paquet d'outils ne peuvent pas juger ce dépôt : la porte de cohérence, remplacée
    par check-capsule.ts (D-54), et le relevé d'angles morts, dont quatre vérifications sur sept
    sont mortes. Le critère de complétude, lui, tourne mais refuse une règle que les instructions
    globales interdisent de satisfaire.
