security:
  passed: true
  findings_at_or_above_confidence_8: 0
  report: "specs/security/REVIEW.md — second pass, appended"
  note: >
    The rewrite opened three surfaces the first review did not cover, and each was traced from input
    to sink rather than assumed. No regex injection: the three dynamic patterns in the capsule
    control interpolate either a section name that is a code literal at all nine call sites, or a
    story id already constrained by /^e\d+s\d+$/; the provider control interpolates an identifier
    captured by \w+. No catastrophic backtracking: measured at 1 000, 10 000 and 50 000 characters
    of pathological input, both expressions return in 0 ms, the alternation branches being disjoint.
    JSON.parse reads a string literal and builds no object, so there is no prototype-pollution
    surface, and it is guarded. Both controls are read-only and open nothing under the owner's Pi
    configuration.

blind_spots:
  ran: true
  usable: false
  note: >
    Reproduced again rather than asserted. `check-blind-spots.sh` of the tool package deduces its
    repository root from its own location, looks for execution-status.yaml at
    `<npx cache>/bigpowers/specs/execution-status.yaml`, does not find it — and exits 0. A gate that
    cannot fail is not a gate. Its one rule that mattered here lives in scripts/check-capsule.ts
    (D-54), which refuses a story called done in execution-status.yaml without evidence naming its
    own story_id, a verified_at, and phases that passed. That control is chained in Preflight and
    green.

completeness_critic:
  ran: false
  note: >
    Documented derogation, as for e23s01. It measures traceability by looking for story identifiers
    in the sources, which the global written-content rules forbid writing. The real traceability is
    requirement → component → evidence, and CTX-02 carries its own row.

nfr_gate:
  verdict: GO
  evidence: "specs/verifications/NFR-e23s02.json"
  note: >
    Re-measured, not carried over: the previous evaluation's performance figures described a control
    that scanned 275 files and 10.2 MB of a minified tree. The rewritten one reads 2 files and
    104.8 KB. The lookup was re-measured with its result consumed, the first attempt having been
    eliminated by the optimiser and reported a meaningless 0.00 µs.

manual:
  method: >
    The owner refuses a walk resting on unit tests and module probes. Two full campaigns were
    conducted again through the built extension loaded from dist/, against the real local model,
    under the real sandbox, plus one negative control. The dossiers were then read back read-only
    from their SQLite ledger and object store — the way a dossier reader would, not through any test
    helper. The earlier campaigns were not cited: they ran on Pi 0.86.1 and on code that predates
    even the first review round's fixes.
  campaigns:
    - id: "chg_mucf90gb6fc4f2c217"
      provider: omlx
      dossier: "~/.495-campagnes/e23s02-rev2-omlx"
      outcome: "accepted — closed, completed, G0..G5 PASS, 1/3 attempts, 3 interventions"
      observed: "all 3 context artifacts (specify, prepare, implement) carry imposed_layers present and empty"
    - id: "chg_mucfdr1n5d39e4d90e"
      provider: anthropic
      dossier: "~/.495-campagnes/e23s02-rev2-anthropic"
      outcome: "accepted — closed, completed, G0..G5 PASS, 1/3 attempts, 3 interventions"
      observed: >
        The ledger records provider_id anthropic on every intervention.started. All 3 context
        artifacts carry the declared layer with its four fields — condition, position, provider_id,
        text. None is folded into trusted_instructions. The text actually handed to the model,
        fetched from the object store by prompt_digest (three distinct digests), contains it in
        neither system_prompt nor prompt.
      fiction_declared: >
        To exercise the declaring path without spending the owner's subscription quota, Pi was given
        an isolated agent directory (PI_CODING_AGENT_DIR) whose models.json defines a provider named
        anthropic served by the local endpoint. Everything else is real. What this run proves is
        that the harness declares what the domain knows about the provider Pi resolved; it does not
        and cannot prove that Anthropic imposed anything during it. That half is proven
        independently by lint:provider-block, which reads the provider's own shipped code.
    - id: "negative control — chg_mucfam3c1936ed3a49"
      provider: anthropic
      dossier: "~/.495-campagnes/e23s02-rev2-negatif"
      outcome: "refused — blocked, policy_denied, no gate decided, 0/3 attempts"
      observed: >
        The same isolated configuration without the egress declaration: POLICY_DENIED, "anthropic is
        not declared in policy.egress; declared destinations: omlx". The ledger confirms zero
        intervention.started events, so nothing was opened before the refusal. This is what shows
        the accepted run passed the e23s01 gate rather than bypassing it, and that the two stories
        compose.
  confirmed_by_owner: true
  confirmed_at: "2026-09-22T09:05:53Z"
  confirmation_note: >
    Confirmed by the owner on the evidence above, which replaces the confirmation of
    2026-09-21T23:01:49Z: that one referred to revision fac24fe and carried over neither to this
    code nor to Pi 0.87.0. What was put in front of the owner is what they read back themselves —
    the anthropic dossier reopened read-only from its SQLite ledger and object store, the three
    context artifacts carrying the declared layer with its four fields, the three recorded prompts
    free of it, and the six gates. They also had the negative control and the declared fiction in
    hand. The confirmation does not extend to the true subscription path, which was not exercised;
    that limit is stated under known_limits rather than folded into this field.
    One fact of the reading is worth keeping: G2, which freezes the verification protocol, and G5,
    which judges the checks at the end, evaluated the same environment digest. The environment did
    not move under the campaign — the risk a version bump mid-flight would have created, and the
    one environment_changed exists to catch.
  steps:
    - step: "La strate est nommée au manifeste, avec texte, position et condition (§5)"
      expected: "Le manifeste porte la strate, distincte des instructions composées"
      actual: "Dossier réel chg_mucfdr1n5d39e4d90e — les 3 artefacts la portent, quatre champs ; trusted_instructions ne la contient pas"
      passed: true
    - step: "Un fournisseur qui n'impose rien déclare une liste vide, champ présent (6a)"
      expected: "imposed_layers = [] et le champ existe"
      actual: "Dossier réel chg_mucf90gb6fc4f2c217 — les 3 artefacts portent [] avec le champ présent"
      passed: true
    - step: "Une sélection de modèle non résolue ne déclare rien (6b)"
      expected: "Liste vide ; aucun diagnostic émis par le constructeur"
      actual: >
        test/v1/imposed-layers.test.ts pour la liste vide. La seconde clause tient à la forme :
        buildContext ne rend que {manifest, system_prompt, prompt, record} — il n'a pas de canal de
        diagnostic à ne pas employer
      passed: true
    - step: "Un fournisseur jamais vérifié ne déclare rien (6c)"
      expected: "Liste vide, sans deviner"
      actual: >
        test/v1/imposed-layers.test.ts, y compris les cinq identifiants qui nomment un membre hérité
        d'Object.prototype — la garde Object.hasOwn les refuse, ce que la première vérification ne
        couvrait pas puisqu'elle précédait ce correctif
      passed: true
    - step: "Le texte imposé par le paquet a changé (6d)"
      expected: "Refus nommant le texte relevé et le texte déclaré"
      actual: "test/v3/provider-system-block.test.ts sur fixture au texte modifié, et sur une part imposée surnuméraire que l'ancien contrôle ne voyait pas"
      passed: true
    - step: "Le bloc n'est plus relevable dans le paquet (6e)"
      expected: "Refus quand même — la perte du moyen de vérifier n'est pas une preuve d'innocuité"
      actual: "test/v3/provider-system-block.test.ts : huit refus tenus par des tests, dont aucune copie, copies en désaccord, et échappement indécodable"
      passed: true
    - step: "La condition est déclarée avec la strate, appliquée ou non (6f)"
      expected: "La condition est écrite en toutes lettres et ne dépend pas du chemin emprunté"
      actual: >
        Dossier réel — la condition est inscrite dans les 3 artefacts alors que rien ne l'imposait,
        l'endpoint étant local. Et le contrôle relie désormais la condition déclarée au code du
        fournisseur : une déclaration qui nommerait un autre préfixe de jeton est refusée, ce qui a
        été exercé à la main contre le paquet réel
      passed: true
    - step: "Le dossier écrit porte la strate, le texte remis en reste exempt (§5, §17 scénario 8)"
      expected: "Chaque artefact de contexte la porte ; l'enregistrement adressé par empreinte ne la contient pas"
      actual: "Dossier réel relu depuis SQLite et le magasin d'objets : 3 artefacts sur 3 la portent, et les 3 textes remis — trois empreintes distinctes — ne la contiennent ni en système ni en invite"
      passed: true
    - step: "Contrôle négatif : la porte d'e23s01 n'est pas contournée"
      expected: "Sans déclaration de sortie, refus avant toute intervention"
      actual: "chg_mucfam3c1936ed3a49 — policy_denied, aucune porte décidée, zéro intervention ouverte, vérifié au journal"
      passed: true

