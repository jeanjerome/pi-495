revision: 57cd3b3
revision_note: >
  The audit of eb9676c found two defects in how a refusal names unknown keys, neither letting a file
  through nor reproducing a value. Keys that are not short identifiers under one section gave the same
  text and were counted once: four of them under `policy` were said as one deviation, with no
  remainder. And a key holding `/` could take the place of an unknown key it points at once left
  unescaped: `{"policy":{"budgets/x":1,"budgets":{"x":1}}}` never named `policy.budgets.x` under the
  repository's copy of TypeBox, which escapes the pointer. The tests are 6e5401b, red in a detached
  tree (2 failures of 20 in test/v1/config-schema.test.ts, under Node 26.9.0); the fix is 57cd3b3:
  each deviation is kept, and a pointer is matched to the key it designates escaped before the one it
  designates unescaped. The v3 test 6e5401b adds, under Pi's copy, passes before and after the fix, as
  that copy points both keys at the same place; with the unescaped match removed from the fix, it
  fails, and so does the earlier v3 test of a key holding `/`. The terminal verdict below ran on
  57cd3b3. The campaigns were not replayed: the fix touches only how an unknown key is named and
  counted in a refusal, and the four v3 tests drive the refusal through a real Pi.

  Before, on eb9676c:
  The review of 7bd099b found a key holding `/` cited in the refusal under the copy of TypeBox Pi
  The review of 7bd099b found a key holding `/` cited in the refusal under the copy of TypeBox Pi
  hands the extension (specs/security/REVIEW.md, section e25s05). The test is 10293ed, red in a
  detached tree (1 failure of 3 in test/v3/config-refused.test.ts); the fix is eb9676c, green there
  (21 of 21 with test/v1/config-schema.test.ts): src/extension/config.ts reads an unknown key from the
  file along the schema instead of from the validator's pointer. The terminal verdict below ran on the
  working tree that became eb9676c. The campaigns ran on the build of 7bd099b, before the fix; the refusal runs
  were replayed on the fixed build (the `-corrige` runs), and the two full campaigns were not, since
  the fix touches only how an unknown key is named in a refusal.

