      actual: "e25s05-inconnue — refus à l'ouverture et sur chaque /495, aucun changement ; main démarre et adopte G3 par le noyau"
      passed: true
    - step: "policy.egress fait refuser le fichier, avec son motif (6a)"
      expected: "Aucun changement ; le motif ; aucune entrée reproduite"
      actual: "e25s05-egress — refus avec le motif, aucune entrée dans ce que Pi a reçu ; main avertit puis accepte"
      passed: true
    - step: "Une valeur invalide fait refuser le fichier sans être reproduite (6c)"
      expected: "Nomme policy.adoption.design et kernel ou human ; ne contient pas Human"
      actual: "e25s05-human et e25s05-registre — conformes ; main charge Human et allow_unconfined \"no\" comme vrai"
      passed: true
    - step: "Une section baseline partielle garde ses autres champs (6e)"
      expected: "La comparaison avec la référence reste active"
      actual: "e25s05-baseline — compare_to_reference true, une passe de référence ; main n'en fait aucune"
      passed: true
    - step: "L'exemple du README est complet et vaut les valeurs par défaut (§16)"
      expected: "Accepté par le schéma, chaque clé, configuration d'un fichier vide"
      actual: "Tests de test/v1/config-schema.test.ts ; en campagne, l'exemple charge sans diagnostic et fige la politique de comparaison par défaut"
      passed: true
    - step: "Un fichier corrigé est accepté après /reload (§5 étape 6)"
      expected: "Un changement peut démarrer"
      actual: "e25s05-inconnue — après /reload-runtime, changement accepted, G0..G5 PASS"
      passed: true
    - step: "Une clé qui n'est pas un identifiant court n'est pas citée (6b, §15)"
      expected: "« holds a key » sous sa section, rien de la clé"
      actual: "Réfuté à 7bd099b sous la copie de TypeBox de Pi ; conforme sur le correctif (e25s05-slash-src-corrige)"
      passed: true

