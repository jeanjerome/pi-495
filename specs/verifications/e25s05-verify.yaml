manual:
  method: >
    Runs through a real `pi --mode rpc`, driven by ~/.495-campagnes/scripts/e25s05-drive.ts and run
    one after the other by e25s05-run.sh, each on its own data directory holding the config.json of
    its case, its own clone of the minimal JS target, and an isolated PI_CODING_AGENT_DIR with the local
    model. Each sends `/495 status`, `/495 start`, then `/495 status`. The screen is read from the
    `notify` requests Pi's RPC mode forwards, the structured entry from the `495` messages, and the
    dossier read-only from SQLite and the object store. The written values of the file are then
    searched in what Pi received and in every file of the data directory but config.json. The same
    files and driver ran on the build of main at 770c7a9 as negative controls. The file is repaired
    through Pi's example command `/reload-runtime`, which calls `ctx.reload()`, the same
    `session.reload()` as the interactive `/reload`.
  runs:
    - id: "e25s05-egress"
      code: "branch, 7bd099b"
      config: '{"policy":{"egress":["egress-entree-privee","api.secret-host.example"]}}'
      observed: >
        Refused at opening on the screen, and answered by the same refusal on each /495: "policy.egress
        is no longer read, since the model selected in Pi is used". No state.sqlite, so no change. The
        two entries are absent from everything Pi received.
    - id: "e25s05-egress-negatif"
      code: "main, 770c7a9 — negative control"
      observed: "A warning that policy.egress is no longer read; /495 start runs to accepted."
    - id: "e25s05-human"
      code: "branch, 7bd099b"
      config: '{"policy":{"adoption":{"design":"Human"}}}'
      observed: >
        Refused: "policy.adoption.design must be kernel or human". No change. `Human` absent from
        everything Pi received.
    - id: "e25s05-human-negatif"
      code: "main, 770c7a9 — negative control"
      observed: >
        0 notices; accepted, G3 design adopted by the kernel, 0 decisions requested. The needle
        `Human` is found in the dossier only in 495's own prompts ("Human-facing text must be written
        in French"), not as the written value.
    - id: "e25s05-registre"
      code: "branch, 7bd099b"
      config: >
        {"policy":{"adoption":{"design":"Human"},"integration_enabled":"false","baseline":"x"},
        "isolation":{"allow_unconfined":"no","clé secrète du propriétaire":true}}
      observed: >
        Refused: "policy.adoption.design must be kernel or human; policy.integration_enabled must be
        a boolean; policy.baseline must be an object; and 2 more". No change. Neither `Human` nor the
        key is reproduced.
    - id: "e25s05-registre-negatif"
      code: "main, 770c7a9 — negative control"
      observed: >
        `allow_unconfined: "no"` is read as true: the screen warns that the unconfined backend is not
        qualified, and the change is blocked in preparing with capability_missing.
    - id: "e25s05-inconnue"
      code: "branch, 7bd099b"
      config: '{"policy":{"adoptoin":{"design":"human"}}}, then the README example'
      observed: >
        Refused at opening and on /495 status and /495 start: "policy.adoptoin is not a known setting".
        The file replaced by the README example, /reload-runtime, then /495 start: chg_mufkhgq3c0056b1154
        accepted, G0..G5 PASS, 1/3 attempts, 4 min 15 s; 0 notices and 0 diagnostics after the reload;
        G0..G3 adopted by the kernel; frozen baseline equal to the default policy; 1 reference pass.
    - id: "e25s05-inconnue-negatif"
      code: "main, 770c7a9 — negative control"
      observed: >
        0 notices; accepted, G3 design adopted by the kernel, 0 decisions requested: the design the
        owner meant to keep for a human goes to the kernel without a word.
    - id: "e25s05-baseline"
      code: "branch, 7bd099b"
      config: '{"policy":{"baseline":{"tolerance":"no_aggravation"}}}'
      observed: >
        Accepted, chg_mufkn2rc69d5a3799b. Frozen protocol baseline: compare_to_reference true, the
        three other fields at their defaults; 1 reference pass recorded.
    - id: "e25s05-baseline-negatif"
      code: "main, 770c7a9 — negative control"
      observed: >
        Accepted, but the frozen baseline is {"tolerance":"no_aggravation"} alone, and no reference
        pass is recorded: the comparison is dropped.
  replayed_on_fix:
    note: >
      The same driver on the build of the fixed working tree, runs without a model. `slash` holds
      {"sk-q8v2x7/token":1,"policy":{"zq8v2/key":1,"adoption/design":"x"},"policy/egress":["egress-entree-privee"]}.
    results:
      - { run: "e25s05-egress-corrige", observed: "the same refusal as e25s05-egress, entries not reproduced" }
      - { run: "e25s05-human-corrige", observed: "the same refusal as e25s05-human, Human not reproduced" }
      - { run: "e25s05-registre-corrige", observed: "the same refusal as e25s05-registre, and 2 more, nothing reproduced" }
      - run: "e25s05-slash-src-corrige"
        observed: >
          Loaded from src/, under Pi's copy of TypeBox: "the file holds a key that is not a known
          setting; policy holds a key that is not a known setting". `q8v2` and the egress entry absent.
          The same file before the fix, by `pi --mode json` on src/: "sk-ant-api03-SECRET.token is not
          a known setting" for the key of the review.
      - { run: "e25s05-slash-dist-corrige", observed: "the same refusal from dist/" }
  confirmed_by_owner: true
  confirmed_at: "2026-09-24T13:59:00Z"
  confirmation_note: >
    Confirmed by the owner on the runs above, the negative controls, the replays on the fix and the
    known limits.
  steps:
    - step: "Un fichier valide est chargé comme avant (6f)"
