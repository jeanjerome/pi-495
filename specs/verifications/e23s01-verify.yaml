known_limits:
  - >
    La seconde vérification, à l'entrée de run(), ne peut plus garder le journal propre :
    l'intervention y est déjà inscrite. Elle arrête le worker, rien de plus. Le dernier point avant
    que les octets partent reste l'adaptateur, qui ne reçoit aucune politique.
  - >
    readEgress valide la forme de la déclaration, mais aucun autre champ de la politique ne l'est.
    Un budget ou un seuil malformé passe encore par un cast sans contrôle.
  - >
    exportChange accepte options.secret_patterns ; un motif à groupe de capture fourni par un
    appelant contournerait la garde de la tâche 4. Aucun appelant existant ne le fait.
  - >
    La traçabilité story → code de bigpowers repose sur un grep d'identifiants de story dans les
    sources. CLAUDE.md interdit ces références dans le contenu écrit, donc link_count vaut 1 avec
    une confiance « low » et ne peut structurellement pas monter. La traçabilité réelle de 495 est
    exigence → composant → preuve, dans specs/archive/TRACEABILITY.md, tenue verte par
    scripts/check-traceability.ts.
