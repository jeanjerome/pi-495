manual:
  method: >
    495 has no user-facing surface of its own to click through: it is a Pi extension with no
    standalone entry point. The honest form of UAT here is a walk of every Gherkin scenario in §17
    of the story spec against the named evidence that exercises it, presented to the owner for
    confirmation.
  confirmed_by_owner: true
  confirmed_scope_note: >
    La confirmation a porté sur les six scénarios de la révision 105d2d3. Trois commits de relecture
    croisée ont touché le code depuis — 158f014, 095e044, c622ec3 — et deux d'entre eux ont changé
    du comportement, pas seulement de la prose : le refus est devenu reprenable et a gagné une
    action, et une déclaration malformée est passée du repli au refus, ce qui déplace la frontière
    du scénario 6c. Le scénario 6e a par ailleurs été resserré — « aucun objet textuel du dossier »
    au lieu de « aucun fichier du dossier » — parce que l'expurgation ne touche que les objets
    textuels du magasin. La confirmation reste vraie de ce qu'elle a jugé ; elle n'a pas été
    redemandée sur l'état actuel, et ce champ ne prétend pas le contraire.
  confirmed_at: "2026-09-21T15:15:50Z"
  steps:
    - step: "Une destination déclarée ouvre l'intervention (§5)"
      expected: "Le superviseur poursuit sur la vérification de capacité ; le profil du mandat refuse toujours le réseau"
      actual: "test/v1/egress.test.ts — « carries a declared destination through to the capability check that already existed » ; profil denied tenu par test/v2/telemetry.test.ts, passé inchangé"
      passed: true
    - step: "Une destination non déclarée est refusée avant tout engagement (6a)"
      expected: "POLICY_DENIED levé ; aucun worker démarré ; aucune intervention ouverte"
      actual: "test/v1/egress.test.ts — « is refused before the provider is reached and before any worker is started » ; probed=[] et started=[]"
      passed: true
    - step: "Une liste vide refuse toute intervention et le dit (6b)"
      expected: "POLICY_DENIED ; le message nomme la liste vide plutôt que la destination"
      actual: "test/v1/egress.test.ts — « names an empty declaration as the cause, rather than listing nothing »"
      passed: true
    - step: "Une configuration partielle ne vide pas la liste (6c)"
      expected: "La liste par défaut est gardée ; une configuration qui nomme la liste la remplace entièrement"
      actual: "test/v1/egress.test.ts — deux tests, « keeps the declaration… » et « replaces the declaration entirely… »"
      passed: true
    - step: "Un secret du contrôleur n'emprunte pas le canal modèle (6d)"
      expected: "Le secret n'atteint ni l'environnement du worker ni le texte remis au modèle"
      actual: "test/v1/egress.test.ts — « hands it a closed set of variables, carrying no secret of the controller » (vrai sous-processus) et « composes only from what it was handed, carrying no value of the controller's environment » ; le test prouve d'abord que le texte porte bien ses marqueurs, pour qu'une absence ne soit pas une tautologie"
      passed: true
    - step: "Un secret retiré du dossier est signalé sans être divulgué (6e)"
      expected: "Le secret n'apparaît dans aucun objet textuel du dossier ; le signalement porte emplacement et compte, jamais la valeur"
      actual: "test/v2/export-integration.test.ts — « names what a redaction removed by location and count only, never by value » ; la garde de type qui accompagnait ce scénario a été retirée depuis la confirmation, comme fragile"
      passed: true

gaps:
  closed: true
