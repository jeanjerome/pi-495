    wsjf: 12.0
    wsjf_inputs: { business_value: 8, time_criticality: 7, risk_reduction: 9, job_size: 2 }
    capsule_dir: epics/e23-second-fournisseur-de-modele-qualifie
    wsjf_note: >
      Score le plus élevé de l'index, et la ROADMAP §5 lui est antérieure. Placé en tête non parce
      qu'il prime en gravité sur e01, mais parce qu'il répare le témoin sous la campagne de e01
      elle-même. Décision en specs/adr/D-46.
  - id: e24
