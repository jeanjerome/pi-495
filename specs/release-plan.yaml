# Index des epics du travail ouvert de 495.
# Dérivé de specs/product/SCOPE_LATEST.yaml — les identifiants y font foi.

release:
  version: "0.2.1"          # version courante du package, publiée sur npm le 2026-09-25 et étiquetée v0.2.1 ; la 0.2.0 et la 0.1.0 sont étiquetées v0.2.0 et v0.1.0
  codename: "Seconde moitié de P0"
  status: planning
  semantic_release: false   # ni CI ni semantic-release dans ce dépôt : la version est posée à la main
  bump_hint: minor

ordering:
  authority: specs/archive/ROADMAP.md §5
  note: >
    La liste est en ordre d'exécution, pas en ordre WSJF décroissant. L'ordre des huit premiers
    est celui que la ROADMAP argumente — « l'ordre n'est pas une préférence ». Le score WSJF est
    calculé et conservé pour chaque epic ; là où il aurait classé autrement, un champ wsjf_note
    le dit. Aucun score n'a été ajusté pour reproduire l'ordre.
    e23 est postérieur à la ROADMAP, qui ne le séquence donc pas : sa place est décidée par
    arbitrage et portée par son wsjf_note.
  formula: "(business_value + time_criticality + risk_reduction) / job_size"

capsules:
  status: partial
  note: >
    Quatre capsules existent, e23, e24, e25 et e26 ; les autres répertoires capsule_dir restent des
    emplacements prévus. Une capsule s'écrit au moment d'attaquer son epic, pas pour les 22
    d'avance. Celle de e24 fait exception et le dit : elle a été écrite après ses deux premières
    stories, sur un travail déjà livré. Le gabarit qui manquait à leur écriture est désormais sous
    specs/references/ et Preflight l'oppose aux stories (D-51).

epics:
